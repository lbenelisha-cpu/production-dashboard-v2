  const STORAGE_KEY = 'production_entries'; // מפתח legacy ישן (שמכיל את כל הרשומות בבלוב אחד) — נשמר לתאימות לאחור בלבד
  const ENTRIES_KEY_PREFIX = 'entries_month:'; // כל חודש נשמר בנפרד כדי שכל שמירה תהיה קטנה ומהירה, גם כשיש עשרות אלפי רשומות
  const ENTRIES_INDEX_KEY = 'entries_months_index_v1'; // רשימת החודשים שבהם יש בפועל רשומות שמורות
  const STORAGE_KEY_TARGETS = 'packaging_targets';
  const STORAGE_KEY_PROD_TARGETS = 'production_targets';

  const STORAGE_KEY_QUALITY = 'quality_ud_data_v1';

  let targetFileRows = [];

  function migrateFacilityKey(obj){
    let changed = false;
    Object.keys(OLD_TO_NEW_FACILITY).forEach(oldKey=>{
      const newKey = OLD_TO_NEW_FACILITY[oldKey];
      if(obj[oldKey] !== undefined){
        if(obj[newKey] === undefined) obj[newKey] = obj[oldKey];
        delete obj[oldKey];
        changed = true;
      }
    });
    return changed;
  }

  function migratePackagingTypeKeys(packagingTargetsObj){
    let changed = false;
    Object.keys(packagingTargetsObj).forEach(topKey=>{
      const typeObj = packagingTargetsObj[topKey];
      if(!typeObj || typeof typeObj !== 'object') return;
      Object.keys(OLD_TO_NEW_PACKAGING_TYPE).forEach(oldType=>{
        const newType = OLD_TO_NEW_PACKAGING_TYPE[oldType];
        if(typeObj[oldType] !== undefined){
          if(!typeObj[newType]) typeObj[newType] = {};
          SHIFTS.forEach(s=>{
            const oldVal = typeObj[oldType][s] || 0;
            const newVal = typeObj[newType][s] || 0;
            if(oldVal>0) typeObj[newType][s] = newVal + oldVal;
          });
          delete typeObj[oldType];
          changed = true;
        }
      });
    });
    return changed;
  }

  function entryMonthKey(dateISO){
    const ym = (dateISO && dateISO.length >= 7) ? dateISO.slice(0, 7) : 'unknown';
    return ENTRIES_KEY_PREFIX + ym;
  }

  async function loadEntries(){
    entries = [];

    // באתר החי: מקור האמת הוא האחסון המשותף. localStorage אינו מוצג לפני הענן.
    if(!IS_LOCAL_FILE){
      try{
        const idxRes = await _dashStorage.get(ENTRIES_INDEX_KEY);
        const months = idxRes && idxRes.value ? JSON.parse(idxRes.value) : [];
        if(Array.isArray(months) && months.length){
          // V4.8.20: month names alone are NOT a data version. If rows change inside
          // an existing month, the old IndexedDB cache would otherwise remain valid
          // on another PC. Include the cloud sync version in the cache signature.
          let productionVersion='';
          try{
            const vr=await _dashStorage.get(PRODUCTION_SYNC_VERSION_KEY,{fresh:true});
            productionVersion=vr&&vr.value?String(vr.value):'';
          }catch(e){}
          entries = await cachedRows('production_entries', 'months:'+months.join(',')+'|production:'+productionVersion, async ()=>{
            const out=[];
            setLoadStatus('מוריד נתוני ייצור מהשרת...');
            const pairs = await _dashStorage.getMany(months.map(m => ENTRIES_KEY_PREFIX + m),{fresh:true});
            pairs.forEach(pair=>{
              const r = pair && pair.result;
              if(r && r.value){ try { appendAll(out, JSON.parse(r.value)); } catch(e){} }
            });
            return out;
          });
        }else{
          // תאימות לגרסה הישנה שבה כל הרשומות נשמרו במפתח אחד.
          const legacy = await _dashStorage.get(STORAGE_KEY).catch(()=>null);
          if(legacy && legacy.value){ try { entries = JSON.parse(legacy.value); } catch(e){} }
        }
      }catch(e){
        console.error('Shared entries load failed:', e);
        showToast('לא ניתן לטעון את הנתונים המשותפים מהשרת: '+(e.message||e), true);
      }
    }else{
      // רק בהרצה ישירה מהמחשב משתמשים באחסון המקומי.
      try{
        const idxLocal = localStorage.getItem(ENTRIES_INDEX_KEY);
        const months = idxLocal ? JSON.parse(idxLocal) : [];
        if(Array.isArray(months) && months.length){
          months.forEach(m=>{
            const raw = localStorage.getItem(ENTRIES_KEY_PREFIX + m);
            if(raw){ try { entries = entries.concat(JSON.parse(raw)); } catch(e){} }
          });
        }else{
          const legacy = localStorage.getItem(STORAGE_KEY);
          if(legacy){ try { entries = JSON.parse(legacy); } catch(e){} }
        }
      }catch(e){ entries=[]; }
    }

    loaded = true;

    let migrated = false;
    entries.forEach(e=>{
      if(e.facility && OLD_TO_NEW_FACILITY[e.facility]){
        e.facility = OLD_TO_NEW_FACILITY[e.facility];
        e.plant = getPlant(e.facility);
        migrated = true;
      }
      if(e.packagingType && OLD_TO_NEW_PACKAGING_TYPE[e.packagingType]){
        e.packagingType = OLD_TO_NEW_PACKAGING_TYPE[e.packagingType];
        migrated = true;
      }
      if(e.orderType === undefined){ e.orderType=''; migrated=true; }
    });
    if(migrated && isAdmin) await persist();
  }

  async function loadTargets(){
    let loadedTargets = null;
    try {
      const res = await _dashStorage.get(STORAGE_KEY_TARGETS);
      loadedTargets = res && res.value ? JSON.parse(res.value) : null;
    } catch(e){
      try { const local = localStorage.getItem(STORAGE_KEY_TARGETS); loadedTargets = local ? JSON.parse(local) : null; }
      catch(e2){ loadedTargets = null; }
    }
    if(loadedTargets){
      const isOldFlatFormat = PACKAGING_TYPES.some(p => loadedTargets[p] !== undefined);
      if(isOldFlatFormat){
        const migrated = defaultPackagingTargets();
        migrated[GENERAL_KEY] = loadedTargets;
        packagingTargets = migrated;
        await persistTargets();
      } else {
        const facilityKeysMigrated = migrateFacilityKey(loadedTargets);
        const typeKeysMigrated = migratePackagingTypeKeys(loadedTargets);
        packagingTargets = loadedTargets;
        if(facilityKeysMigrated || typeKeysMigrated) await persistTargets();
      }
    } else {
      packagingTargets = defaultPackagingTargets();
      await persistTargets();
    }
  }

  function normTargetHeader(v){ return String(v??'').trim().toLowerCase().replace(/[\s_\-\/\\().]+/g,''); }
  function targetHeaderIndex(headers, aliases){
    const hs=headers.map(normTargetHeader); for(const a of aliases){ const i=hs.indexOf(normTargetHeader(a)); if(i>=0)return i; } return -1;
  }
  function monthNorm(v){
    if(v instanceof Date && !isNaN(v)) return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0');
    const t=String(v??'').trim(); if(!t)return '';
    let m=t.match(/(20\d{2})[\/.\-](\d{1,2})/); if(m)return m[1]+'-'+String(+m[2]).padStart(2,'0');
    m=t.match(/(\d{1,2})[\/.\-](20\d{2})/); if(m)return m[2]+'-'+String(+m[1]).padStart(2,'0');
    const en={jan:1,january:1,feb:2,february:2,mar:3,march:3,apr:4,april:4,may:5,jun:6,june:6,jul:7,july:7,aug:8,august:8,sep:9,september:9,oct:10,october:10,nov:11,november:11,dec:12,december:12};
    m=t.toLowerCase().match(/\b(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\b[^0-9]*(20\d{2})/i);
    if(m){ const k=m[1].toLowerCase(); return m[2]+'-'+String(en[k]||0).padStart(2,'0'); }
    return '';
  }
  function targetPackagingTypeFromLabel(label){
    const t=String(label||'').toLowerCase().replace(/\s+/g,' ');
    if(/\b1\s*(?:l|lt|ltr|liter|litre)\b/.test(t)) return 'קו אריזה 1 ליטר';
    if(/\b5\s*(?:l|lt|ltr|liter|litre)\b/.test(t)) return 'קו אריזה 5 ליטר';
    if(/10\s*\/\s*20\s*(?:l|lt|ltr|liter|litre)?/.test(t) || /\b(?:10|20)\s*(?:l|lt|ltr|liter|litre)\b/.test(t)) return 'קו אריזה 10/20 ליטר';
    return '';
  }
  function targetFacilityFromLabel(label){
    const raw=String(label||'').trim(), low=raw.toLowerCase();
    // יעדי ISO מדווחים אצלנו למתקני Shaked ולא למחסני האריזה/פורמולציה.
    if(/iso/.test(low) && /42/.test(low)) return '1142';
    if(/iso/.test(low) && /23/.test(low) && !/42/.test(low)) return '1123';
    if(/^lq\s*43\b/i.test(raw)) return '1543';
    if(/^24f/i.test(raw)) return '1524';
    const par=(raw.match(/\(([^)]+)\)/)||[])[1]||'';
    const nums=(par.match(/\d{2}/g)||[]).filter(Boolean);
    // שורה שמכילה כמה מתקנים היא יעד משותף; אין לייחס אותה למתקן יחיד באופן שרירותי.
    if(nums.length!==1) return '';
    const n=nums[0];
    return ({'19':'1519','23':'1523','24':'1524','25':'1525','28':'1528','40':'1540','41':'1541','42':'1542','43':'1543'})[n]||'';
  }
  function parseAuditedSumTargetSheet(ws){
    const grid=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:false}); if(!grid.length)return [];
    // בקובץ המבוקר: שורה 1 היא כותרת הדוח, שורה 2 מכילה Capacity / Plan / Production ...
    let hi=-1;
    for(let r=0;r<Math.min(20,grid.length);r++){
      const row=grid[r].map(normTargetHeader);
      if(row.includes(normTargetHeader('Capacity')) && row.includes(normTargetHeader('Plan'))){ hi=r; break; }
    }
    if(hi<0)return [];
    const h=grid[hi];
    const ci=targetHeaderIndex(h,['Capacity']);
    const pi=targetHeaderIndex(h,['Plan']);
    const prodI=targetHeaderIndex(h,['Production']);
    const achI=targetHeaderIndex(h,['% Achievement','Achievement']);
    const reqI=targetHeaderIndex(h,['Req. t/d']);
    const adjI=targetHeaderIndex(h,['Adjusted Req. t/d']);
    const actI=targetHeaderIndex(h,['Actual t/d']);
    const adhI=targetHeaderIndex(h,['New Adherence']);
    const remarksI=targetHeaderIndex(h,['Remarks']);
    const titleMonth=monthNorm((grid[0]||[]).map(x=>String(x||'')).join(' '));
    const out=[];
    for(let r=hi+1;r<grid.length;r++){
      const row=grid[r], label=String(row[0]??'').trim(); if(!label)continue;
      const plan=pi>=0?numberValue(row[pi]):0; if(plan<=0)continue;
      const fac=targetFacilityFromLabel(label);
      // בקובץ היעדים הערכים Capacity/Plan הם באלפים (טון/אלף ליטר), בעוד נתוני הדשבורד ביחידות בסיס.
      const scale=1000;
      out.push({
        facility:fac, sourceLabel:label, month:titleMonth, packagingType:targetPackagingTypeFromLabel(label),
        materialCode:'', materialName:'', monthlyTarget:plan*scale, dailyTarget:0,
        capacity:ci>=0?numberValue(row[ci])*scale:0, sourcePlan:plan, sourceScale:scale,
        sourceProduction:prodI>=0?numberValue(row[prodI])*scale:0,
        sourceAchievement:achI>=0?numberValue(row[achI]):0,
        sourceRequiredPerDay:reqI>=0?numberValue(row[reqI])*scale:0,
        sourceAdjustedRequiredPerDay:adjI>=0?numberValue(row[adjI])*scale:0,
        sourceActualPerDay:actI>=0?numberValue(row[actI])*scale:0,
        sourceNewAdherence:adhI>=0?numberValue(row[adhI]):0,
        remarks:remarksI>=0?String(row[remarksI]??'').trim():'', sourceSheet:'Sum', sourceRow:r+1
      });
    }
    return out;
  }
  function parseTargetSheet(ws){
    const grid=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:false}); if(!grid.length)return [];
    let hi=-1;
    for(let r=0;r<Math.min(20,grid.length);r++){
      const row=grid[r].map(normTargetHeader);
      if(row.some(x=>['מתקן','facility','station','תחנה','workcenter'].includes(x)) && row.some(x=>x.includes('יעד')||x.includes('target')||x==='plan')){hi=r;break;}
    }
    if(hi<0)return [];
    const h=grid[hi];
    const fi=targetHeaderIndex(h,['מתקן','facility','station','תחנה','work center']);
    const ti=targetHeaderIndex(h,['יעד חודשי','monthly target','target','יעד','plan','תכנון']);
    const di=targetHeaderIndex(h,['יעד יומי','daily target']);
    const mi=targetHeaderIndex(h,['חודש','month','period','תקופה']);
    const pi=targetHeaderIndex(h,['סוג אריזה','packaging type','קו','line','resource','משאב']);
    const ii=targetHeaderIndex(h,['מק״ט','מקט','item code','material','material code']);
    const ni=targetHeaderIndex(h,['תיאור','item descr','item description','שם חומר','material name','product']);
    if(fi<0 || (ti<0 && di<0)) return [];

  function _v485MaterialsByFamily(wb){
    const out=new Map();

      const grid=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:'',raw:true,blankrows:false});
      if(!grid.length)return;
      let hi=-1;
      for(let r=0;r<Math.min(30,grid.length);r++){
        const keys=(grid[r]||[]).map(normTargetHeader);
        if(keys.includes(normTargetHeader('Item Code')) && keys.includes(normTargetHeader('Family'))){hi=r;break;}
      }
      if(hi<0)return;
      const h=grid[hi]||[];
      const ii=targetHeaderIndex(h,['Item Code','Material','Material Code','מק״ט','מקט']);
      const fi=targetHeaderIndex(h,['Family','משפחה']);
      const si=targetHeaderIndex(h,['Segmentation Class','Segmentation','סגמנטציה']);
      if(ii<0||fi<0)return;
      for(let r=hi+1;r<grid.length;r++){
        const code=String((grid[r]||[])[ii]??'').replace(/\.0$/,'').trim();
        if(!code)continue;
        // V4.8.7: IML CONTROL master-data uses BOTH Family and Segmentation Class.
        // Examples: NANA is Segmentation Class while Family=FLUROCHLORIDONE;
        // 24F128 is Segmentation Class while Family can be blank.
        const keys=[_v485FamilyKey((grid[r]||[])[fi]), si>=0?_v485FamilyKey((grid[r]||[])[si]):'']
          .filter(k=>k&&k!=='#N A');

          out.get(key).add(code);

      }
    });

  function packagingLineTargetBreakdownForRows(rowsIn){
    const rows = (rowsIn || []).filter(e=>Number(e.packaging || 0) > 0);
    const manualTypes = manualPackagingTargetTypes instanceof Set && manualPackagingTargetTypes.size > 0
      ? Array.from(manualPackagingTargetTypes).filter(t=>PACKAGING_TYPES.includes(t))
      : null;
    const daySet = new Set(rows.map(e=>e.date).filter(Boolean));
    const byType = {};
    const byDate = {};
    PACKAGING_TYPES.forEach(t=>{ byType[t] = {type:t, days:new Set(), actual:0, target:0}; });

    rows.forEach(e=>{
      const type = e.packagingType;
      const date = e.date || '';
      const qty = Number(e.packaging)||0;
      if(!date) return;
      if(!byDate[date]) byDate[date] = {date, actual:0, target:0, types:new Set()};
      byDate[date].actual += qty;
      if(type && byType[type]){
        byType[type].actual += qty;
        if(!manualTypes){
          byType[type].days.add(date);
          byDate[date].types.add(type);
        }
      }
    });

    if(manualTypes){
      daySet.forEach(date=>{
        if(!byDate[date]) byDate[date] = {date, actual:0, target:0, types:new Set()};
        manualTypes.forEach(type=>{
          if(byType[type]) byType[type].days.add(date);
          byDate[date].types.add(type);
        });
      });
    }

    Object.values(byType).forEach(g=>{
      g.daysCount = g.days.size;
      g.target = packagingDailyTargetForType(g.type) * g.daysCount;
      g.utilization = g.target>0 ? g.actual/g.target*100 : (g.actual>0 ? 100 : 0);
    });
    Object.values(byDate).forEach(g=>{
      g.target = Array.from(g.types).reduce((sum,t)=>sum+packagingDailyTargetForType(t),0);
      g.utilization = g.target>0 ? g.actual/g.target*100 : (g.actual>0 ? 100 : 0);
      g.types = Array.from(g.types).filter(t=>PACKAGING_TYPES.includes(t));
    });
    const typeRows = Object.values(byType).filter(g=>g.actual>0 || g.target>0);
    const dailyRows = Object.values(byDate).sort((a,b)=>a.date.localeCompare(b.date));

      workingDays: daySet.size,
      types: typeRows.map(g=>g.type),

      actual: rows.reduce((s,e)=>s+(Number(e.packaging)||0),0),
      mode: manualTypes ? 'manual' : 'auto'
    };
  }

  async function persist(){
    let saveStage='הכנת נתוני הכמויות';
    try {
      const byMonth = {};
      entries.forEach(e=>{
        const mk = entryMonthKey(e.date);
        if(!byMonth[mk]) byMonth[mk] = [];
        byMonth[mk].push(e);
      });
      const monthKeys = Object.keys(byMonth).sort();
      const monthsNow = monthKeys.map(k => k.slice(ENTRIES_KEY_PREFIX.length));

      let prevMonths = [];
      try {
        const idxRes = await _dashStorage.get(ENTRIES_INDEX_KEY,{fresh:true});
        prevMonths = (idxRes && idxRes.value) ? JSON.parse(idxRes.value) : [];
        if(!Array.isArray(prevMonths)) prevMonths=[];
      } catch(e){ prevMonths = []; }
      const monthsToDelete = prevMonths.filter(m => !monthsNow.includes(m));

      // V4.8.33: production used to fire every month blob + index + deletes at once.
      // Large quantity files could overload the Netlify function and intermittently fail.
      // Save only two month blobs at a time; _callStorageApi already retries transient
      // 429/5xx/network errors with exponential backoff.
      saveStage='שמירת חודשי הכמות בענן';
      let savedMonths=0;
      await mapWithConcurrency(monthKeys, 2, async mk=>{
        await _dashStorage.set(mk, JSON.stringify(byMonth[mk]));
        savedMonths++;
        if(monthKeys.length>1) setQualityLoadProgress('שומר כמויות בענן · '+savedMonths+' / '+monthKeys.length+' חודשים');
      });

      // Remove obsolete month blobs only after every current month was saved.
      saveStage='ניקוי חודשי כמות ישנים';
      await mapWithConcurrency(monthsToDelete, 2, async m=>{
        try{ await _dashStorage.delete(ENTRIES_KEY_PREFIX + m); }catch(err){ console.warn('old production month delete failed',m,err); }
      });

      // Publish the index only after all blobs are present. A reader can therefore
      // never receive an index that points at a month which has not finished saving.
      saveStage='שמירת אינדקס הכמויות';
      await _dashStorage.set(ENTRIES_INDEX_KEY, JSON.stringify(monthsNow));
      try{ await _dashStorage.delete(STORAGE_KEY); }catch(e){}

      // Verify cloud row count before publishing the sync version.
      saveStage='אימות הכמויות בענן';
      setQualityLoadProgress('מאמת שמירת כמויות בענן');
      const verifyPairs=await _dashStorage.getMany(monthsNow.map(m=>ENTRIES_KEY_PREFIX+m),{fresh:true});
      let cloudRows=0, missingMonths=[];
      verifyPairs.forEach(pair=>{
        try{
          const part=JSON.parse(pair&&pair.result&&pair.result.value||'[]');
          if(Array.isArray(part)) cloudRows+=part.length;
          else missingMonths.push(String(pair&&pair.key||''));
        }catch(e){ missingMonths.push(String(pair&&pair.key||'')); }
      });
      if(cloudRows!==entries.length){
        throw new Error('אימות כמויות בענן נכשל: מקומי '+entries.length+' מול ענן '+cloudRows+(missingMonths.length?' · חסר: '+missingMonths.join(', '):''));
      }

      saveStage='פרסום גרסת הכמויות';
      const productionVersion=JSON.stringify({at:Date.now(),rows:entries.length,months:monthsNow});
      await _dashStorage.set(PRODUCTION_SYNC_VERSION_KEY,productionVersion);

      try{ await idbSet('production_entries',{sig:'months:'+monthsNow.join(',')+'|production:'+productionVersion,rows:entries,at:new Date().toISOString()}); }catch(e){ console.warn('production idb cache save failed',e); }
      setQualityLoadProgress('');
      return true;
    } catch(e){
      setQualityLoadProgress('');
      console.error('production persist failed at stage:',saveStage,e);
      // Check if it's a quota error
      if(e && (e.name === 'QuotaExceededError' || (e.message && e.message.toLowerCase().includes('quota')))){
        showToast('אחסון הדפדפן מלא. הנתונים נשמרו בזיכרון הזמני — בדף הבא הם יאבדו. מומלץ לייצא גיבוי עכשיו.', true);
        return true;
      }
      showToast('שגיאה בשמירת הכמויות · '+saveStage+': '+((e&&e.message)||'שגיאה לא ידועה'), true);
      return false;
    }
  }

  /* ---------------- derived defaults ---------------- */
  function latestDate(){
    if(entries.length===0) return todayISO();
    return entries.reduce((max,e)=> e.date > max ? e.date : max, entries[0].date);
  }
  function yearsWithData(){
    const ys = new Set(entries.map(e=>parseInt(e.date.slice(0,4),10)));
    ys.add(new Date().getFullYear());
    return Array.from(ys).sort((a,b)=>b-a);
  }

  function effectiveDay(){ return filters.day || latestDate(); }
  function effectiveMonth(){
    if(filters.month) return filters.month;
    const d = parseISO(latestDate());
    return d.getFullYear()+'-'+pad2(d.getMonth()+1);
  }
  function effectiveYear(){
    if(filters.year) return filters.year;
    return parseISO(latestDate()).getFullYear();
  }
  function effectiveQYear(){ return filters.qYear || effectiveYear(); }
  function effectiveQQuarter(){
    if(filters.qQuarter) return filters.qQuarter;
    return Math.floor(parseISO(latestDate()).getMonth()/3)+1;
  }
  function effectivePeriod(){
    if(filters.periodStart && filters.periodEnd) return {start: filters.periodStart, end: filters.periodEnd};
    const end = parseISO(latestDate());
    const start = new Date(end); start.setDate(start.getDate()-6);
    return {start: toISO(start), end: toISO(end)};
  }

  /* ---------------- filtering & bucketing ---------------- */
  function getView(){
    const base = facilityFilteredEntries();
    if(tab === 'day'){
      const day = effectiveDay();
      const filtered = base.filter(e=>e.date===day);
      const groupByFacility = !(selectedFacilities && selectedFacilities.size===1);
      const groups = {};
      filtered.forEach(e=>{
        const key = groupByFacility ? ('מתקן '+(e.facility||'לא מוגדר')) : (e.line || 'כללי');
        if(!groups[key]) groups[key] = {label:key, production:0, packaging:0, targetProduction:0, targetPackaging:0};
        groups[key].production += e.production;
        groups[key].packaging += e.packaging;
        groups[key].targetProduction += getProductionTarget(e);
        groups[key].targetPackaging += getPackagingTarget(e);
      });
      return { filtered, buckets: Object.values(groups), rangeLabel: day };
    }
    if(tab === 'period'){
      const {start,end} = effectivePeriod();
      const s = parseISO(start), e = parseISO(end);
      const filtered = base.filter(x=> x.date>=start && x.date<=end);
      const spanDays = Math.round((e-s)/86400000)+1;
      let buckets;
      if(spanDays <= 31) buckets = bucketDaily(filtered, s, e);
      else if(spanDays <= 180) buckets = bucketWeekly(filtered, s, e);
      else buckets = bucketMonthly(filtered, s, e);
      return { filtered, buckets, rangeLabel: ddmm(s)+' – '+ddmm(e) };
    }
    if(tab === 'month'){
      const ym = effectiveMonth();
      const [y,m] = ym.split('-').map(Number);
      const s = new Date(y, m-1, 1), e = new Date(y, m, 0);
      const sISO = toISO(s), eISO = toISO(e);
      const filtered = base.filter(x=> x.date>=sISO && x.date<=eISO);
      return { filtered, buckets: bucketDaily(filtered, s, e), rangeLabel: monthsFull[m-1]+' '+y };
    }
    if(tab === 'quarter'){
      const y = effectiveQYear(), q = effectiveQQuarter();
      const startMonth = (q-1)*3;
      const s = new Date(y, startMonth, 1), e = new Date(y, startMonth+3, 0);
      const sISO = toISO(s), eISO = toISO(e);
      const filtered = base.filter(x=> x.date>=sISO && x.date<=eISO);
      return { filtered, buckets: bucketMonthly(filtered, s, e), rangeLabel: 'רבעון '+q+' '+y };
    }
    if(tab === 'year'){
      const y = effectiveYear();
      const s = new Date(y,0,1), e = new Date(y,11,31);
      const sISO = toISO(s), eISO = toISO(e);
      const filtered = base.filter(x=> x.date>=sISO && x.date<=eISO);
      return { filtered, buckets: bucketMonthly(filtered, s, e), rangeLabel: ''+y };
    }
  }

  function emptyBucket(label){ return {label, production:0, packaging:0, targetProduction:0, targetPackaging:0}; }

  function bucketDaily(filtered, start, end){
    const days = Math.round((end-start)/86400000)+1;
    const buckets = [];
    for(let i=0;i<days;i++){
      const d = new Date(start); d.setDate(d.getDate()+i);
      buckets.push(emptyBucket(ddmm(d)));
      buckets[i]._iso = toISO(d);
    }
    filtered.forEach(e=>{
      const idx = Math.round((parseISO(e.date)-start)/86400000);
      if(buckets[idx]){
        buckets[idx].production += e.production;
        buckets[idx].packaging += e.packaging;
        buckets[idx].targetProduction += getProductionTarget(e);
        buckets[idx].targetPackaging += getPackagingTarget(e);
      }
    });
    return buckets;
  }

  function bucketWeekly(filtered, start, end){
    const startSun = new Date(start); startSun.setDate(startSun.getDate()-startSun.getDay());
    const weeks = Math.ceil((end-startSun)/86400000/7);
    const buckets = [];
    for(let i=0;i<weeks;i++){
      const d = new Date(startSun); d.setDate(d.getDate()+i*7);
      const dEnd = new Date(d); dEnd.setDate(dEnd.getDate()+6);
      const b = emptyBucket(ddmm(d));
      b._isoStart = toISO(d); b._isoEnd = toISO(dEnd);
      buckets.push(b);
    }
    filtered.forEach(e=>{
      const idx = Math.floor((parseISO(e.date)-startSun)/86400000/7);
      if(buckets[idx]){
        buckets[idx].production += e.production;
        buckets[idx].packaging += e.packaging;
        buckets[idx].targetProduction += getProductionTarget(e);
        buckets[idx].targetPackaging += getPackagingTarget(e);
      }
    });
    return buckets;
  }

  function bucketMonthly(filtered, start, end){
    const months = (end.getFullYear()-start.getFullYear())*12 + (end.getMonth()-start.getMonth()) + 1;
    const buckets = [];
    for(let i=0;i<months;i++){
      const m = (start.getMonth()+i)%12;
      const y = start.getFullYear() + Math.floor((start.getMonth()+i)/12);
      const b = emptyBucket(monthsShort[m] + (months>12 ? " '"+(''+y).slice(2) : ''));
      b._isoStart = y+'-'+String(m+1).padStart(2,'0')+'-01';
      const lastDay = new Date(y, m+1, 0);
      b._isoEnd = toISO(lastDay);
      buckets.push(b);
    }
    filtered.forEach(e=>{
      const d = parseISO(e.date);
      const idx = (d.getFullYear()-start.getFullYear())*12 + (d.getMonth()-start.getMonth());
      if(buckets[idx]){
        buckets[idx].production += e.production;
        buckets[idx].packaging += e.packaging;
        buckets[idx].targetProduction += getProductionTarget(e);
        buckets[idx].targetPackaging += getPackagingTarget(e);
      }
    });
    return buckets;
  }

  /* ---------------- gauge svg ---------------- */
  function gaugeColor(pct){
    if(pct >= 100) return 'var(--green)';
    if(pct >= 75) return 'var(--yellow)';
    return 'var(--red)';
  }
  function gaugeLabel(pct){
    if(pct >= 100) return 'ok';
    if(pct >= 75) return 'warn';
    return 'bad';
  }
  function deltaLabel(actual, target){
    if(!target || target<=0) return '';
    const diff = Math.round((actual/target*100) - 100);
    if(diff > 0) return '▲ '+diff+'% מעל היעד';
    if(diff < 0) return '▼ '+Math.abs(diff)+'% מתחת ליעד';
    return '● בדיוק על היעד';
  }

  function buildGaugeSVG(pct, identityColor){
    identityColor = identityColor || 'var(--text-muted)';
    const safePct = isFinite(pct) ? pct : 0;
    const scaleMax = safePct > 100 ? Math.ceil((safePct+10)/10)*10 : 100;
    const targetPos = clamp((100/scaleMax)*100, 0, 100);
    const actualPos = clamp((safePct/scaleMax)*100, 0, 100);
    const cx=90, cy=90, r=66, needleLen=50;
    const angleOf = p => (180 - (p/100*180));
    const pointAt = (p, radius) => {
      const a = angleOf(p) * Math.PI/180;
      return [cx + radius*Math.cos(a), cy - radius*Math.sin(a)];
    };
    const [nx, ny] = pointAt(actualPos, needleLen);
    let ticks = '';
    [{p:0,major:false},{p:targetPos,major:true},{p:100,major:false}].forEach(t=>{
      const [x1,y1] = pointAt(t.p, r+2);
      const [x2,y2] = pointAt(t.p, r+12);
      const col = t.major ? 'var(--text)' : 'var(--border)';
      const w = t.major ? 3 : 2;
      ticks += '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+col+'" stroke-width="'+w+'"/>';
    });
    const statusColor = gaugeColor(safePct);
    const pathD = 'M '+(cx-r)+' '+cy+' A '+r+' '+r+' 0 0 1 '+(cx+r)+' '+cy;
    const targetDash = (targetPos*2.07).toFixed(1);
    const actualDash = (actualPos*2.07).toFixed(1);
    return ''+
      '<svg class="gauge-svg" viewBox="0 0 180 105" dir="ltr">'+
        '<path d="'+pathD+'" fill="none" stroke="var(--panel-2)" stroke-width="14" stroke-linecap="round"/>'+
        '<path d="'+pathD+'" fill="none" stroke="'+identityColor+'" stroke-opacity="0.32" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+targetDash+' 400"/>'+
        '<path d="'+pathD+'" fill="none" stroke="'+statusColor+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+actualDash+' 400"/>'+
        ticks+
        '<circle cx="'+cx+'" cy="'+cy+'" r="5" fill="var(--text-muted)"/>'+
        '<line x1="'+cx+'" y1="'+cy+'" x2="'+nx+'" y2="'+ny+'" stroke="var(--text)" stroke-width="3" stroke-linecap="round"/>'+
        '<text x="'+cx+'" y="62" text-anchor="middle" class="gauge-pct" font-size="24" fill="'+statusColor+'">'+Math.round(safePct)+'%</text>'+
      '</svg>';
  }

  /* ---------------- trend chart svg ---------------- */
  function buildChartSVG(buckets){
    if(buckets.length===0 || buckets.every(b=>b.production===0 && b.packaging===0)){
      return '<div class="chart-empty">אין נתונים להצגה בטווח שנבחר</div>';
    }
    const W = Math.max(560, buckets.length*46), H=250, padL=46, padB=30, padT=12, padR=10;
    const plotW = W-padL-padR, plotH = H-padT-padB;
    const maxVal = Math.max(1, ...buckets.flatMap(b=>[b.production,b.packaging])) * 1.15;
    const groupW = plotW/buckets.length;
    const barW = Math.min(26, groupW*0.34);
    const gap = barW*0.18;
    let bars='', labels='', grid='';
    [0,0.25,0.5,0.75,1].forEach(f=>{
      const y = padT + plotH - plotH*f;
      grid += '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4"/>';
      grid += '<text x="'+(padL-8)+'" y="'+(y+3)+'" text-anchor="end" font-size="10" fill="var(--text-muted)" font-family="JetBrains Mono, monospace">'+fmt(maxVal*f)+'</text>';
    });
    const rotate = buckets.length > 14;
    buckets.forEach((b,i)=>{
      const groupX = padL + i*groupW + groupW/2;
      const h1 = (b.production/maxVal)*plotH, h2=(b.packaging/maxVal)*plotH;
      const x1 = groupX - barW - gap/2, x2 = groupX + gap/2;
      bars += '<rect class="trend-bar" data-bucket-index="'+i+'" data-metric="production" x="'+x1+'" y="'+(padT+plotH-h1)+'" width="'+barW+'" height="'+Math.max(h1,0)+'" rx="2" fill="var(--amber)" style="cursor:pointer;"/>';
      bars += '<rect class="trend-bar" data-bucket-index="'+i+'" data-metric="packaging" x="'+x2+'" y="'+(padT+plotH-h2)+'" width="'+barW+'" height="'+Math.max(h2,0)+'" rx="2" fill="var(--teal)" style="cursor:pointer;"/>';
      const ly = H-padB+14;
      if(rotate){
        labels += '<text x="'+groupX+'" y="'+ly+'" text-anchor="end" font-size="10" fill="var(--text-muted)" transform="rotate(-40 '+groupX+' '+ly+')">'+b.label+'</text>';
      } else {
        labels += '<text x="'+groupX+'" y="'+ly+'" text-anchor="middle" font-size="10.5" fill="var(--text-muted)">'+b.label+'</text>';
      }
    });
    return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'+grid+bars+labels+'</svg>';
  }

  /* ---------------- KPI / achievement pill ---------------- */
  function achievementPill(pct){
    const cls = gaugeLabel(pct);
    return '<span class="pill '+cls+'">'+Math.round(pct)+'%</span>';
  }

        '<div class="field"><label>שנה</label><select id="f_qy">'+years.map(yy=>'<option value="'+yy+'"'+(yy===y?' selected':'')+'>'+yy+'</option>').join('')+'</select></div>'+
        '<div class="field"><label>רבעון</label><select id="f_qq">'+[1,2,3,4].map(qq=>'<option value="'+qq+'"'+(qq===q?' selected':'')+'>Q'+qq+'</option>').join('')+'</select></div>';
      fb.querySelector('#f_qy').onchange = e=>{ filters.qYear = parseInt(e.target.value,10); renderAll(); };
      fb.querySelector('#f_qq').onchange = e=>{ filters.qQuarter = parseInt(e.target.value,10); renderAll(); };

  function daysInMonthFromISO(iso){
    if(!iso || iso.length < 7) return 30;
    const y = Number(iso.slice(0,4));
    const m = Number(iso.slice(5,7));
    if(!isFinite(y) || !isFinite(m)) return 30;
    return new Date(y, m, 0).getDate();
  }

  function facilityActualAmount(e){
    const p = Number(e.production || 0);
    const a = Number(e.packaging || 0);
    return p > 0 ? p : a;
  }

  function currentReportDatesFallback(){
    let dates = [];
    if(tab === 'day') dates = [effectiveDay()];
    else if(tab === 'period'){
      const r = effectivePeriod();
      const s = parseISO(r.start), e = parseISO(r.end);
      for(let d = new Date(s); d <= e; d.setDate(d.getDate()+1)) dates.push(toISO(new Date(d)));
    } else if(tab === 'month'){
      const ym = effectiveMonth();
      const parts = ym.split('-').map(Number);
      const s = new Date(parts[0], parts[1]-1, 1), e = new Date(parts[0], parts[1], 0);
      for(let d = new Date(s); d <= e; d.setDate(d.getDate()+1)) dates.push(toISO(new Date(d)));
    } else if(tab === 'quarter'){
      const y = effectiveQYear(), q = effectiveQQuarter();
      const s = new Date(y, (q-1)*3, 1), e = new Date(y, (q-1)*3 + 3, 0);
      for(let d = new Date(s); d <= e; d.setDate(d.getDate()+1)) dates.push(toISO(new Date(d)));
    } else if(tab === 'year'){
      const y = effectiveYear();
      const s = new Date(y,0,1), e = new Date(y,11,31);
      for(let d = new Date(s); d <= e; d.setDate(d.getDate()+1)) dates.push(toISO(new Date(d)));
    }
    return dates;
  }

  function targetFacilityListForView(view){
    if(selectedFacilities === null) return PRODUCTION_FACILITIES.slice();
    return Array.from(selectedFacilities).filter(f => PRODUCTION_FACILITIES.includes(f));
  }

  function facilityTargetForDates(facility, dates){
    const daily = dailyProductionTargetForFacility(facility);
    if(daily <= 0) return 0;
    const unique = Array.from(new Set((dates || []).filter(Boolean)));
    return daily * unique.length;
  }

  function facilityTargetRowsForView(view){
    const rows = (view && view.filtered) || [];
    const fallbackDates = currentReportDatesFallback();
    const facs = targetFacilityListForView(view);
    return facs.map(f=>{
      const fRows = rows.filter(e => String(e.facility || '') === String(f));
      let dates = Array.from(new Set(fRows.filter(e=>facilityActualAmount(e)>0).map(e=>e.date).filter(Boolean))).sort();
      if(dates.length === 0) dates = fallbackDates;
      const actual = fRows.reduce((s,e)=>s+facilityActualAmount(e),0);
      const target = facilityTargetForDates(f, dates);
      const pct = target > 0 ? actual / target * 100 : (actual > 0 ? 100 : 0);
      const daily = dailyProductionTargetForFacility(f);
      const ruleLabel = daily > 0 ? ('יעד יומי '+fmt(daily)+' יח׳ (לפי "יעדי ייצור")') : 'אין יעד מוגדר — הגדירו בכפתור "יעדי ייצור"';
      return {facility:f, actual, target, pct, days:dates.length, ruleLabel, kind:'production'};
    });
  }

  // משמש רק כגיבוי כשאין עמודת "Actual Finish Time" בקובץ המקורי
  function shiftFromTimestamp(ts){
    if(!ts) return null;
    return shiftFromHour(new Date(Number(ts)).getHours());
  }

  function buildFacilityDrilldownChart(rows, metric, maxH){
    if(!rows || rows.length === 0) return '<div class="chart-empty">אין נתונים בטווח שנבחר</div>';
    const W = Math.max(400, rows.length * 46), H = maxH || 200;
    const padL = 46, padR = 10, padT = 10, padB = 28;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const maxVal = Math.max(1, ...rows.map(r => Number(r[metric]) || 0)) * 1.15;
    const color = metric === 'packaging' ? 'var(--teal)' : 'var(--amber)';
    let bars = '', labels = '', grid = '';
    [0, 0.5, 1].forEach(f => {
      const y = padT + plotH - plotH * f;
      grid += '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4"/>';
      grid += '<text x="'+(padL-6)+'" y="'+(y+3)+'" text-anchor="end" font-size="9.5" fill="var(--text-muted)" font-family="JetBrains Mono,monospace">'+fmt(maxVal*f)+'</text>';
    });
    const barW = Math.min(32, plotW / rows.length * 0.65);
    const groupW = plotW / rows.length;
    rows.forEach((r, i) => {
      const v = Number(r[metric]) || 0;
      const h = (v / maxVal) * plotH;
      const x = padL + i * groupW + groupW / 2 - barW / 2;
      bars += '<rect x="'+x+'" y="'+(padT+plotH-h)+'" width="'+barW+'" height="'+Math.max(h,0)+'" rx="2" fill="'+color+'"/>'+
        (v > 0 ? '<text x="'+(x+barW/2)+'" y="'+(padT+plotH-h-4)+'" text-anchor="middle" font-size="8.5" fill="var(--text-muted)" font-family="JetBrains Mono,monospace">'+fmt(v)+'</text>' : '');
      const lbl = r.label || r.date || '';
      labels += '<text x="'+(x+barW/2)+'" y="'+(H-padB+13)+'" text-anchor="middle" font-size="9.5" fill="var(--text-muted)">'+escapeHtml(lbl)+'</text>';
    });
    return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'+grid+bars+labels+'</svg>';
  }

  function openFacilityDrilldown(facility, kind, view){
    const overlay = root.querySelector('#facilityDrilldownOverlay');
    if(!overlay) return;
    const allRows = (view && view.filtered) || [];
    const facRows = allRows.filter(e => String(e.facility||'') === String(facility));
    const metric = kind === 'packaging' ? 'packaging' : 'production';
    const metricLabel = kind === 'packaging' ? 'אריזה (ליטר)' : 'ייצור (יח׳)';
    const color = kind === 'packaging' ? 'var(--teal)' : 'var(--amber)';
    const total = facRows.reduce((s,e)=>s+(Number(e[metric])||0),0);
    const daysWithData = new Set(facRows.filter(e=>Number(e[metric]||0)>0).map(e=>e.date)).size;
    const avg = daysWithData > 0 ? Math.round(total / daysWithData) : 0;
    const dailyTarget = kind === 'packaging' ? dailyPackagingTargetForFacility(facility) : dailyProductionTargetForFacility(facility);

    const byDate = {};
    facRows.forEach(e=>{
      const d = e.date || '';
      if(!d) return;
      if(!byDate[d]) byDate[d] = {date:d, label:ddmm(parseISO(d)), production:0, packaging:0, count:0};
      byDate[d].production += Number(e.production)||0;
      byDate[d].packaging += Number(e.packaging)||0;
      byDate[d].count++;
    });
    const dailyRows = Object.values(byDate).sort((a,b)=>a.date.localeCompare(b.date));
    const bestDay = dailyRows.length ? dailyRows.reduce((best,r)=> (Number(r[metric])||0) > (Number(best[metric])||0) ? r : best, dailyRows[0]) : null;
    const worstDay = dailyRows.filter(r=>Number(r[metric]||0)>0).length ?
      dailyRows.filter(r=>Number(r[metric]||0)>0).reduce((w,r)=> (Number(r[metric])||0) < (Number(w[metric])||0) ? r : w, dailyRows.filter(r=>Number(r[metric]||0)>0)[0]) : null;

    const shiftTotals = {'בוקר':0, 'ערב':0, 'לילה':0};
    const shiftCounts = {'בוקר':0, 'ערב':0, 'לילה':0};
    let unknownShiftTotal = 0, unknownShiftCount = 0;
    facRows.forEach(e=>{
      const v = Number(e[metric])||0;
      if(!v) return;
      const sh = e.shift && SHIFTS.includes(e.shift) ? e.shift : null;
      if(sh){
        shiftTotals[sh] = (shiftTotals[sh]||0) + v;
        shiftCounts[sh] = (shiftCounts[sh]||0) + 1;
      } else {
        unknownShiftTotal += v;
        unknownShiftCount++;
      }
    });
    const shiftMax = Math.max(1, ...Object.values(shiftTotals), unknownShiftTotal);

    const qRowsAll = Object.values(qualitySummary || {}).filter(q => facRows.some(e => qualityMatchesPackaging(q, e)));
    const qGoodAll = qRowsAll.filter(q=>q.worst==='ok').length;

    const titleLabel = 'מתקן ' + facility + (kind==='packaging' ? ' — אריזה' : ' — ייצור');

      '<div class="kpi-card num"><div class="kpi-label">ממוצע יומי</div><span class="kpi-num">'+fmt(avg)+'</span><div class="kpi-sub">'+daysWithData+' ימי דיווח</div></div>'+
      '<div class="kpi-card num" style="border-top:3px solid '+(pct>=100?'var(--green)':pct>=75?'var(--yellow)':'var(--red)')+'"><div class="kpi-label">עמידה ביעד</div><span class="kpi-num">'+pct+'%</span><div class="kpi-sub">יעד יומי: '+fmt(dailyTarget)+'</div></div>'+
      '<div class="kpi-card num"><div class="kpi-label">מנות איכות</div><span class="kpi-num">'+qTotal+'</span><div class="kpi-sub" style="color:var(--green)">'+qGoodAll+' תקינות</div></div>'+
    '</div>';

    html += '<div class="panel" style="margin-bottom:16px;">'+
      '<div class="panel-head"><div class="panel-title">כמות לפי יום</div>'+

      '<span style="color:var(--text-muted); font-size:11px; margin-right:8px;">לחץ על עמודה לפירוט היום</span></div></div>'+
      '<div class="chart-wrap">'+buildFacilityDrilldownChart(dailyRows, metric, 220)+'</div>'+

    if(bestDay || worstDay){
      html += '<div class="insight-stats" style="margin-bottom:16px;">'+
        (bestDay ? '<div class="kpi-card" style="cursor:pointer;" data-goto-date="'+escapeHtml(bestDay.date)+'"><div class="kpi-label">🏆 יום הכי טוב</div><div class="kpi-num mono" style="font-size:22px; direction:ltr; text-align:right;">'+fmt(Number(bestDay[metric])||0)+'</div><div class="kpi-sub">'+escapeHtml(bestDay.date)+' · לחץ לפירוט</div></div>' : '')+
        (worstDay ? '<div class="kpi-card" style="cursor:pointer;" data-goto-date="'+escapeHtml(worstDay.date)+'"><div class="kpi-label">⚠️ יום הכי חלש</div><div class="kpi-num mono" style="font-size:22px; direction:ltr; text-align:right;">'+fmt(Number(worstDay[metric])||0)+'</div><div class="kpi-sub">'+escapeHtml(worstDay.date)+' · לחץ לפירוט</div></div>' : '')+

    const shiftHours = { 'בוקר':'07:00–15:00', 'ערב':'15:00–23:00', 'לילה':'23:00–07:00' };
    let selectedDate = dailyRows.length ? dailyRows[dailyRows.length-1].date : '';
    const selectedShifts = new Set(['בוקר','ערב','לילה']);

    function finishDisplay(e){
      const raw = (e.actualFinishTime===undefined || e.actualFinishTime===null) ? '' : String(e.actualFinishTime).trim();
      if(raw){
        const timeMatch = raw.match(/(\d{1,2}:\d{2}(?::\d{2})?)/);

    function renderShiftDayPanel(){

      const dayRows = facRows.filter(e=>String(e.date||'')===String(selectedDate));

      if(!visibleRows.length){
        out += '<div class="table-empty">אין רשומות למשמרות שנבחרו בתאריך זה</div>';
      } else {
        out += '<div class="table-scroll"><table class="shift-detail-table"><thead><tr><th>תאריך ושעת יצירה</th><th>משמרת</th><th>מתקן</th><th>פקודת עבודה</th><th>Batch</th><th>מק״ט</th><th>שם חומר</th><th>כמות</th></tr></thead><tbody>';
        visibleRows.forEach(e=>{
          out += '<tr><td class="mono">'+escapeHtml(finishDisplay(e))+'</td><td><span class="shift-pill '+shiftClass(e.shift)+'">'+escapeHtml(e.shift||'—')+'</span></td><td class="mono">'+escapeHtml(e.facility||'—')+'</td><td class="mono">'+escapeHtml(e.workOrder||e.order||'—')+'</td><td class="mono">'+escapeHtml(e.batch||'—')+'</td><td class="mono">'+escapeHtml(e.materialCode||e.material||'—')+'</td><td title="'+escapeHtml(e.materialName||'—')+'">'+escapeHtml(e.materialName||'—')+'</td><td class="mono">'+fmt(Number(e[metric])||0)+'</td></tr>';
        });
        out += '</tbody></table></div>';
      }
      out += '</div>';
      shiftPanel.innerHTML=out;
      shiftPanel.querySelectorAll('.shift-choice').forEach(card=>{ card.onclick=()=>{ const sh=card.dataset.shift; if(selectedShifts.has(sh)) selectedShifts.delete(sh); else selectedShifts.add(sh); renderShiftDayPanel(); }; });
      const clearBtn=shiftPanel.querySelector('#clearShiftSelection'); if(clearBtn) clearBtn.onclick=()=>{ selectedShifts.clear(); renderShiftDayPanel(); };
      const exportBtn=shiftPanel.querySelector('#exportShiftRows'); if(exportBtn) exportBtn.onclick=()=>{
        if(!visibleRows.length){ toast('אין נתונים לייצוא','warn'); return; }
        if(typeof XLSX==='undefined'){ toast('ספריית Excel אינה זמינה','error'); return; }
        const data=visibleRows.map(e=>({'תאריך ושעת יצירה':finishDisplay(e),'משמרת':e.shift||'','מתקן':e.facility||'','פקודת עבודה':e.workOrder||e.order||'','Batch':e.batch||'','מק״ט':e.materialCode||e.material||'','שם חומר':e.materialName||'','כמות':Number(e[metric])||0}));
        const wb=XLSX.utils.book_new(), ws=XLSX.utils.json_to_sheet(data); XLSX.utils.book_append_sheet(wb,ws,'פירוט משמרות'); XLSX.writeFile(wb,'facility_'+facility+'_'+selectedDate+'_shifts.xlsx');
      };

  function facilityViewMode(){
    if(selectedFacilities === null) return 'both';
    const arr = Array.from(selectedFacilities);
    if(arr.length === 0) return 'both';
    const allPackagingOnly = arr.every(f=>PACKAGING_ONLY_FACILITIES.includes(f));
    const allProduction = arr.every(f=>!PACKAGING_ONLY_FACILITIES.includes(f));
    if(allPackagingOnly) return 'packaging';
    if(allProduction) return 'production';
    return 'both';
  }

  function targetCompareCard(title, icon, actual, target, note){
    const pct = target>0 ? (actual/target*100) : (actual>0 ? 100 : 0);
    const cls = gaugeLabel(pct);
    const status = target<=0 ? 'ללא יעד מוגדר' : (pct>=100 ? 'עומד ביעד' : pct>=75 ? 'קרוב ליעד' : 'מתחת ליעד');
    const diff = actual-target;
    const delta = target<=0 ? 'יש להגדיר יעד' : (diff>0 ? '▲ '+fmt(diff)+' מעל היעד' : diff<0 ? '▼ חסרים '+fmt(Math.abs(diff)) : '● בדיוק ביעד');
    const width = Math.max(0, Math.min(100, pct));
    return '<div class="target-compare-card status-'+cls+'">'+
      '<div class="target-compare-head"><div class="target-compare-title">'+icon+' '+escapeHtml(title)+'</div><div class="target-status-badge">'+status+'</div></div>'+
      '<div class="target-values">'+
        '<div><div class="target-value-label">יעד</div><div class="target-value-number">'+fmt(target)+'</div></div>'+
        '<div class="target-divider"></div>'+
        '<div><div class="target-value-label">כמות בפועל</div><div class="target-value-number actual">'+fmt(actual)+'</div></div>'+
      '</div>'+
      '<div class="target-progress"><span style="width:'+width+'%"></span></div>'+
      '<div class="target-result-row"><div class="target-percent">'+Math.round(pct)+'%</div><div class="target-delta">'+delta+'</div></div>'+
      (note ? '<div class="target-note">'+escapeHtml(note)+'</div>' : '')+
    '</div>';
  }

  function calcAdvancedSummary(view){
    const rows = view.filtered || [];
    const totalPack = rows.reduce((s,e)=>s+(Number(e.packaging)||0),0);
    const targetPack = getEffectivePackagingTarget(view);
    const pctPack = targetPack>0 ? totalPack/targetPack*100 : (totalPack>0 ? 100 : 0);
    const closedOrders = rows.filter(isOrderClosed).length;
    const openOrders = rows.filter(e=>e.systemStatus && !isOrderClosed(e)).length;
    const qRows = Object.values(qualitySummary || {}).filter(q => rows.some(e => qualityMatchesPackaging(q, e)));
    const goodLots = qRows.filter(q=>q.worst==='ok').length;
    const badLots = qRows.filter(q=>q.worst==='bad').length;
    const conditionalLots = qRows.filter(q=>q.worst==='conditional').length;
    const totalQualityLots = qRows.length;
    const targetInfo = getLineTargetInfo(view);
    const typeRows = targetInfo.typeRows.map(r=>({label:r.type, actual:r.actual, target:r.target, days:r.daysCount, utilization:r.utilization}));
    const untypedActual = rows.reduce((s,e)=>s+(!e.packagingType && Number(e.packaging||0)>0 ? Number(e.packaging)||0 : 0),0);
    if(untypedActual>0) typeRows.push({label:'ללא סוג מוגדר', actual:untypedActual, target:0, days:0, utilization:100});
    return {rows,totalPack,targetPack,pctPack,closedOrders,openOrders,qRows,goodLots,badLots,conditionalLots,totalQualityLots,typeRows,targetInfo};
  }

  function buildQualityTrendSVG(trendData){
    if(!trendData || trendData.length===0) return '<div class="chart-empty">אין נתוני מגמה</div>';
    const W = Math.max(520, trendData.length*56), H=170, padL=36, padR=12, padT=12, padB=28;
    const plotW = W-padL-padR, plotH = H-padT-padB;
    const maxVal = Math.max(1, ...trendData.map(d=>d.ok+d.warn+d.bad)) * 1.2;
    const step = trendData.length>1 ? plotW/(trendData.length-1) : plotW;
    let grid='', labelsHtml='', lines={ok:'',warn:'',bad:''}, circles='';
    [0,0.5,1].forEach(f=>{
      const y = padT + plotH - plotH*f;
      grid += '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4"/>';
      grid += '<text x="'+(padL-6)+'" y="'+(y+3)+'" text-anchor="end" font-size="10" fill="var(--text-muted)">'+Math.round(maxVal*f)+'</text>';
    });
    const colors = { ok:'var(--green)', warn:'var(--yellow)', bad:'var(--red)' };
    trendData.forEach((d,i)=>{
      const x = padL + (trendData.length===1 ? plotW/2 : i*step);
      ['ok','warn','bad'].forEach(k=>{
        const y = padT + plotH - (d[k]/maxVal)*plotH;
        lines[k] += (i?' L ':'M ') + x + ' ' + y;
        circles += '<circle cx="'+x+'" cy="'+y+'" r="3" fill="'+colors[k]+'" opacity="0.9"/>';
      });
      if(i%Math.ceil(trendData.length/10)===0 || trendData.length<=10)
        labelsHtml += '<text x="'+x+'" y="'+(H-9)+'" text-anchor="middle" font-size="10" fill="var(--text-muted)">'+escapeHtml(d.label)+'</text>';
    });
    let svg = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%; max-width:'+W+'px; height:'+H+'px;">'+grid;
    Object.entries(lines).forEach(([k,pts])=>{
      svg += '<path d="'+pts+'" fill="none" stroke="'+colors[k]+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>';
    });
    svg += circles + labelsHtml + '</svg>';
    return '<div class="table-scroll" style="padding-bottom:4px;">'+svg+'</div>';
  }

  function buildTrendLineSVG(buckets, field){
    const vals = (buckets || []).map(b=>Number(b[field])||0);
    if(vals.length===0 || vals.every(v=>v===0)) return '<div class="chart-empty">אין נתונים למגמה בטווח הנבחר</div>';
    const W = Math.max(520, vals.length*46), H=170, padL=42, padR=12, padT=12, padB=28;
    const plotW = W-padL-padR, plotH = H-padT-padB;
    const maxVal = Math.max(1, ...vals) * 1.15;
    const step = vals.length>1 ? plotW/(vals.length-1) : plotW;
    let pts = '', circles = '', labels = '', grid = '';
    [0,0.5,1].forEach(f=>{
      const y = padT + plotH - plotH*f;
      grid += '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4"/>';
      grid += '<text x="'+(padL-8)+'" y="'+(y+3)+'" text-anchor="end" font-size="10" fill="var(--text-muted)" font-family="JetBrains Mono, monospace">'+fmt(maxVal*f)+'</text>';
    });
    vals.forEach((v,i)=>{
      const x = padL + (vals.length===1 ? plotW/2 : i*step);
      const y = padT + plotH - (v/maxVal)*plotH;
      pts += (i?' L ':'M ') + x + ' ' + y;
      circles += '<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="var(--teal)"/>';
      const label = (buckets[i] && buckets[i].label) ? buckets[i].label : '';
      if(i%Math.ceil(vals.length/10)===0 || vals.length<=10) labels += '<text x="'+x+'" y="'+(H-9)+'" text-anchor="middle" font-size="10" fill="var(--text-muted)">'+escapeHtml(label)+'</text>';
    });
    return '<svg class="trend-line" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'+grid+'<path d="'+pts+'" fill="none" stroke="var(--teal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+circles+labels+'</svg>';
  }

  function numberValue(v){
    const n = Number(v || 0);
    return isFinite(n) ? n : 0;
  }

  function excelSafe(v){
    if(v === undefined || v === null) return '';
    if(typeof v === 'string' && v.startsWith('=')) return "'" + v;
    return v;
  }

  function addSheetFromRows(wb, name, rows, headers, options){
    const data = [headers].concat((rows || []).map(r => headers.map(h => excelSafe(r[h]))));
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws['!cols'] = headers.map(h => ({wch: Math.min(Math.max(String(h).length + 4, 12), 34)}));
    ws['!autofilter'] = {ref: XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:Math.max(data.length-1,0), c:Math.max(headers.length-1,0)}})};
    ws['!freeze'] = {xSplit:0, ySplit:1};
    applyExcelDesign(ws, data.length, headers.length, options || {});
    XLSX.utils.book_append_sheet(wb, ws, name.substring(0,31));
    return ws;
  }

  function excelCell(ws, r, c){
    const addr = XLSX.utils.encode_cell({r:r, c:c});
    if(!ws[addr]) ws[addr] = {t:'s', v:''};
    return ws[addr];
  }

  function pctStatusColor(v){
    const n = Number(v || 0);
    if(n >= 100) return 'C6EFCE';
    if(n >= 75) return 'FFEB9C';
    return 'FFC7CE';
  }

  function pctStatusText(v){
    const n = Number(v || 0);
    if(n >= 100) return '🟢 עמידה מלאה';
    if(n >= 75) return '🟡 קרוב ליעד';
    return '🔴 מתחת ליעד';
  }

  function progressBar(actual, target){
    const a = Number(actual || 0), t = Number(target || 0);
    if(!t || t <= 0) return '';
    const pct = Math.max(0, Math.min(1, a/t));
    const full = Math.round(pct * 20);
    return '█'.repeat(full) + '░'.repeat(20-full) + ' ' + Math.round(a/t*100) + '%';
  }

  function applyExcelDesign(ws, rowCount, colCount, options){
    const headerFill = options.headerFill || '1F4E78';
    const zebraFill = options.zebraFill || 'F3F6FA';
    const headerFont = {bold:true, color:{rgb:'FFFFFF'}};
    const thinBorder = {top:{style:'thin', color:{rgb:'D9E2F3'}}, bottom:{style:'thin', color:{rgb:'D9E2F3'}}, left:{style:'thin', color:{rgb:'D9E2F3'}}, right:{style:'thin', color:{rgb:'D9E2F3'}}};
    for(let c=0;c<colCount;c++){
      const cell = excelCell(ws, 0, c);
      cell.s = {font:headerFont, fill:{fgColor:{rgb:headerFill}}, alignment:{horizontal:'center', vertical:'center', wrapText:true}, border:thinBorder};
    }
    for(let r=1;r<rowCount;r++){
      for(let c=0;c<colCount;c++){
        const cell = excelCell(ws, r, c);
        cell.s = {alignment:{horizontal:'right', vertical:'center', wrapText:true}, border:thinBorder};
        if(r % 2 === 0) cell.s.fill = {fgColor:{rgb:zebraFill}};
        const v = cell.v;
        if(typeof v === 'string' && (v.includes('🔴') || v.includes('חריגה') || v.includes('מתחת'))){
          cell.s.fill = {fgColor:{rgb:'FFC7CE'}}; cell.s.font = {color:{rgb:'9C0006'}, bold:true};

          cell.s.fill = {fgColor:{rgb:'FFEB9C'}}; cell.s.font = {color:{rgb:'9C6500'}, bold:true};
        } else if(typeof v === 'string' && (v.includes('🟢') || v.includes('עמידה מלאה') || v.includes('תקין'))){
          cell.s.fill = {fgColor:{rgb:'C6EFCE'}}; cell.s.font = {color:{rgb:'006100'}, bold:true};

  function buildFacilityScoreRows(view, summary){
    const byFac = {};
    (view.filtered || []).forEach(e=>{
      const f = e.facility || 'לא מוגדר';
      if(!byFac[f]) byFac[f] = {facility:f, production:0, packaging:0, targetPackaging:0, targetProduction:0, rows:0, closed:0, open:0, qualityTotal:0, qualityGood:0, qualityPending:0, qualityBad:0};
      const g = byFac[f];
      g.rows++;
      g.production += numberValue(e.production);
      g.packaging += numberValue(e.packaging);
      g.targetPackaging += getPackagingTarget(e);
      g.targetProduction += getProductionTarget(e);
      if(isOrderClosed(e)) g.closed++;
      else if(e.systemStatus) g.open++;
    });
    (summary.qRows || []).forEach(q=>{
      const f = q.facility || 'לא מוגדר';
      if(!byFac[f]) byFac[f] = {facility:f, production:0, packaging:0, targetPackaging:0, targetProduction:0, rows:0, closed:0, open:0, qualityTotal:0, qualityGood:0, qualityPending:0, qualityBad:0};
      const g = byFac[f];
      g.qualityTotal++;
      if(q.worst === 'bad') g.qualityBad++;
      else if(q.worst === 'conditional') g.qualityPending++;
      else g.qualityGood++;
    });
    const facilityTargets = {};
    facilityTargetRowsForView(view).forEach(r=>{ facilityTargets[r.facility] = r; });
    return Object.values(byFac).map(g=>{
      const configured = facilityTargets[g.facility];
      const target = configured ? configured.target : (g.targetPackaging || g.targetProduction || 0);
      const actualForTarget = configured ? configured.actual : (g.packaging || g.production || 0);
      const achievement = target>0 ? actualForTarget/target*100 : (actualForTarget>0 ? 100 : 0);
      const qualityPct = g.qualityTotal>0 ? g.qualityGood/g.qualityTotal*100 : 100;
      const outputScore = Math.min(100, achievement);
      const qualityScore = Math.max(0, qualityPct - (g.qualityBad*10));
      const score = Math.round(outputScore*0.40 + Math.min(100, achievement)*0.30 + Math.min(100, qualityScore)*0.30);
      const status = score>=90 ? '🟢 מצוין' : (score>=75 ? '🟡 דורש מעקב' : '🔴 לטיפול');
      return Object.assign(g, {achievement, qualityPct, score, status});
    }).sort((a,b)=>b.score-a.score);
  }

  function makeSafeFileName(name){
    return String(name || 'report.xlsx').replace(/[\\/:*?"<>|]+/g, '_');
  }

  function saveDownloadHistory(fileName, url, type){
    try{
      const key = 'generated_reports_history_v1';
      const list = JSON.parse(localStorage.getItem(key) || '[]');
      list.unshift({fileName:fileName, url:url, type:type || 'Excel', createdAt:new Date().toLocaleString('he-IL')});
      localStorage.setItem(key, JSON.stringify(list.slice(0,12)));
    }catch(e){}
  }

  function showFileDownloadDialog(fileName, blob, mimeType){

    const excelMime = mimeType || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    let safeName = makeSafeFileName(fileName || 'dashboard_report.xlsx');
    if(!/\.xlsx$/i.test(safeName)) safeName += '.xlsx';
    const url = URL.createObjectURL(blob);
    saveDownloadHistory(safeName, url, 'Excel XLSX');

    const old = root.querySelector('#downloadReadyOverlay');
    if(old) old.remove();

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay open';
    overlay.id = 'downloadReadyOverlay';
    overlay.innerHTML = ''+
      '<div class="modal" style="max-width:590px;">'+
        '<h3>✅ דוח Excel מוכן להורדה</h3>'+ 
        '<div class="wa-preview" style="max-height:none; line-height:1.8;">'+

        '</div>'+

          '<button class="btn primary" id="shareReportFile">📤 שתף / שמור כקובץ Excel</button>'+ 
          '<a class="btn secondary" id="directDownloadReport" href="'+url+'" download="'+escapeHtml(safeName)+'" type="'+excelMime+'">📥 הורד XLSX</a>'+ 
          '<button class="btn secondary" id="copyReportName">📋 העתק שם קובץ</button>'+ 
          '<button class="btn secondary" id="closeDownloadDialog">סגור</button>'+

        '<div class="shared-note">באייפון: Files / קבצים. באנדרואיד: Downloads / הורדות. הקובץ צריך להסתיים ב‑.xlsx.</div>'+ 
      '</div>';
    root.appendChild(overlay);

    const downloadLink = overlay.querySelector('#directDownloadReport');
    const shareBtn = overlay.querySelector('#shareReportFile');
    const copyBtn = overlay.querySelector('#copyReportName');
    const closeBtn = overlay.querySelector('#closeDownloadDialog');

    shareBtn.onclick = async ()=>{
      try{
        const file = new File([blob], safeName, {type: excelMime});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          await navigator.share({title:'דוח ייצור ואריזה', text:'מצורף דוח Excel בפורמט XLSX', files:[file]});
          showToast('נפתח שיתוף קובץ Excel');
        } else {
          downloadLink.click();
          showToast('שיתוף קובץ לא נתמך — הופעלה הורדת XLSX');
        }
      } catch(e){
        downloadLink.click();
        showToast('לא ניתן לשתף ישירות — הופעלה הורדת XLSX');
      }
    };

    copyBtn.onclick = async ()=>{
      try{
        await navigator.clipboard.writeText(safeName);
        showToast('שם הקובץ הועתק');
      }catch(e){ showToast(safeName); }
    };
    closeBtn.onclick = ()=>{
      overlay.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 30000);
    };
    overlay.onclick = e=>{ if(e.target === overlay){ closeBtn.click(); } };
  }

  function writeWorkbookForMobile(wb, fileName){
    const mime = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    let safeName = makeSafeFileName(fileName || 'dashboard_report.xlsx');
    if(!/\.xlsx$/i.test(safeName)) safeName += '.xlsx';
    /* cellStyles:true — נדרש כדי שעיצוב התאים (גבולות/מילוי/יישור) ייכתב לקובץ */
    const out = XLSX.write(wb, {bookType:'xlsx', type:'array', compression:true, cellStyles:true});
    const blob = new Blob([out], {type:mime});
    showFileDownloadDialog(safeName, blob, mime);
  }
