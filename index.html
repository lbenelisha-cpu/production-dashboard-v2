  function normKeyPart(v){ return String(v || '').trim().toUpperCase(); }
  function qualityKey(row){ return [normKeyPart(row.date), normKeyPart(row.workOrder), normKeyPart(row.batch)].join('|'); }
  function qualityKeyFallback(row){ return [normKeyPart(row.date), normKeyPart(row.workOrder)].join('|'); }

  function normalizeFacilityForQuality(f){
    return normalizeFacilityForLoad(f);
  }

  function qualityBatchDateKey(row){
    return [normKeyPart(row.date), normKeyPart(row.batch)].join('|');
  }

  function qualityMatchesPackaging(q, e){
    if(!q || !e) return false;
    const sameDate = normKeyPart(q.date) === normKeyPart(e.date);
    const sameBatch = normKeyPart(q.batch) && normKeyPart(q.batch) === normKeyPart(e.batch);
    const qFac = normalizeFacilityForQuality(q.facility);
    const eFac = normalizeFacilityForQuality(e.facility);
    const sameFacility = !qFac || !eFac || qFac === eFac;
    const sameWorkOrder = normKeyPart(q.workOrder) && normKeyPart(q.workOrder) === normKeyPart(e.workOrder);

    if(sameDate && sameWorkOrder && sameBatch) return true;
    if(sameDate && sameBatch && sameFacility) return true;
    return false;
  }


  function classifyQuality(row){
    const status = String(row.resultStatus || '').toUpperCase();
    const approvalRaw = String(row.qaApproval || '');
    const approval = approvalRaw.toUpperCase();
    const ud = String(row.udCode || '').toUpperCase();
    const rejectedCount = Number(row.rejectedCharacteristics || 0);

    if(
      status.includes('REJECT') ||
      approval.includes('CONTAMIN') ||
      ud.includes('CONTAMIN') ||
      approvalRaw.includes('פסולה') ||
      approvalRaw.includes('פסול')
    ) return 'bad';

    if(
      approval.includes('RESTRICT') ||
      approval.includes('CONDITION') ||
      ud.includes('RESTRICT') ||
      ud.includes('COND') ||
      approvalRaw.includes('חריג') ||
      approvalRaw.includes('מוגבל') ||
      rejectedCount > 0
    ) return 'conditional';

    return 'ok';
  }

  function qualityLabel(cls){
    if(cls === 'bad') return '🔴 חריגה';
    if(cls === 'conditional') return '🟠 מותנה / מוגבל';
    return '🟢 תקין';
  }

  function udCodeInfo(udCode){
    if(!udCode) return null;
    // Extract the code prefix (e.g. "A1" from "A1-Release", "A3R" from "A3R-Restricted - recycling")
    const raw = (''+udCode).trim();
    const prefix = (raw.match(/^([A-Za-z0-9]+)/)||['',''])[1].toUpperCase();
    if(['A1','A4','A5'].includes(prefix))
      return { color:'var(--green)',  label: raw, costLabel:'ללא עלות' };
    if(['A7','A8'].includes(prefix))
      return { color:'var(--yellow)', label: raw, costLabel:'ללא עלות' };
    if(['A3R','A6'].includes(prefix))
      return { color:'var(--red)',    label: raw, costLabel:'עלות מחזור מתקן' };
    if(['A3I','A2'].includes(prefix))
      return { color:'var(--red)',    label: raw, costLabel:'עלות השמדה' };
    return { color:'var(--red)', label: raw, costLabel:'' };
  }

  function getUDCodeForEntry(e){
    if(!e.batch) return null;
    const batchNorm = String(e.batch).replace(/^0+/,'').trim();
    const matNorm = String(e.materialCode||'').replace(/\.0$/,'').trim();
    // Match by מק"ט + מספר מנה when the material is known; fall back to batch-only
    // only when the production row has no material code.
    const best = matNorm
      ? qualityBestByMatBatch[matNorm+'|'+batchNorm]
      : qualityBestByKey[batchNorm];
    return best ? best.udCode : null;
  }

  function buildQualitySummary(){
    const byKey = {};
    const bestByBatch = {};
    const bestByMatBatch = {};
    qualityEntries.forEach(q=>{
      // Build bestByKey cache (batch -> latest udDate row)
      const bk = String(q.batch||'').replace(/^0+/,'').trim();
      if(bk && q.udCode){
        const ex = bestByBatch[bk];
        if(!ex || (q.udDate||0) > (ex.udDate||0)) bestByBatch[bk] = q;
        // Precise index by מק"ט + מספר מנה for matching production batches to the
        // quality decision of the SAME material (not merely the same batch number).
        const mk = String(q.materialCode||'').replace(/\.0$/,'').trim();
        if(mk){
          const mbk = mk+'|'+bk;
          const ex2 = bestByMatBatch[mbk];
          if(!ex2 || (q.udDate||0) > (ex2.udDate||0)) bestByMatBatch[mbk] = q;
        }
      }
      // Build qualitySummary (for existing panels)
      const key = qualityKey(q);
      if(!byKey[key]){
        byKey[key] = {
          key:key, date:q.date||'', workOrder:q.workOrder||'', batch:q.batch||'', materialName:q.materialName||'',
          facility:q.facility||'', line:'', inspectionLot:'', orderType:'', deliveredQuantity:0,
          totalTests:0, rejections:0, conditional:0, restricted:0, contaminated:0, worst:'ok', examples:[]
        };
      }
      const g = byKey[key];
      g.totalTests++;
      const approval = String(q.qaApproval || '').toUpperCase();
      const ud = String(q.udCode || '').toUpperCase();
      const cls = classifyQuality(q);
      if(approval.includes('CONDITION') || ud.includes('COND')) g.conditional++;
      if(approval.includes('RESTRICT') || ud.includes('RESTRICT')) g.restricted++;
      if(approval.includes('CONTAMIN') || ud.includes('CONTAMIN')) g.contaminated++;
      if(cls === 'bad') g.worst = 'bad';
      else if(cls === 'conditional' && g.worst !== 'bad') g.worst = 'conditional';
      if(cls !== 'ok' && g.examples.length < 3){
        g.examples.push([q.qaApproval, q.udCode].filter(Boolean).join(' | '));
      }
    });
    qualitySummary = byKey;
    qualityBestByKey = bestByBatch;
    qualityBestByMatBatch = bestByMatBatch;
  }

  function getQualityForPackaging(e){
    const exact = qualitySummary[qualityKey(e)];
    if(exact) return exact;

    const matches = Object.values(qualitySummary).filter(q => qualityMatchesPackaging(q, e));
    if(matches.length === 1) return matches[0];
    if(matches.length > 1){
      const worst = matches.some(q=>q.worst==='bad') ? 'bad' : (matches.some(q=>q.worst==='conditional') ? 'conditional' : 'ok');
      return {
        date: e.date,
        workOrder: e.workOrder,
        batch: e.batch,
        materialName: e.materialName,
        facility: e.facility,
        totalTests: matches.reduce((s,q)=>s+(q.totalTests||0),0),
        rejections: matches.reduce((s,q)=>s+(q.rejections||0),0),
        restricted: matches.reduce((s,q)=>s+(q.restricted||0),0),
        contaminated: matches.reduce((s,q)=>s+(q.contaminated||0),0),
        worst,
        examples: matches.flatMap(q=>q.examples||[]).slice(0,3)
      };
    }
    return null;
  }

  async function mapWithConcurrency(items, limit, worker){
    const results = new Array(items.length);
    let next = 0;
    async function run(){
      while(true){
        const i = next++;
        if(i >= items.length) return;
        results[i] = await worker(items[i], i);
      }
    }
    await Promise.all(Array.from({length: Math.min(limit, items.length)}, run));
    return results;
  }

  async function persistQuality(){
    try {
      const bestByBatch = {};
      qualityEntries = filterQualityRowsToDisplayedFacilities(qualityEntries || []);
      qualityEntries.forEach(q=>{
        // V4.8.39: המתקן כבר נפתר מול נתוני הכמות וסונן לסרגל.
        if(!isDisplayedFacilityForLoad(q.facility)) return;
        if(!q.batch || !q.udCode) return;
        const bk = String(q.batch).replace(/^0+/,'').trim();
        // Dedup by מק"ט + מספר מנה so batches reused across different materials are
        // each preserved, instead of collapsing to a single row per batch number.
        const mk = String(q.materialCode||'').replace(/\.0$/,'').trim();
        const dedupKey = mk ? (mk+'|'+bk) : bk;
        const existing = bestByBatch[dedupKey];
        if(!existing || (q.udDate||0) > (existing.udDate||0)){
          bestByBatch[dedupKey] = {
            batch: bk,
            udCode: q.udCode || '',
            udDate: q.udDate || 0,
            materialCode: q.materialCode || '',
            materialName: q.materialName || '',
            qaApproval: q.qaApproval || '',
            facility: q.facility || '',
            inspectionLot: q.inspectionLot || '',
            orderType: q.orderType || '',
            workOrder: q.workOrder || '',
            date: q.date || ''
          };
        }
      });

      const rows = Object.values(bestByBatch);
      const chunks = [];
      for(let i=0;i<rows.length;i+=QUALITY_CHUNK_SIZE){
        chunks.push(rows.slice(i, i + QUALITY_CHUNK_SIZE));
      }
      console.log('persistQuality chunked:', rows.length, 'rows in', chunks.length, 'chunks');

      const previousManifestRes = await _dashStorage.get(QUALITY_MANIFEST_KEY).catch(()=>null);
      let previousManifest = null;
      try { previousManifest = previousManifestRes?.value ? JSON.parse(previousManifestRes.value) : null; } catch(e){}

      await mapWithConcurrency(chunks, 3, async (chunk, i)=>{
        const key = QUALITY_CHUNK_PREFIX + i;
        await _dashStorage.set(key, JSON.stringify(chunk));
      });

      const manifest = {
        version: 4,
        savedAt: new Date().toISOString(),
        totalRows: rows.length,
        chunkSize: QUALITY_CHUNK_SIZE,
        chunkCount: chunks.length,
        keys: chunks.map((_,i)=>QUALITY_CHUNK_PREFIX+i)
      };
      await _dashStorage.set(QUALITY_MANIFEST_KEY, JSON.stringify(manifest));

      // Remove obsolete chunks only after the new manifest is safely written.
      if(previousManifest && Array.isArray(previousManifest.keys)){
        const keep = new Set(manifest.keys);
        const obsolete = previousManifest.keys.filter(k=>!keep.has(k));
        await mapWithConcurrency(obsolete, 3, k=>_dashStorage.delete(k).catch(()=>null));
      }

      const verifyManifestRes = await _dashStorage.get(QUALITY_MANIFEST_KEY);
      const verifiedManifest = JSON.parse(verifyManifestRes?.value || '{}');
      if(Number(verifiedManifest.totalRows) !== rows.length || Number(verifiedManifest.chunkCount) !== chunks.length){
        throw new Error('אימות אינדקס נתוני האיכות נכשל');
      }
      if(chunks.length){
        const verifyFirst = await _dashStorage.get(QUALITY_CHUNK_PREFIX+'0');
        const firstRows = JSON.parse(verifyFirst?.value || '[]');
        if(!Array.isArray(firstRows) || !firstRows.length) throw new Error('אימות מנת הנתונים הראשונה נכשל');
      }

      qualityBestByKey = bestByBatch;
      qualityEntries = rows;
      buildQualitySummary();
      const withFacility = rows.filter(v=>String(v.facility||'').trim()).length;
      const withMaterial = rows.filter(v=>String(v.materialName||'').trim()).length;
      const withCode = rows.filter(v=>String(v.materialCode||'').trim()).length;
      showToast('נתוני איכות נשמרו בענן: '+rows.length+' מנות ב־'+chunks.length+' חלקים · '+withFacility+' עם מתקן · '+withCode+' עם מק״ט · '+withMaterial+' עם שם חומר');
      return true;
    } catch(e2){
      console.error('persistQuality error:', e2);
      showToast('שגיאה בשמירת נתוני האיכות באחסון המשותף: '+(e2.message||e2), true);
      return false;
    }
  }

  // ---------- מטמון מקומי (IndexedDB) ----------
  // הורדת 280K שורות איכות מהשרת היא ~234 בקשות ו-14MB. במחשב אחר, ובכל
  // רענון, זה חוזר מאפס. כאן שומרים את השורות המפוענחות מקומית ומצמידים
  // להן חתימת מניפסט. בטעינה הבאה מספיקה בקשה אחת — המניפסט — וכל עוד
  // החתימה זהה הנתונים נקראים מהדיסק המקומי במקום מהרשת.
  const IDB_NAME = 'iml-dashboard-cache';
  const IDB_STORE = 'datasets';
  let _idbPromise = null;
  function idbOpen(){
    if(_idbPromise) return _idbPromise;
    _idbPromise = new Promise((resolve,reject)=>{
      if(typeof indexedDB === 'undefined') return reject(new Error('no indexedDB'));
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = ()=>{ const db=req.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror  = ()=>reject(req.error);
    }).catch(err=>{ _idbPromise=null; throw err; });
    return _idbPromise;
  }
  async function idbGet(key){
    try{
      const db = await idbOpen();
      return await new Promise((resolve,reject)=>{
        const r = db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(key);
        r.onsuccess = ()=>resolve(r.result || null);
        r.onerror   = ()=>reject(r.error);
      });
    }catch(e){ return null; }
  }
  async function idbSet(key, value){
    try{
      const db = await idbOpen();
      return await new Promise((resolve,reject)=>{
        const tx = db.transaction(IDB_STORE,'readwrite');
        tx.objectStore(IDB_STORE).put(value, key);
        tx.oncomplete = ()=>resolve(true);
        tx.onerror    = ()=>reject(tx.error);
      });
    }catch(e){ return false; }
  }

  // חתימה שמזהה גרסת נתונים. כל שינוי בשרת משנה אותה ומבטל את המטמון.
  function manifestSignature(manifest){
    if(!manifest) return '';
    return [manifest.savedAt||'', manifest.totalRows||'', manifest.chunkCount||'',
            Array.isArray(manifest.keys)?manifest.keys.length:''].join('|');
  }

  async function cachedRows(cacheKey, signature, fetchRows, onStatus){
    if(signature && !_forceFreshStorageReads){
      const hit = await idbGet(cacheKey);
      if(hit && hit.sig === signature && Array.isArray(hit.rows)){
        onStatus && onStatus('cache', hit.rows.length);
        return hit.rows;
      }
    }
    onStatus && onStatus('network', 0);
    const rows = await fetchRows();
    if(signature) idbSet(cacheKey, { sig:signature, rows, at:new Date().toISOString() });
    return rows;
  }

  async function loadQuality(){
    let loaded = false;
    if(!IS_LOCAL_FILE){
      try {
        const manifestRes = await _dashStorage.get(QUALITY_MANIFEST_KEY);
        if(manifestRes?.value){
          const manifest = JSON.parse(manifestRes.value);
          const keys = Array.isArray(manifest.keys) ? manifest.keys : [];
          const sig=manifestSignature(manifest);
          const expectedRows=Number(manifest.totalRows||0);
          const fetchQualitySummaryFresh=async ()=>{
            const out=[];
            setLoadStatus('מוריד סיכום איכות מהשרת...');
            const chunkPairs = await _dashStorage.getMany(keys,{fresh:true});
            for(const pair of chunkPairs){
              let raw=pair&&pair.result&&pair.result.value!=null?pair.result.value:null;
              // If a batch read returned a missing chunk, retry that chunk individually.
              if(raw==null && pair && pair.key){
                try{
                  const one=await _dashStorage.get(pair.key,{fresh:true});
                  raw=one&&one.value!=null?one.value:null;
                }catch(e){}
              }
              if(raw==null) continue;
              try{
                const part=JSON.parse(raw);
                if(Array.isArray(part)) appendAll(out,part);
              }catch(e){}
            }
            return out;
          };
          let rows = await cachedRows('quality_summary', sig, fetchQualitySummaryFresh);
          // V4.8.22: never trust an empty/partial IndexedDB cache when the cloud
          // manifest explicitly says more rows exist. This repairs a PC that once
          // cached an incomplete download under an otherwise valid manifest.
          if(expectedRows>0 && rows.length!==expectedRows){
            console.warn('quality summary cache mismatch:',rows.length,'expected',expectedRows,'— forcing cloud reload');
            _cacheClear();
            rows=await fetchQualitySummaryFresh();
            if(rows.length===expectedRows){
              await idbSet('quality_summary',{sig,rows,at:new Date().toISOString()});
            }else{
              console.warn('quality summary cloud reload still partial:',rows.length,'expected',expectedRows);
            }
          }
          qualityEntries = rows;
          qualityBestByKey = {};
          rows.forEach(q=>{ if(q.batch) qualityBestByKey[String(q.batch).replace(/^0+/,'').trim()] = q; });
          loaded = true;
          console.log('Loaded shared quality chunks:', rows.length, 'rows');
        }
      } catch(e){ console.error('Shared chunked quality load failed:', e); }
    }

    // Backward compatibility with the former single-blob format.
    if(!loaded){
      let raw = null;
      try {
        const res = await _dashStorage.get(QUALITY_STORAGE_KEY);
        raw = res && res.value != null ? res.value : null;
      } catch(e){ console.error('Shared quality load failed:', e); }
      if(raw == null && IS_LOCAL_FILE){
        try { raw = localStorage.getItem(QUALITY_STORAGE_KEY); } catch(e){}
      }
      if(raw){
        try {
          const parsed = JSON.parse(raw);
          if(parsed && !Array.isArray(parsed) && typeof parsed === 'object'){
            qualityBestByKey = parsed;
            qualityEntries = Object.values(parsed);
          } else {
            qualityEntries = Array.isArray(parsed) ? parsed : [];
            qualityBestByKey = {};
            qualityEntries.forEach(q=>{ if(q.batch) qualityBestByKey[String(q.batch).replace(/^0+/,'').trim()] = q; });
          }
        } catch(e){ qualityEntries = []; qualityBestByKey = {}; }
      } else {
        qualityEntries = [];
        qualityBestByKey = {};
      }
    }
    buildQualitySummary();
  }


  // arr.push(...big) עובר דרך קריאת פונקציה עם ארגומנט לכל איבר, ומעל
  // ~125K איברים V8 זורק "Maximum call stack size exceeded". עם 280 אלף
  // שורות תוצאה זה מפיל את הטעינה מיד. הוספה במקטעים פותרת את זה.
  const APPEND_CHUNK = 20000;
  function appendAll(target, source){
    if(!source || !source.length) return target;
    for(let i=0;i<source.length;i+=APPEND_CHUNK){
      target.push.apply(target, source.slice(i, i+APPEND_CHUNK));
    }
    return target;
  }

  function normalizeBatch(v){ return String(v == null ? '' : v).trim().replace(/^0+/, ''); }

  function rebuildQualityTestIndex(){
    const byBatch = {};
    (qualityTestResults||[]).forEach(r=>{
      const bk = normalizeBatch(r.batch);
      if(!bk) return;
      if(!byBatch[bk]) byBatch[bk] = [];
      byBatch[bk].push(r);
    });
    Object.values(byBatch).forEach(arr=>arr.sort((a,b)=>String(a.testName||'').localeCompare(String(b.testName||''),'he')));
    qualityTestResultsByBatch = byBatch;
  }

  async function persistQualityTestResults(){
    try{
      // V4.8.34: מנקים גם תוצאות ישנות של מתקנים שאינם קיימים עוד בסרגל.
      const rows = filterQualityRowsToDisplayedFacilities(qualityTestResults || []);
      qualityTestResults = rows;
      const chunks=[];
      for(let i=0;i<rows.length;i+=QUALITY_RESULTS_CHUNK_SIZE) chunks.push(rows.slice(i,i+QUALITY_RESULTS_CHUNK_SIZE));
      const prevRes = await _dashStorage.get(QUALITY_RESULTS_MANIFEST_KEY).catch(()=>null);
      let prev=null; try{ prev=prevRes?.value?JSON.parse(prevRes.value):null; }catch(e){}
      await mapWithConcurrency(chunks,3,(chunk,i)=>_dashStorage.set(QUALITY_RESULTS_CHUNK_PREFIX+i,JSON.stringify(chunk)));
      const manifest={version:1,savedAt:new Date().toISOString(),totalRows:rows.length,chunkCount:chunks.length,keys:chunks.map((_,i)=>QUALITY_RESULTS_CHUNK_PREFIX+i)};
      await _dashStorage.set(QUALITY_RESULTS_MANIFEST_KEY,JSON.stringify(manifest));
      // זריעת המטמון המקומי בשורות שזה עתה נשלחו — מי שהעלה לא יוריד אותן שוב.
      idbSet('quality_results', { sig: manifestSignature(manifest), rows, at:new Date().toISOString() });
      if(prev&&Array.isArray(prev.keys)){
        const keep=new Set(manifest.keys);
        await mapWithConcurrency(prev.keys.filter(k=>!keep.has(k)),3,k=>_dashStorage.delete(k).catch(()=>null));
      }
      rebuildQualityTestIndex();
      return true;
    }catch(e){ console.error('persistQualityTestResults:',e); showToast('שגיאה בשמירת תוצאות הבדיקות: '+(e.message||e),true); return false; }
  }

  async function loadQualityTestResults(){
    qualityTestResults=[];
    try{
      const mres=await _dashStorage.get(QUALITY_RESULTS_MANIFEST_KEY);
      if(mres?.value){
        const m=JSON.parse(mres.value);
        const keys=Array.isArray(m.keys)?m.keys:[];
        const rsig=manifestSignature(m), expectedResults=Number(m.totalRows||0);
        const fetchResultsFresh=async ()=>{
          const rows=[];
          setLoadStatus('מוריד תוצאות איכות מהשרת ('+keys.length+' מקטעים)...');
          const pairs=await _dashStorage.getMany(keys,{fresh:true});
          for(const pair of pairs){
            let raw=pair&&pair.result&&pair.result.value!=null?pair.result.value:null;
            if(raw==null && pair&&pair.key){
              try{const one=await _dashStorage.get(pair.key,{fresh:true});raw=one&&one.value!=null?one.value:null;}catch(e){}
            }
            try{const part=JSON.parse(raw||'[]');if(Array.isArray(part))appendAll(rows,part);}catch(e){}
          }
          return rows;
        };
        qualityTestResults = await cachedRows('quality_results', rsig, fetchResultsFresh, (source,count)=>{
          if(source==='cache') setLoadStatus('תוצאות איכות מהמטמון המקומי ('+count.toLocaleString('he-IL')+' שורות)');
        });
        if(expectedResults>0 && qualityTestResults.length!==expectedResults){
          console.warn('quality results cache mismatch:',qualityTestResults.length,'expected',expectedResults,'— forcing cloud reload');
          qualityTestResults=await fetchResultsFresh();
          if(qualityTestResults.length===expectedResults){
            await idbSet('quality_results',{sig:rsig,rows:qualityTestResults,at:new Date().toISOString()});
          }
        }
      }
    }catch(e){ console.error('loadQualityTestResults:',e); }
    setLoadStatus('');
    rebuildQualityTestIndex();
  }

  function setLoadStatus(text){
    const el = (typeof root!=='undefined' && root && root.querySelector) ? root.querySelector('#dataStatusLine') : null;
    if(!el) return;
    if(text){ el.dataset.loading='1'; el.textContent='⏳ '+text; }
    else if(el.dataset.loading){ delete el.dataset.loading; try{ renderAll(); }catch(e){} }
  }

  function firstWorksheetGrid(wb, range){
    const name=wb.SheetNames[0], ws=wb.Sheets[name];
    return XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:false,range:range});
  }

  function detectQualityWorkbookType(wb){
    for(const sheetName of wb.SheetNames){
      const ws=wb.Sheets[sheetName];
      const decoded=XLSX.utils.decode_range(ws['!ref']||'A1:A1');
      const headerRange={s:{r:decoded.s.r,c:decoded.s.c},e:{r:decoded.s.r,c:decoded.e.c}};
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:false,range:headerRange});
      const h=(rows[0]||[]).map(v=>normalizeQualityHeader(v));
      if(h.includes('ud code') && (h.includes('batch number')||h.includes('batch')) && !h.includes('master insp characteristic')) return 'summary';
      if((h.includes('master insp characteristic') || h.includes('arithmetic mean of valid measured values')) && h.includes('batch number')) return 'results';
      if(h.includes('operation short text') && h.includes('batch number') && h.length>30) return 'results';
    }
    return 'unknown';
  }

  function parseTestHeader(raw){
    const text=String(raw||'').trim();
    if(!text) return null;
    const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
    const first=lines[0]||'';
    const codeMatch=first.match(/\((\d+)\)\s*$/);
    const testCode=codeMatch?codeMatch[1]:'';
    const testName=(codeMatch?first.slice(0,codeMatch.index):first).trim();
    const rangeText=lines.slice(1).join(' ').trim();
    let min=null,max=null;
    const rangeMatch=rangeText.match(/^\s*(-?\d+(?:[.,]\d+)?)\s*-\s*(-?\d+(?:[.,]\d+)?)\s*$/);
    if(rangeMatch){ min=Number(rangeMatch[1].replace(',','.')); max=Number(rangeMatch[2].replace(',','.')); }
    return {testName,testCode,rangeText,min,max};
  }

  function parseNumericResult(value){
    if(typeof value==='number' && isFinite(value)) return value;
    const s=String(value==null?'':value).trim().replace(',','.');
    if(/^[-+]?\d+(?:\.\d+)?$/.test(s)){ const n=Number(s); return isFinite(n)?n:null; }
    return null;
  }

  function isMissingTestValue(v){
    const s=String(v==null?'':v).trim().toUpperCase();
    return !s || s==='-' || s==='N/A' || s==='NA' || s==='N.A.' || s==='NOT APPLICABLE';
  }

  // Lightweight classifier: peek at the first ~40 rows of each sheet to decide whether a
  // workbook is a detailed test-RESULTS export (has measured value + limits) or a batch
  // SUMMARY export (UD Code per batch, no per-characteristic measurements). Avoids running
  // both heavy parsers over huge files.
  function classifyQualityWorkbook(wb){
    let hasResults=false, hasSummary=false;
    for(const sheetName of wb.SheetNames){
      const ws=wb.Sheets[sheetName];
      if(!ws || !ws['!ref']) continue;
      const full=XLSX.utils.decode_range(ws['!ref']);
      const probe={s:{r:full.s.r,c:full.s.c}, e:{r:Math.min(full.e.r, full.s.r+40), c:full.e.c}};
      let grid=[];
      try{ grid=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:false,range:XLSX.utils.encode_range(probe)}); }catch(e){ continue; }
      for(const row of grid){
        const m=mapQualityHeaders(row||[]);
        const hasMeasure=(m.measured_value!==undefined || m.lower_limit!==undefined || m.upper_limit!==undefined);
        if(m.batch!==undefined && (m.test_name!==undefined||m.operation_text!==undefined) && hasMeasure) hasResults=true;
        if(m.batch!==undefined && m.ud_code!==undefined && !hasMeasure) hasSummary=true;
      }
      if(hasResults || hasSummary) break; // first sheet with a recognizable header is enough
    }
    return {hasResults, hasSummary};
  }

  // מיפוי שורות תוצאה משורת כותרת + מקבץ שורות נתונים.
  // חולץ מתוך processQualityResultsWorkbook כדי שגם ה-Worker יוכל לקרוא לו
  // על מקטע שורות בכל פעם, במקום לבנות טבלה של 280K שורות בזיכרון בבת אחת.
  function mapQualityResultRows(headerRow, dataRows){
    const out=[];
    const map=mapQualityHeaders(headerRow||[]);
    if(map.batch===undefined) return out;
    const badStatus = v => {
      const t=String(v==null?'':v).trim().toUpperCase();
      if(!t) return false;
      return t.includes('REJECT') || t.includes('FAIL') || t.includes('NOT SUCCESS') || t.includes('OUT') || t.includes('חריג') || t.includes('פסול');
    };
    const get=(row,k)=>map[k]===undefined?'':row[map[k]];
        for(let i=0;i<dataRows.length;i++){
          const row=dataRows[i]||[];
          const batch=normalizeBatch(get(row,'batch'));
          if(!batch) continue;
          const facility=normalizeFacilityForQuality(get(row,'facility'));
          // V4.8.34: תוצאות איכות מחוץ למתקנים שבסרגל אינן נטענות ואינן נשמרות לענן.
          if(facility && !isDisplayedFacilityForLoad(facility)) continue;
          // שם הבדיקה נלקח ממאפיין הבדיקה. 'Operation short text' הוא שלב
          // התהליך ("בדיקות מעבדה") וזהה לכל השורות — הוא רק גיבוי.
          const testName=String(get(row,'test_name')||get(row,'operation_text')||'').trim();
          const rawResult=get(row,'measured_value');
          const qualitative=String(get(row,'qualitative')||'').trim();
          const resultValue=!isMissingTestValue(rawResult)?rawResult:(!isMissingTestValue(qualitative)?qualitative:'');
          const min=parseNumericResult(get(row,'lower_limit'));
          const max=parseNumericResult(get(row,'upper_limit'));
          const resultStatus=String(get(row,'result_status')||'').trim();
          // Keep every meaningful characteristic, even when the export does not contain an actual measured value.
          // In that case the modal shows — under “ערך בפועל” rather than hiding the entire test.
          if(!testName || testName==='-' || (isMissingTestValue(resultValue) && min===null && max===null && !resultStatus)) continue;
          const numeric=parseNumericResult(resultValue);
          let isDeviation=false, status='תקין';
          if(numeric!==null && (min!==null || max!==null)){
            if(min!==null && numeric<min){isDeviation=true;status='מתחת לגבול';}
            else if(max!==null && numeric>max){isDeviation=true;status='מעל הגבול';}
            else if(badStatus(resultStatus)){isDeviation=true;status=resultStatus||'חריגה';}
            else status='בתוך הטווח';
          }else if(badStatus(resultStatus)){
            isDeviation=true; status=resultStatus||'חריגה';
          }else if(resultStatus){
            status=resultStatus;
          }else{
            status='ללא גבולות';
          }
          const rangeText=(min!==null||max!==null)?((min!==null?min:'—')+' - '+(max!==null?max:'—')):'';
          out.push({
            batch,
            inspectionLot:String(get(row,'inspection_lot')||'').trim(),
            sample:String(get(row,'sample')||'').trim(),
            materialCode:String(get(row,'material_code')||'').replace(/\.0$/,'').trim(),
            material:String(get(row,'material_name')||'').trim(),
            operation:String(get(row,'work_order')||'').trim(),
            facility,
            testName,
            testCode:'',
            min,max,rangeText,
            result:String(resultValue),
            unit:String(get(row,'unit')||'').trim(),
            isDeviation,
            status,
            resultStatus,
            qaApproval:String(get(row,'qa_approval')||'').trim(),
            udCode:String(get(row,'ud_code')||'').trim(),
            remarks:String(get(row,'characteristic_remarks')||get(row,'remarks')||'').trim()
          });
    }
    return out;
  }

  function processQualityResultsWorkbook(wb){
    const results=[];
    const badStatus = v => {
      const t=String(v==null?'':v).trim().toUpperCase();
      if(!t) return false;
      return t.includes('REJECT') || t.includes('FAIL') || t.includes('NOT SUCCESS') || t.includes('OUT') || t.includes('חריג') || t.includes('פסול');
    };
    for(const sheetName of wb.SheetNames){
      const ws=wb.Sheets[sheetName];
      const grid=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:false});
      if(!grid.length) continue;
      let headerIndex=-1, map=null;
      for(let i=0;i<Math.min(grid.length,40);i++){
        const m=mapQualityHeaders(grid[i]||[]);
        if(m.batch!==undefined && (m.test_name!==undefined || m.operation_text!==undefined || m.measured_value!==undefined) && (m.inspection_lot!==undefined || m.material_code!==undefined)){
          headerIndex=i; map=m; break;
        }
      }
      if(headerIndex>=0){
        const mapped = mapQualityResultRows(grid[headerIndex], grid.slice(headerIndex+1));
        for(const r of mapped) results.push(r);
        continue;
      }

      // Backward compatibility: old wide pivot export.
      const range=XLSX.utils.decode_range(ws['!ref']||'A1:A1');
      const headers=[];
      for(let c=range.s.c;c<=range.e.c;c++) headers[c]=ws[XLSX.utils.encode_cell({r:range.s.r,c})]?.v ?? '';
      const norm=headers.map(normalizeQualityHeader);
      const batchCol=norm.indexOf('batch number'), lotCol=norm.indexOf('inspection lot #'), materialCol=norm.indexOf('material'), operationCol=norm.indexOf('operation short text');
      if(batchCol<0) continue;
      const testCols=[];
      for(let c=0;c<headers.length;c++){
        if(c===batchCol||c===lotCol||c===materialCol||c===operationCol) continue;
        const meta=parseTestHeader(headers[c]);
        if(meta && meta.testName && (meta.testCode||meta.rangeText)) testCols.push({c,...meta});
      }
      for(let r=range.s.r+1;r<=range.e.r;r++){
        const batch=normalizeBatch(ws[XLSX.utils.encode_cell({r,c:batchCol})]?.v);
        if(!batch) continue;
        const inspectionLot=lotCol>=0?String(ws[XLSX.utils.encode_cell({r,c:lotCol})]?.v??'').trim():'';
        const material=materialCol>=0?String(ws[XLSX.utils.encode_cell({r,c:materialCol})]?.v??'').trim():'';
        const operation=operationCol>=0?String(ws[XLSX.utils.encode_cell({r,c:operationCol})]?.v??'').trim():'';
        for(const tc of testCols){
          const cell=ws[XLSX.utils.encode_cell({r,c:tc.c})];
          if(!cell || isMissingTestValue(cell.v)) continue;
          const raw=cell.v, numeric=parseNumericResult(raw);
          let isDeviation=false, status='תוצאה טקסטואלית';
          if(numeric!==null && tc.min!==null && tc.max!==null){
            isDeviation=numeric<tc.min || numeric>tc.max;
            status=isDeviation?(numeric<tc.min?'מתחת לגבול':'מעל הגבול'):'בתוך הטווח';
          }else if(numeric!==null && tc.min===null){ isDeviation=true; status='לבדיקה'; }
          else { isDeviation=true; }
          results.push({batch,inspectionLot,material,operation,testName:tc.testName,testCode:tc.testCode,min:tc.min,max:tc.max,rangeText:tc.rangeText,result:String(raw),unit:'',isDeviation,status});
        }
      }
    }
    return results;
  }

  function processQualitySummaryWorkbook(wb){
    let selected=null;
    for(const sheetName of wb.SheetNames){
      const sheet=wb.Sheets[sheetName];
      const grid=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:true,blankrows:false});
      const found=findQualityHeaderRow(grid);
      if(found&&(!selected||found.score>selected.found.score)) selected={sheetName,grid,found};
      if(found&&found.score>=3&&found.map.batch!==undefined&&found.map.ud_code!==undefined) break;
    }
    if(!selected) return [];
    return processQualityRows(selected.grid[selected.found.index],selected.grid.slice(selected.found.index+1));
  }


  // ---------- פענוח קובץ איכות ב-Web Worker, בחלקים ----------
  // הקובץ הגדול מ-SAP (40MB, 280K שורות) לא ניתן לפענוח ב-thread הראשי:
  // XLSX.read לבדו עולה ~1.1GB, ובניית טבלה של 280K שורות בבת אחת מוסיפה
  // עוד מאות MB. שני הדברים יחד מפילים את הלשונית.
  //
  // כאן הפענוח רץ ב-Worker עם heap משלו, והשורות נקראות במקטעים של 20,000
  // ומוחזרות בזרם. ה-thread הראשי לא קופא, מוצגת התקדמות אמיתית, וקריסה
  // של ה-Worker ניתנת לתפיסה במקום להפיל את הדף.
  const QUALITY_WORKER_ROW_STEP = 20000;
  // כתובת ה-XLSX נלקחת מתג ה-script שנטען בפועל. אם ה-CDN הראשי נחסם
  // ונטענה כתובת גיבוי, ה-Worker חייב לטעון את אותה כתובת.
  function resolveXlsxUrl(){
    try{
      const tag = Array.from(document.getElementsByTagName('script'))
        .map(t=>t.src||'').find(src=>/\bxlsx[^/]*\.js/i.test(src));
      if(tag) return new URL(tag, location.href).href;
    }catch(e){}
    return 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';
  }
  let _qualityWorkerUrl = null;

  function buildQualityWorkerUrl(){
    if(_qualityWorkerUrl) return _qualityWorkerUrl;
    // מקור ה-Worker נבנה מהפונקציות עצמן דרך toString(), כך שאין עותק שני
    // של לוגיקת הפענוח שיכול להיפרד מהמקור.
    const fns = [normalizeQualityHeader, mapQualityHeaders, findQualityHeaderRow,
                 normalizeBatch, isMissingTestValue, parseNumericResult, parseTestHeader,
                 normalizeFacilityForLoad, isDisplayedFacilityForLoad, normalizeFacilityForQuality, dateObjToISO, excelSerialToISO, normalizeDateStr,
                 mapQualityResultRows, processQualityRows, classifyQualityWorkbook,
                 processQualitySummaryWorkbook];
    const src = "importScripts(" + JSON.stringify(resolveXlsxUrl()) + ");\n"
      + "var QUALITY_HEADER_MAP=" + JSON.stringify(QUALITY_HEADER_MAP) + ";\n"
      + "var OLD_TO_NEW_FACILITY=" + JSON.stringify(OLD_TO_NEW_FACILITY) + ";\n"
      + "var FACILITY_OPTIONS=" + JSON.stringify(FACILITY_OPTIONS) + ";\n"
      + "var ROW_STEP=" + QUALITY_WORKER_ROW_STEP + ";\n"
      + fns.map(f => f.toString()).join("\n\n") + "\n\n"
      + QUALITY_WORKER_MAIN;
    _qualityWorkerUrl = URL.createObjectURL(new Blob([src], {type:'text/javascript'}));
    return _qualityWorkerUrl;
  }

  const QUALITY_WORKER_MAIN = [
    "self.onmessage = function(e){",
    "  var buf = e.data.buf;",
    "  var forcedMode = e.data.mode || \"auto\";",
    "  try {",
    "    self.postMessage({type:'progress', pct:0, message:'קורא את הקובץ'});",
    "    // dense:true חובה כאן. בלעדיו SheetJS בונה אובייקט עם ~9.5 מיליון מפתחות",
    "    // מחרוזת (אחד לכל תא) והקריאה נמשכת דקות ארוכות במקום שניות.",
    "    var wb = XLSX.read(new Uint8Array(buf), {type:'array', cellDates:false, dense:true});",
    "    var cls = classifyQualityWorkbook(wb);",
    "    var runSummary = forcedMode === 'summary' || (forcedMode === 'auto' && (cls.hasSummary || (!cls.hasSummary && !cls.hasResults)));",
    "    var runResults = forcedMode === 'results' || (forcedMode === 'auto' && (cls.hasResults || (!cls.hasSummary && !cls.hasResults)));",
    "    if(runSummary){",
    "      var summary = processQualitySummaryWorkbook(wb) || [];",
    "      if(summary.length) self.postMessage({type:'summary', rows:summary});",
    "    }",
    "    if(runResults){",
    "      for(var si=0; si<wb.SheetNames.length; si++){",
    "        var ws = wb.Sheets[wb.SheetNames[si]];",
    "        if(!ws || !ws['!ref']) continue;",
    "        var range = XLSX.utils.decode_range(ws['!ref']);",
    "        var probeEnd = Math.min(range.e.r, range.s.r + 40);",
    "        var probe = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true, blankrows:false,",
    "          range: XLSX.utils.encode_range({s:{r:range.s.r,c:range.s.c}, e:{r:probeEnd,c:range.e.c}})});",
    "        var headerRow = null, headerAbs = -1;",
    "        for(var i=0;i<probe.length;i++){",
    "          var m = mapQualityHeaders(probe[i]||[]);",
    "          if(m.batch!==undefined && (m.test_name!==undefined || m.operation_text!==undefined || m.measured_value!==undefined) &&",
    "             (m.inspection_lot!==undefined || m.material_code!==undefined)){",
    "            headerRow = probe[i]; headerAbs = range.s.r + i; break;",
    "          }",
    "        }",
    "        if(headerAbs < 0) continue;",
    "        var total = range.e.r - headerAbs;",
    "        var done = 0;",
    "        for(var start = headerAbs + 1; start <= range.e.r; start += ROW_STEP){",
    "          var end = Math.min(range.e.r, start + ROW_STEP - 1);",
    "          var grid = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true, blankrows:false,",
    "            range: XLSX.utils.encode_range({s:{r:start,c:range.s.c}, e:{r:end,c:range.e.c}})});",
    "          var rows = mapQualityResultRows(headerRow, grid);",
    "          grid = null;",
    "          done = end - headerAbs;",
    "          self.postMessage({type:'results', rows:rows, pct: total ? Math.round(done/total*100) : 100});",
    "        }",
    "        break;",
    "      }",
    "    }",
    "    self.postMessage({type:'done'});",
    "  } catch(err){",
    "    self.postMessage({type:'error', message: String((err && err.message) || err)});",
    "  }",
    "};"
  ].join("\n");

  function parseQualityFileInWorker(file, onProgress, forcedMode){
    return new Promise(function(resolve, reject){
      var worker;
      try { worker = new Worker(buildQualityWorkerUrl()); }
      catch(e){ reject(Object.assign(new Error('WORKER_UNAVAILABLE'), {code:'WORKER_UNAVAILABLE'})); return; }
      var summaryRows = [], resultRows = [];
      var finish = function(fn, payload){ try{ worker.terminate(); }catch(e){} fn(payload); };
      worker.onmessage = function(ev){
        var d = ev.data || {};
        if(d.type === 'progress'){ onProgress && onProgress(d); return; }
        if(d.type === 'summary'){ appendAll(summaryRows, d.rows || []); return; }
        if(d.type === 'results'){
          if(d.rows && d.rows.length) appendAll(resultRows, d.rows);
          onProgress && onProgress({pct: d.pct, message: 'מפענח שורות: ' + resultRows.length.toLocaleString('he-IL')});
          return;
        }
        if(d.type === 'done') return finish(resolve, {summaryRows: summaryRows, resultRows: resultRows});
        if(d.type === 'error') return finish(reject, new Error(d.message || 'שגיאת פענוח'));
      };
      // נורה גם כשה-Worker נהרג מחוסר זיכרון — הדף שורד ואפשר לדווח.
      worker.onerror = function(ev){
        finish(reject, Object.assign(new Error(ev && ev.message || 'WORKER_CRASHED'), {code:'WORKER_CRASHED'}));
      };
      file.arrayBuffer().then(function(buf){
        worker.postMessage({buf: buf, mode: forcedMode||'auto'}, [buf]);
      }, function(err){ finish(reject, err); });
    });
  }


  // ---------- V4.8.39: פענוח XLSX גדול במסלול חסכוני בזיכרון ----------
  // SheetJS חייב לבנות Workbook שלם לפני שאפשר לסנן לפי מתקן. בקובץ SAP גדול
  // זה עלול לצרוך מעל 1GB גם בתוך Worker. המסלול הבא פותח את קובץ ה-XLSX כ-ZIP,
  // קורא את XML הגיליון שורה-שורה, וממיר ל-JS רק שורות של המתקנים שמוצגים בסרגל.
  // כך קובץ המקור יכול להישאר גדול, בעוד שהמידע שנכנס לזיכרון/ענן קטן משמעותית.
  const QUALITY_LOWMEM_THRESHOLD_MB = 12;
  const QUALITY_LOWMEM_RESULT_BATCH = 5000;
  let _qualityLowMemWorkerUrl = null;

  const QUALITY_LOWMEM_HELPERS = [
    "function xmlDecode(s){ return String(s==null?'':s).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'\\\"').replace(/&apos;/g,\"'\").replace(/&amp;/g,'&').replace(/&#(x?[0-9A-Fa-f]+);/g,function(_,n){try{return String.fromCodePoint(n[0].toLowerCase()==='x'?parseInt(n.slice(1),16):parseInt(n,10));}catch(e){return _;}}); }",
    "function attrValue(attrs,name){ var m=new RegExp('(?:^|\\\\s)'+name+'=\\\"([^\\\"]*)\\\"').exec(attrs||''); return m?xmlDecode(m[1]):''; }",
    "function colIndex(ref){ var m=/^([A-Z]+)/i.exec(ref||''); if(!m) return -1; var n=0, t=m[1].toUpperCase(); for(var i=0;i<t.length;i++) n=n*26+(t.charCodeAt(i)-64); return n-1; }",
    "function textNodes(xml){ var out='', re=/<t(?:\\\\s[^>]*)?>([\\\\s\\\\S]*?)<\\\\/t>/g, m; while((m=re.exec(xml||''))) out+=xmlDecode(m[1]); return out; }",
    "function parseSharedStrings(u8){ if(!u8) return []; var xml=fflate.strFromU8(u8), out=[], re=/<si(?:\\\\s[^>]*)?>([\\\\s\\\\S]*?)<\\\\/si>/g, m; while((m=re.exec(xml))) out.push(textNodes(m[1])); return out; }",
    "function parseRow(rowXml, shared){ var row=[], re=/<c\\\\b([^>]*?)(?:\\\\/>|>([\\\\s\\\\S]*?)<\\\\/c>)/g, m; while((m=re.exec(rowXml||''))){ var attrs=m[1]||'', body=m[2]||'', ref=attrValue(attrs,'r'), c=colIndex(ref); if(c<0) continue; var t=attrValue(attrs,'t'), v=''; if(t==='inlineStr') v=textNodes(body); else { var vm=/<v>([\\\\s\\\\S]*?)<\\\\/v>/.exec(body); var raw=vm?xmlDecode(vm[1]):''; if(t==='s'){ var si=parseInt(raw,10); v=(isFinite(si)&&shared[si]!==undefined)?shared[si]:''; } else if(t==='b') v=raw==='1'; else if(t==='str') v=raw; else if(raw!=='' && /^[-+]?(?:\\\\d+\\\\.?\\\\d*|\\\\.\\\\d+)(?:[eE][-+]?\\\\d+)?$/.test(raw)) v=Number(raw); else v=raw; } row[c]=v; } return row; }",
    "function sheetNumber(name){ var m=/sheet(\\\\d+)\\\\.xml$/i.exec(name||''); return m?parseInt(m[1],10):999999; }"
  ].join("\n");

  const QUALITY_LOWMEM_WORKER_MAIN = [
    "self.onmessage = function(e){",
    "  var buf=e.data.buf, forcedMode=e.data.mode||'auto';",
    "  try{",
    "    self.postMessage({type:'progress',pct:0,message:'פותח קובץ גדול במסלול חסכוני'});",
    "    importScripts('https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js');",
    "    var zip=fflate.unzipSync(new Uint8Array(buf)); buf=null;",
    "    var shared=parseSharedStrings(zip['xl/sharedStrings.xml']);",
    "    if(zip['xl/sharedStrings.xml']) delete zip['xl/sharedStrings.xml'];",
    "    var names=Object.keys(zip).filter(function(k){return /^xl\\/worksheets\\/sheet\\d+\\.xml$/i.test(k);}).sort(function(a,b){return sheetNumber(a)-sheetNumber(b);});",
    "    var totalSheets=names.length||1, any=false;",
    "    for(var si=0;si<names.length;si++){",
    "      var name=names[si], xml=fflate.strFromU8(zip[name]); delete zip[name];",
    "      var rowRe=/<row\\b[^>]*>([\\s\\S]*?)<\\/row>/g, rm, header=null, kind='', scanned=0;",
    "      var resultBuf=[], summaryBuf=[];",
    "      while((rm=rowRe.exec(xml))){",
    "        var row=parseRow(rm[1],shared);",
    "        if(!header){",
    "          if(scanned++>=40) break;",
    "          var mm=mapQualityHeaders(row||[]);",
    "          var hasMeasure=(mm.measured_value!==undefined||mm.lower_limit!==undefined||mm.upper_limit!==undefined);",
    "          var isResult=mm.batch!==undefined&&(mm.test_name!==undefined||mm.operation_text!==undefined)&&hasMeasure;",
    "          var isSummary=mm.batch!==undefined&&mm.ud_code!==undefined&&!hasMeasure;",
    "          if((forcedMode==='results'&&isResult)||(forcedMode==='summary'&&isSummary)||(forcedMode==='auto'&&(isResult||isSummary))){ header=row; kind=isResult?'results':'summary'; continue; }",
    "          continue;",
    "        }",
    "        if(kind==='results') { var rr=mapQualityResultRows(header,[row]); if(rr.length) Array.prototype.push.apply(resultBuf,rr); }",
    "        else { var sr=processQualityRows(header,[row]); if(sr.length) Array.prototype.push.apply(summaryBuf,sr); }",
    "        if(resultBuf.length>=5000){ self.postMessage({type:'results',rows:resultBuf,pct:Math.min(99,Math.round((si+(rowRe.lastIndex/xml.length))/totalSheets*100))}); resultBuf=[]; any=true; }",
    "        if(summaryBuf.length>=5000){ self.postMessage({type:'summary',rows:summaryBuf}); summaryBuf=[]; any=true; }",
    "        if((scanned%5000)===0) self.postMessage({type:'progress',pct:Math.min(99,Math.round((si+(rowRe.lastIndex/xml.length))/totalSheets*100)),message:'מסנן רק מתקנים פעילים'});",
    "        scanned++;",
    "      }",
    "      if(resultBuf.length){ self.postMessage({type:'results',rows:resultBuf,pct:Math.min(99,Math.round((si+1)/totalSheets*100))}); any=true; }",
    "      if(summaryBuf.length){ self.postMessage({type:'summary',rows:summaryBuf}); any=true; }",
    "      xml=null;",
    "      if(header) break;",
    "    }",
    "    shared=null; zip=null;",
    "    self.postMessage({type:'done',lowMemory:true,any:any});",
    "  }catch(err){ self.postMessage({type:'error',message:String((err&&err.message)||err)}); }",
    "};"
  ].join("\n");

  function buildQualityLowMemWorkerUrl(){
    if(_qualityLowMemWorkerUrl) return _qualityLowMemWorkerUrl;
    const fns=[normalizeQualityHeader,mapQualityHeaders,normalizeBatch,isMissingTestValue,parseNumericResult,
               normalizeFacilityForLoad,isDisplayedFacilityForLoad,normalizeFacilityForQuality,dateObjToISO,
               excelSerialToISO,normalizeDateStr,mapQualityResultRows,processQualityRows];
    const src="var QUALITY_HEADER_MAP="+JSON.stringify(QUALITY_HEADER_MAP)+";\n"
      +"var OLD_TO_NEW_FACILITY="+JSON.stringify(OLD_TO_NEW_FACILITY)+";\n"
      +"var FACILITY_OPTIONS="+JSON.stringify(FACILITY_OPTIONS)+";\n"
      +fns.map(f=>f.toString()).join("\n\n")+"\n\n"
      +QUALITY_LOWMEM_HELPERS+"\n\n"+QUALITY_LOWMEM_WORKER_MAIN;
    _qualityLowMemWorkerUrl=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));
    return _qualityLowMemWorkerUrl;
  }

  function parseQualityFileLowMemoryWorker(file,onProgress,forcedMode){
    return new Promise(function(resolve,reject){
      var worker;
      try{ worker=new Worker(buildQualityLowMemWorkerUrl()); }
      catch(e){ reject(Object.assign(new Error('LOWMEM_WORKER_UNAVAILABLE'),{code:'LOWMEM_WORKER_UNAVAILABLE'})); return; }
      var summaryRows=[],resultRows=[];
      var finish=function(fn,payload){ try{worker.terminate();}catch(e){} fn(payload); };
      worker.onmessage=function(ev){
        var d=ev.data||{};
        if(d.type==='progress'){ onProgress&&onProgress(d); return; }
        if(d.type==='summary'){ if(d.rows&&d.rows.length) appendAll(summaryRows,d.rows); return; }
        if(d.type==='results'){ if(d.rows&&d.rows.length) appendAll(resultRows,d.rows); onProgress&&onProgress({pct:d.pct,message:'סינון מתקנים: '+resultRows.length.toLocaleString('he-IL')+' שורות רלוונטיות'}); return; }
        if(d.type==='done') return finish(resolve,{summaryRows,resultRows,lowMemory:true});
        if(d.type==='error') return finish(reject,new Error(d.message||'שגיאת פענוח חסכוני'));
      };
      worker.onerror=function(ev){ finish(reject,Object.assign(new Error(ev&&ev.message||'LOWMEM_WORKER_CRASHED'),{code:'LOWMEM_WORKER_CRASHED'})); };
      file.arrayBuffer().then(function(buf){ worker.postMessage({buf:buf,mode:forcedMode||'auto'},[buf]); },function(err){ finish(reject,err); });
    });
  }

  function setQualityLoadProgress(text){
    const el = root && root.querySelector ? root.querySelector('#dataStatusLine') : null;
    if(!el) return;
    if(text){ el.dataset.busy='1'; el.textContent = '⏳ ' + text; }
    else if(el.dataset.busy){ delete el.dataset.busy; renderAll(); }
  }

  async function handleQualityFiles(fileList, forcedMode){
    try{
      const files=Array.from(fileList||[]);
      // הוסרה מגבלת שני קבצים: ייצוא איכות גדול מ-SAP חייב להיות מפוצל
      // (הדפדפן לא מסוגל לפענח 280K שורות בקובץ אחד), ואז יש 9-12 חלקים.
      if(files.length<1){
        showToast('יש לבחור לפחות קובץ Excel אחד',true);
        return;
      }
      if(files.length>20){
        showToast('יותר מדי קבצים בבת אחת — בחרו עד 20',true);
        return;
      }
      if(typeof XLSX==='undefined'){ showToast('ספריית Excel לא נטענה — רעננו את הדף ונסו שוב',true); return; }
      showToast(files.length===1?'קורא ומזהה את קובץ האיכות...':'קורא ומזהה את שני קובצי האיכות...');

      let summaryRows=[], resultRows=[], sourceNames=[], failedFiles=[];
      let unresolvedFacilityRows=0, unresolvedFacilitySamples=[];
      for(const file of files){
        const sizeMB = (file.size||0)/1048576;
        let foundSummary=[], foundResults=[];
        let parsedInWorker=false, workerError='';
        if(typeof Worker!=='undefined'){
          try{
            // V4.8.39 — חזרה למסלול היציב שעבד לפני שינוי מנגנון הקבצים הגדולים.
            // הפענוח רץ ב-Worker עם dense:true, ובמהלך מיפוי השורות נשמרות
            // רק התחנות שמופיעות בסרגל המתקנים.
            showToast('מפענח את '+file.name+' ברקע...');
            const out = await parseQualityFileInWorker(file, p=>{
              const pct = (p && typeof p.pct==='number') ? ' '+p.pct+'%' : '';
              setQualityLoadProgress(file.name+pct+(p&&p.message?' · '+p.message:''));
            }, forcedMode||'auto');
            foundSummary = out.summaryRows || [];
            foundResults = out.resultRows || [];
            parsedInWorker = true;
          }catch(err){
            workerError = (err && err.message) || String(err);
            console.warn('worker parse failed, falling back to main thread:', err);
            // חשוב: גם בקובץ גדול מנסים את המסלול הראשי. זה בדיוק המנגנון
            // שעבד בגרסה הקודמת עם dense:true, ולכן אין חסימת גודל מלאכותית.
            setQualityLoadProgress(file.name+' · מעבר לפענוח חלופי בחלון הראשי');
            await new Promise(r=>setTimeout(r,50));
          }
        }
        setQualityLoadProgress('');
        if(!parsedInWorker){
          const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:false,dense:true});
          // Classify the file first (cheap header probe) and run ONLY the relevant parser.
          const cls=classifyQualityWorkbook(wb);
          const mode=forcedMode||'auto';
          const runSummary = mode==='summary' || (mode==='auto' && (cls.hasSummary || (!cls.hasSummary && !cls.hasResults)));
          const runResults = mode==='results' || (mode==='auto' && (cls.hasResults || (!cls.hasSummary && !cls.hasResults)));
          foundSummary=runSummary ? processQualitySummaryWorkbook(wb) : [];
          foundResults=runResults ? processQualityResultsWorkbook(wb) : [];
        }
        // V4.8.39: קובץ האיכות יכול להגיע ללא עמודת מתקן. קודם משייכים
        // לפי נתוני הכמות הקיימים ורק לאחר מכן מסננים למתקנים שבסרגל.
        foundSummary = filterQualityRowsToDisplayedFacilities(foundSummary);
        foundResults = filterQualityRowsToDisplayedFacilities(foundResults);
        [foundSummary,foundResults].forEach(filtered=>{
          const stats=filtered&&filtered.facilityFilterStats;
          if(!stats) return;
          unresolvedFacilityRows+=stats.unresolved||0;
          (stats.unresolvedSamples||[]).forEach(sample=>{
            if(unresolvedFacilitySamples.length<8 && !unresolvedFacilitySamples.some(x=>x.batch===sample.batch&&x.workOrder===sample.workOrder)) unresolvedFacilitySamples.push(sample);
          });
        });
        appendAll(summaryRows, foundSummary);
        appendAll(resultRows, foundResults);
        // רישום לכל קובץ בנפרד, כדי שבטעינת חלקים מרובים יופיע שם כל חלק
        // עם מספר השורות שלו והשעה שבה נטען.
        if(foundSummary.length) recordDatasetSource('qualitySummary', file.name, foundSummary.length);
        if(foundResults.length) recordDatasetSource('qualityResults', file.name, foundResults.length);
        // קובץ שלא תרם ולו שורה אחת נרשם ככישלון. קודם, בחירה של שני קבצים
        // שבה רק אחד נקרא בהצלחה הציגה הודעת הצלחה והשני נבלע בשקט — בדיוק
        // מה שקרה כשקובץ התוצאות הגדול נפל וקובץ החלטת השימוש עבר.
        if(!foundSummary.length && !foundResults.length){
          failedFiles.push({ name:file.name, sizeMB: Math.round((file.size||0)/1048576), why: workerError });
          recordDatasetSource('failed', file.name, 0);
          console.error('quality file produced no rows:', file.name, 'worker error:', workerError || '(none)');
        }
        sourceNames.push(file.name);
      }

      if(!summaryRows.length && !resultRows.length){
        // הודעת "לא זוהה" נכונה רק אם הכותרות באמת לא מוכרות. כשקובץ ענק
        // מפיל את הפענוח מחוסר זיכרון הגענו לכאן גם כן, וההודעה שלחה לכיוון
        // הלא נכון. מפרידים בין השניים.
        throw new Error(forcedMode==='summary' ? 'לא נמצאו נתוני החלטת שימוש השייכים למתקנים שבסרגל' : forcedMode==='results' ? 'לא נמצאו תוצאות בדיקות איכות השייכות למתקנים שבסרגל' : 'הקובץ לא זוהה או שלא נמצא קישור לנתוני הכמות של המתקנים שבסרגל');
      }

      // Remove accidental duplicates when the same sheet/data was included twice.
      if(summaryRows.length){
        const summarySeen=new Set();
        summaryRows=summaryRows.filter(r=>{
          const k=[normalizeBatch(r.batch),String(r.inspectionLot||''),String(r.udCode||''),String(r.workOrder||'')].join('|');
          if(summarySeen.has(k)) return false; summarySeen.add(k); return true;
        });
      }
      if(resultRows.length){
        const resultSeen=new Set();
        resultRows=resultRows.filter(r=>{
          const k=[normalizeBatch(r.batch),String(r.inspectionLot||''),String(r.testCode||r.testName||''),String(r.result||'')].join('|');
          if(resultSeen.has(k)) return false; resultSeen.add(k); return true;
        });
      }

      // Sequential loading is intentionally supported:
      // first load the summary file, then load the detailed results file.
      let okSummary=true, okResults=true;
      // צבירה במקום דריסה. קודם כל טעינה החליפה את qualityTestResults במלואו,
      // כך שטעינת קובץ מפוצל בחלקים השאירה רק את החלק האחרון. עכשיו כל חלק
      // מתווסף לקודמים, עם סינון כפילויות מול מה שכבר קיים.
      if(summaryRows.length){
        const seen=new Set();
        const mergedSummary=appendAll(appendAll([], qualityEntries||[]), summaryRows);
        qualityEntries=mergedSummary.filter(r=>{
          const k=[normalizeBatch(r.batch),String(r.inspectionLot||''),String(r.udCode||''),String(r.workOrder||'')].join('|');
          if(seen.has(k)) return false; seen.add(k); return true;
        });
        buildQualitySummary();
        okSummary=await persistQuality();
      }
      if(resultRows.length){
        const seen=new Set();
        const mergedResults=appendAll(appendAll([], qualityTestResults||[]), resultRows);
        qualityTestResults=mergedResults.filter(r=>{
          const k=[normalizeBatch(r.batch),String(r.inspectionLot||''),String(r.sample||''),
                   String(r.testCode||r.testName||''),String(r.result||'')].join('|');
          if(seen.has(k)) return false; seen.add(k); return true;
        });
        rebuildQualityTestIndex();
        okResults=await persistQualityTestResults();
      }

      if(!(okSummary&&okResults)) return false;

      await persistDatasetSources();
      await recordSharedLastLoad(forcedMode==='summary'?'usageDecision':'quality',sourceNames,summaryRows.length+resultRows.length);
      renderAll();

      // אזהרה על קבצים שלא תרמו כלום, גם כשקבצים אחרים באותה בחירה הצליחו.
      if(failedFiles.length){
        const big = failedFiles.filter(f => f.sizeMB >= 15);
        const names = failedFiles.map(f => f.name + (f.sizeMB ? ' ('+f.sizeMB+'MB)' : '') + (f.why ? ' — ' + f.why : '')).join(', ');
        showToast(failedFiles.length + ' מתוך ' + files.length + ' הקבצים לא נטענו: ' + names +
          (big.length ? ' — הפענוח החסכוני לא הצליח בקובץ זה.' : ' — הכותרות לא זוהו.'), true);
      }
      const unresolvedNote=unresolvedFacilityRows
        ? ' · '+unresolvedFacilityRows+' שורות ללא שיוך מתקן (דוגמאות מנה: '+unresolvedFacilitySamples.map(x=>x.batch).join(', ')+')'
        : '';
      if(summaryRows.length && resultRows.length){
        showToast('האיכות נטענה: '+summaryRows.length+' מנות · '+resultRows.length+' תוצאות בדיקה | '+sourceNames.join(' + ')+unresolvedNote,!!unresolvedFacilityRows);
      }else if(summaryRows.length){
        showToast('קובץ סיכום האיכות נטען: '+summaryRows.length+' מנות. כעת ניתן לטעון את קובץ תוצאות הבדיקה החדש.'+unresolvedNote,!!unresolvedFacilityRows);
      }else{
        const linked=Object.keys(qualityBestByKey||{}).length;
        showToast('קובץ תוצאות הבדיקה נטען: '+resultRows.length+' תוצאות בדיקה'+(linked?' · קושר למנות סיכום האיכות':' · יש לטעון גם את קובץ סיכום האיכות')+unresolvedNote,!!unresolvedFacilityRows);
      }
      return true;
    }catch(e){ console.error(e); showToast('שגיאה בטעינת/שמירת האיכות: '+(e.message||e),true); return false; }
  }

  // Module-scope helper — shared by the results parser and the results modal.
  // (Previously defined only inside processQualityResultsWorkbook, which caused a
  //  ReferenceError "badStatus is not defined" when opening the results modal.)
  function badStatus(v){
    const t=String(v==null?'':v).trim().toUpperCase();
    if(!t) return false;
    return t.includes('REJECT') || t.includes('FAIL') || t.includes('NOT SUCCESS') || t.includes('OUT') || t.includes('חריג') || t.includes('פסול');
  }

  function normalizeQualityHeader(h){
    return String(h == null ? '' : h)
      .replace(/^\uFEFF/, '')
      .replace(/\s+/g, ' ')
      .trim()
      .toLowerCase();
  }

  function mapQualityHeaders(headerRow){
    const map = {};
    headerRow.forEach((h,i)=>{
      const raw = String(h == null ? '' : h).replace(/^\uFEFF/, '').replace(/\s+/g, ' ').trim();
      const normalized = normalizeQualityHeader(raw);
      const k = QUALITY_HEADER_MAP[raw] || QUALITY_HEADER_MAP[normalized];
      if(k && map[k] === undefined) map[k] = i;
    });
    return map;
  }

  function findQualityHeaderRow(grid){
    const maxScan = Math.min(grid.length, 40);
    let best = null;
    for(let r=0; r<maxScan; r++){
      const row = Array.isArray(grid[r]) ? grid[r] : [];
      const map = mapQualityHeaders(row);
      const score = Object.keys(map).length;
      const hasBatch = map.batch !== undefined;
      const hasUD = map.ud_code !== undefined || map.qa_approval !== undefined || map.result_status !== undefined;
      if(!best || score > best.score) best = { index:r, map, score, hasBatch, hasUD };
      if(score >= 3 && hasBatch && hasUD) return { index:r, map, score };
    }
    return best && best.score >= 2 ? best : null;
  }

  function processQualityRows(headerRow, dataRows){
    const map = mapQualityHeaders(headerRow);
    const getStr = (cols, idx, def) => {
      if(idx===undefined) return def||'';
      const v = cols[idx];
      if(v===undefined||v===null) return def||'';
      const s=(''+v).trim();
      return s || (def||'');
    };
    const getDateVal = (cols, idx) => {
      if(idx===undefined) return 0;
      const v = cols[idx];
      if(!v) return 0;
      if(v instanceof Date) return v.getTime();
      if(typeof v === 'number') return v; // Excel serial
      const t = Date.parse(String(v));
      return isNaN(t) ? 0 : t;
    };
    const rows = [];
    dataRows.forEach(cols=>{
      if(!cols || cols.length===0) return;
      let rawDate = map.date!==undefined ? cols[map.date] : '';
      let date = '';
      if(rawDate instanceof Date) date = dateObjToISO(rawDate);
      else if(typeof rawDate === 'number') date = excelSerialToISO(rawDate);
      else if(rawDate !== undefined && rawDate !== null && rawDate !== '') date = normalizeDateStr(String(rawDate)) || String(rawDate).trim();
      const udDate = getDateVal(cols, map.ud_date);
      // Store only essential fields — reduces memory from ~67MB to ~5MB
      const batch = getStr(cols,map.batch,'').replace(/^0+/,'');
      const udCode = getStr(cols,map.ud_code,'');
      if(!udCode && !batch) return;
      const facility = normalizeFacilityForQuality(getStr(cols,map.facility,''));
      // V4.8.34: החלטת שימוש נשמרת רק למתקנים שמוצגים בסרגל המתקנים.
      if(facility && !isDisplayedFacilityForLoad(facility)) return;
      const q = {
        batch,
        materialCode: (getStr(cols,map.material_code,'') || getStr(cols,map.central_item,'')).replace(/\.0$/,''),
        materialName: getStr(cols,map.material_name,'') || getStr(cols,map.central_item_description,''),
        udCode,
        udDate,
        qaApproval: getStr(cols,map.qa_approval,''),
        facility,
        inspectionLot: getStr(cols,map.inspection_lot,''),
        orderType: getStr(cols,map.order_type,''),
        workOrder: getStr(cols,map.work_order,''),
        deliveredQuantity: getStr(cols,map.delivered_quantity,''),
        line: getStr(cols,map.line,''),
        remarks: getStr(cols,map.remarks,''),
        rejectedCharacteristics: getStr(cols,map.rejected_characteristics,''),
        approvedCharacteristics: getStr(cols,map.approved_characteristics,''),
        date
      };
      rows.push(q);
    });
    return rows;
  }

  async function handleQualityFile(file){
    try{
      const name = file.name.toLowerCase();
      let headerRow, dataRows;
      if(name.endsWith('.xlsx') || name.endsWith('.xls')){
        if(typeof XLSX === 'undefined'){ showToast('ספריית Excel לא נטענה — ודאו שיש חיבור אינטרנט ורעננו את הדף (Ctrl+R / Cmd+R).', true); return; }
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, {type:'array', cellDates:false});
        let selected = null;
        for(const sheetName of wb.SheetNames){
          const sheet = wb.Sheets[sheetName];
          const grid = XLSX.utils.sheet_to_json(sheet, {header:1, defval:'', raw:true, blankrows:false});
          const found = findQualityHeaderRow(grid);
          if(found && (!selected || found.score > selected.found.score)){
            selected = { sheetName, grid, found };
          }
          if(found && found.score >= 3 && found.map.batch !== undefined && found.map.ud_code !== undefined) break;
        }
        if(!selected || selected.grid.length < selected.found.index + 2){
          showToast('לא נמצאה שורת כותרות מתאימה בקובץ האיכות', true);
          return;
        }
        headerRow = selected.grid[selected.found.index];
        dataRows = selected.grid.slice(selected.found.index + 1);
        console.log('Quality import sheet:', selected.sheetName, 'header row:', selected.found.index + 1, 'mapped:', selected.found.map);
      } else {
        const text = await file.text();
        const lines = text.split(/\r?\n/).filter(l=>l.trim().length>0);
        if(lines.length<2){ showToast('קובץ האיכות לא מכיל שורות נתונים', true); return; }
        const cleanFirst = lines[0].replace(/^\uFEFF/,'');
        const delim = detectDelimiter(cleanFirst);
        headerRow = splitCSVLine(cleanFirst, delim);
        dataRows = lines.slice(1).map(l=>splitCSVLine(l, delim));
      }
      const rows = processQualityRows(headerRow, dataRows);
      showToast('נמצאו '+rows.length+' שורות בקובץ האיכות');
      if(rows.length===0){
        const mapped = mapQualityHeaders(headerRow);
        const foundNames = Object.keys(mapped).join(', ') || 'ללא התאמות';
        console.warn('Quality headers:', headerRow, 'mapped:', mapped);
        showToast('לא נמצאו רשומות איכות. זוהו עמודות: '+foundNames, true);
        return;
      }
      qualityEntries = rows;
      buildQualitySummary();
      const ok = await persistQuality();
      if(ok){
        console.log('Quality import sample:', rows.slice(0,3));
        renderAll();
      }
    } catch(e){
      console.error(e);
      showToast('שגיאה בקריאת קובץ האיכות', true);
    }
  }

    return rows.filter(ev=>{

      if(facs && ev.facility && !facs.has(ev.facility)) return false;
      return true;
    }).sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  function severityClass(v){
    const x=String(v||'').trim();
    if(x.includes('קריט'))return 'critical';
    if(x.includes('גבוה'))return 'high';
    if(x.includes('בינ'))return 'medium';
    return 'low';
  }

  async function saveEventFromModal(){
    const saveBtn = root.querySelector('#eventSave');
    const date = root.querySelector('#ev_date').value;
    const types=['quality','environment','safety'].filter(t=>{const el=root.querySelector('#ev_type_'+t);return el&&el.checked;});
    const desc = root.querySelector('#ev_desc').value.trim();
    if(!date || !types.length || !desc){ showToast('חובה לבחור סוג אירוע ולהזין תאריך ותיאור', true); return; }

    const baseEvent = {
      date,
      facility: root.querySelector('#ev_facility').value,
      area: root.querySelector('#ev_area').value.trim(),
      workOrder: root.querySelector('#ev_workorder').value.trim(),
      batch: root.querySelector('#ev_batch').value.trim(),
      severity: root.querySelector('#ev_severity').value,
      description: desc,
      action: root.querySelector('#ev_action').value.trim(),
      source: 'manual',
      createdAt: Date.now()
    };

    if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'שומר...'; }
    try {
      for(const type of types){
        const eventData={...baseEvent,id:genId(),type};
        const result = await _dashStorage.appendEvent(STORAGE_KEY_EVENTS, eventData);
        const savedEvent = result && result.event ? result.event : eventData;
        if(!eventsEntries.some(ev=>ev.id === savedEvent.id)) eventsEntries.push(savedEvent);
      }
      root.querySelector('#eventOverlay').classList.remove('open');
      showToast(types.length===1?'האירוע נשמר':types.length+' אירועים נשמרו');
      renderAll();
    } catch(e){
      console.error('Event save failed:', e);
      showToast('שגיאה בשמירת אירוע', true);
    } finally {
      if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = 'שמירה'; }
    }
  }

  function currentQualityDateRange(){
    if(tab === 'day'){
      const day = effectiveDay();
      return { start:day, end:day, label:day };
    }
    if(tab === 'period'){
      const r = effectivePeriod();
      return { start:r.start, end:r.end, label:r.start+' – '+r.end };
    }
    if(tab === 'month'){
      const ym = effectiveMonth();
      const parts = ym.split('-').map(Number);
      const start = toISO(new Date(parts[0], parts[1]-1, 1));
      const end = toISO(new Date(parts[0], parts[1], 0));
      return { start, end, label:ym };
    }
    if(tab === 'quarter'){
      const y = effectiveQYear(), q = effectiveQQuarter();
      const sm = (q-1)*3;
      const start = toISO(new Date(y, sm, 1));
      const end = toISO(new Date(y, sm+3, 0));
      return { start, end, label:'רבעון '+q+' '+y };
    }
    const y = effectiveYear();
    return { start:y+'-01-01', end:y+'-12-31', label:String(y) };
  }

  function filteredQualityBatchesForView(){
    const range = currentQualityDateRange();
    const facFilter = selectedFacilities === null ? null : new Set(Array.from(selectedFacilities).map(normalizeFacilityForQuality));
    const prodByBatch = new Map();
    entries.forEach(e=>{
      const bk = String(e.batch||'').replace(/^0+/,'').trim();
      if(!bk) return;
      const current = prodByBatch.get(bk);
      if(!current || String(e.date||'') > String(current.date||'')) prodByBatch.set(bk, e);
    });
    const best = new Map();
    (qualityEntries||[]).forEach(q0=>{
      const bk = String(q0.batch||'').replace(/^0+/,'').trim();
      const prod = bk ? (prodByBatch.get(bk)||{}) : {};
      const date = String(q0.date || prod.date || '').slice(0,10);
      if(!date || date < range.start || date > range.end) return;
      const facility = normalizeFacilityForQuality(q0.facility || prod.facility || '');
      if(facFilter && (!facility || !facFilter.has(facility))) return;
      const orderType = q0.orderType || prod.orderType || '';
      if(facility === '1542' && !String(orderType).toUpperCase().includes('ZFIN')) return;
      const q = Object.assign({}, q0, {
        date, facility,
        materialCode:q0.materialCode || prod.materialCode || '',
        materialName:q0.materialName || prod.materialName || '',
        workOrder:q0.workOrder || prod.workOrder || '',
        orderType
      });
      const key = bk || String(q.inspectionLot||'').trim() || [date,q.workOrder,q.udCode].join('|');
      if(!key) return;
      const old = best.get(key);
      const qSort = Number(q.udDate||0) || Date.parse(date) || 0;
      const oldSort = old ? (Number(old.udDate||0) || Date.parse(old.date||'') || 0) : -1;
      if(!old || qSort >= oldSort) best.set(key, q);
    });
    return { rows:Array.from(best.values()), range, facFilter };
  }

  /* ---------------- state ---------------- */
  let entries = [];
  let qualityEntries = [];
  let qualitySummary = {};
  let qualityBestByKey = {}; // cache: batch -> best quality row (latest udDate)
  let qualityBestByMatBatch = {}; // cache: "materialCode|batch" -> best quality row (מק"ט + מנה)
  let loaded = false;
  let tab = 'day';
  const filters = {
    day: deviceYesterdayISO(), // V4.8.33: every new app entry opens on yesterday according to the displaying device
    periodStart: null, periodEnd: null,
    month: null,          // 'YYYY-MM'
    qYear: null, qQuarter: null,
    year: null
  };

  const FACILITY_OPTIONS = ['1540','1541','1542','1543','1519','1525','1528','1524','1523','1521'];
  const OLD_TO_NEW_FACILITY = { '42':'1542', '43':'1543', '28':'1528', '24':'1524', '23':'1523', '41':'1541', '25':'1525' };
  // V4.8.34 — מקור אמת יחיד למתקנים שמותר להכניס למאגר.
  // כל טעינות כמות / איכות / החלטת שימוש נשמרות רק אם המתקן מופיע בסרגל המתקנים.
  function normalizeFacilityForLoad(value){
    let s = String(value == null ? '' : value).trim().replace(/\.0+$/, '');
    s = OLD_TO_NEW_FACILITY[s] || s;
    return s;
  }
  function isDisplayedFacilityForLoad(value){
    return FACILITY_OPTIONS.includes(normalizeFacilityForLoad(value));
  }
  // V4.8.39 — בקובצי איכות/החלטת שימוש עמודת המתקן אינה תמיד קיימת.
  // במקרה כזה משייכים את השורה למתקן לפי נתוני הכמות שכבר נטענו (מק"ט+מנה,
  // פקודת עבודה+מנה, ולבסוף מנה כאשר היא חד-משמעית), ורק אז מסננים לסרגל.
  function buildQualityFacilityLookup(){
    const byMatBatch=new Map(), byWoBatch=new Map(), byBatch=new Map();
    const ambiguous=new Set();
    (entries||[]).forEach(e=>{
      const fac=normalizeFacilityForLoad(e.facility);
      if(!isDisplayedFacilityForLoad(fac)) return;
      const batch=normalizeBatch(e.batch);
      if(!batch) return;
      const mat=String(e.materialCode||'').replace(/\.0$/,'').trim();
      const wo=String(e.workOrder||'').trim();
      if(mat) byMatBatch.set(mat+'|'+batch,fac);
      if(wo) byWoBatch.set(wo+'|'+batch,fac);
      if(!byBatch.has(batch)) byBatch.set(batch,fac);
      else if(byBatch.get(batch)!==fac) ambiguous.add(batch);
    });
    ambiguous.forEach(k=>byBatch.delete(k));
    return {byMatBatch,byWoBatch,byBatch};
  }
  function resolveQualityFacility(row, lookup){
    let fac=normalizeFacilityForLoad(row&&row.facility);
    if(isDisplayedFacilityForLoad(fac)) return fac;
    const batch=normalizeBatch(row&&row.batch);
    if(!batch) return '';
    const mat=String((row&&row.materialCode)||'').replace(/\.0$/,'').trim();
    const wo=String((row&&(row.workOrder||row.operation))||'').trim();
    if(mat && lookup.byMatBatch.has(mat+'|'+batch)) return lookup.byMatBatch.get(mat+'|'+batch);
    if(wo && lookup.byWoBatch.has(wo+'|'+batch)) return lookup.byWoBatch.get(wo+'|'+batch);
    return lookup.byBatch.get(batch)||'';
  }
  function filterQualityRowsToDisplayedFacilities(rows){
    const lookup=buildQualityFacilityLookup();
    let inferred=0, direct=0, dropped=0, unresolved=0;
    const unresolvedSamples=[];
    const out=[];
    (rows||[]).forEach(r=>{
      const original=normalizeFacilityForLoad(r&&r.facility);
      const fac=resolveQualityFacility(r,lookup);
      if(!isDisplayedFacilityForLoad(fac)){
        // אם לקובץ האיכות אין עמודת מתקן ולא נמצא קישור לנתוני הכמות,
        // שומרים את השורה כלא-משויכת. מתקן מפורש שאינו בסרגל עדיין נפסל.
        if(!original){
          unresolved++;
          r.facility='';
          if(unresolvedSamples.length<8){
            unresolvedSamples.push({
              batch:normalizeBatch(r&&r.batch)||'—',
              workOrder:String((r&&(r.workOrder||r.operation))||'').trim()||'—',
              materialCode:String((r&&r.materialCode)||'').replace(/\.0$/,'').trim()||'—'
            });
          }
          out.push(r);
          return;
        }
        dropped++;
        return;
      }
      if(original===fac) direct++; else inferred++;
      r.facility=fac; out.push(r);
    });
    out.facilityFilterStats={input:(rows||[]).length,kept:out.length,direct,inferred,dropped,unresolved,unresolvedSamples};
    console.log('quality facility filter:',out.facilityFilterStats);
    return out;
  }
  const PLANTS = ['XX15'];
  const FACILITY_TO_PLANT = { '1540':'XX15', '1541':'XX15', '1542':'XX15', '1543':'XX15', '1519':'XX15', '1525':'XX15', '1528':'XX15', '1524':'XX15', '1523':'XX15', '1521':'XX15' };
  function getPlant(facility){ return FACILITY_TO_PLANT[facility] || PLANTS[0] || ''; }
  const SHIFTS = ['בוקר','ערב','לילה'];
  const PACKAGING_TYPES = ['קו אריזה 1 ליטר','קו אריזה 5 ליטר','קו אריזה 10/20 ליטר'];
  const DAILY_TARGET_DEFAULTS = { 'קו אריזה 1 ליטר': 18000, 'קו אריזה 5 ליטר': 60000, 'קו אריזה 10/20 ליטר': 60000 };
  const OLD_TO_NEW_PACKAGING_TYPE = { 'קו אריזה 10 ליטר': 'קו אריזה 10/20 ליטר', 'קו אריזה 20 ליטר': 'קו אריזה 10/20 ליטר' };
  const GENERAL_KEY = '__general__';
  const PACKAGING_ONLY_FACILITIES = ['1542','1543','1519'];
  const PRODUCTION_FACILITIES = FACILITY_OPTIONS.filter(f=>!PACKAGING_ONLY_FACILITIES.includes(f));
  // ערכי ברירת מחדל ראשוניים בלבד — לאחר השמירה הראשונה דרך כפתור "יעדי ייצור" / "יעדי אריזה",
  // הערכים שהוזנו על ידי המשתמש הם אלו שקובעים את היעד (גם במחוונים), עד לשינוי הבא.
  const PRODUCTION_TARGET_DAILY_DEFAULTS = { '1528': 80000, '1523': 40000, '1524': 6000, '1540': 18000, '1541': 7000, '1525': 4333 };
  const FACILITY_PACKAGING_DAILY_DEFAULTS = {
    '1542': { 'קו אריזה 1 ליטר': 18000, 'קו אריזה 5 ליטר': 60000, 'קו אריזה 10/20 ליטר': 60000 }
  };
  const FACILITY_PACKAGING_FLAT_DAILY_DEFAULTS = { '1543': 80000 };

  function buildShiftMatrix(dailyTotal){
    const m = {};
    SHIFTS.forEach(s=>{ m[s] = dailyTotal / SHIFTS.length; });
    return m;
  }
  function defaultPackagingTargets(){
    const t = {};
    t[GENERAL_KEY] = {};
    PACKAGING_TYPES.forEach(p=>{ t[GENERAL_KEY][p] = buildShiftMatrix(DAILY_TARGET_DEFAULTS[p]); });
    Object.keys(FACILITY_PACKAGING_DAILY_DEFAULTS).forEach(fac=>{
      t[fac] = {};
      PACKAGING_TYPES.forEach(p=>{ t[fac][p] = buildShiftMatrix(FACILITY_PACKAGING_DAILY_DEFAULTS[fac][p]); });
    });
    Object.keys(FACILITY_PACKAGING_FLAT_DAILY_DEFAULTS).forEach(fac=>{
      const cell = FACILITY_PACKAGING_FLAT_DAILY_DEFAULTS[fac] / (PACKAGING_TYPES.length * SHIFTS.length);
      t[fac] = {};
      PACKAGING_TYPES.forEach(p=>{ t[fac][p] = buildShiftMatrix(cell * SHIFTS.length); });
    });
    return t;
  }
  function defaultProductionTargets(){
    const t = {};
    Object.keys(PRODUCTION_TARGET_DAILY_DEFAULTS).forEach(fac=>{ t[fac] = buildShiftMatrix(PRODUCTION_TARGET_DAILY_DEFAULTS[fac]); });
    return t;
  }
  let packagingTargets = defaultPackagingTargets();
  let productionTargets = defaultProductionTargets();

  // יעד יומי כולל למתקן ייצור — סכום היעדים שהוזנו לכל המשמרות (דרך כפתור "יעדי ייצור").
  // זהו המקור היחיד לחישוב מחוון היעד של מתקן ייצור: שינוי בכפתור משתקף אוטומטית במחוון.
  function dailyProductionTargetForFacility(facility){
    const m = productionTargets[facility];
    if(!m) return 0;
    let sum = 0;
    SHIFTS.forEach(s=>{ sum += Number(m[s] || 0); });
    return sum;
  }
  // יעד יומי כולל למתקן אריזה — סכום היעדים שהוזנו לכל סוגי האריזה ולכל המשמרות
  // (דרך כפתור "יעדי אריזה", עם התאמה אישית למתקן אם קיימת, אחרת ברירת המחדל הכללית).
  function dailyPackagingTargetForFacility(facility){
    const matrix = (facility && packagingTargets[facility]) ? packagingTargets[facility] : packagingTargets[GENERAL_KEY];
    if(!matrix) return 0;
    let sum = 0;
    PACKAGING_TYPES.forEach(p=>{
      SHIFTS.forEach(s=>{ sum += Number((matrix[p] && matrix[p][s]) || 0); });
    });
    return sum;
  }
  // יעד יומי לסוג אריזה בודד, ספציפי למתקן (לכל המשמרות יחד) — לפי כפתור "יעדי אריזה" של המתקן.
  function facilityPackagingDailyTargetForType(facility, type){
    const matrix = (facility && packagingTargets[facility]) ? packagingTargets[facility] : packagingTargets[GENERAL_KEY];
    if(!matrix || !matrix[type]) return 0;
    let sum = 0;
    SHIFTS.forEach(s=>{ sum += Number(matrix[type][s] || 0); });
    return sum;
  }
  let periodPackagingTargets = {}; // יעדי אריזה ידניים לפי תצוגה/טווח/מתקן
  function getPackagingTarget(e){
    if(e.targetPackaging && e.targetPackaging>0) return e.targetPackaging;
    if(!e.packagingType || !e.shift) return 0;
    const facMatrix = (e.facility && packagingTargets[e.facility]) ? packagingTargets[e.facility] : packagingTargets[GENERAL_KEY];
    if(facMatrix && facMatrix[e.packagingType] && facMatrix[e.packagingType][e.shift]!=null) return facMatrix[e.packagingType][e.shift];
    const gen = packagingTargets[GENERAL_KEY];
    if(gen && gen[e.packagingType] && gen[e.packagingType][e.shift]!=null) return gen[e.packagingType][e.shift];
    return 0;
  }
  function getProductionTarget(e){
    if(e.targetProduction && e.targetProduction>0) return e.targetProduction;
    if(!e.facility || !e.shift) return 0;
    if(productionTargets[e.facility] && productionTargets[e.facility][e.shift]!=null) return productionTargets[e.facility][e.shift];
    return 0;

  function deliveredAmount(e){

  function orderShortfall(e){
    if(!e.orderQuantity || e.orderQuantity<=0) return 0;
    const d = deliveredAmount(e);
    const gap = e.orderQuantity - d;
    return gap>0 ? gap : 0;
  }
  function pendingPackagingQty(e){
    if(!e.confirmedYield || e.confirmedYield<=0) return 0;
    const d = deliveredAmount(e);
    const gap = e.confirmedYield - d;

  function isOrderClosed(e){

  }
  let selectedFacilities = new Set(FACILITY_OPTIONS); // default: only 15xx facilities

  function allFacilities(){

  // סינון חומרים דינמי: null = כל החומרים. הרשימה המוצעת נגזרת מהמתקנים
  // שנבחרו, כך שהיא מצטמצמת יחד איתם ולא מציעה חומרים שאינם רלוונטיים.
  let selectedMaterials = null;

  // שם השדה כאן הוא materialName (ראו processRows), לא desc.

  function materialLabel(e){

  function availableMaterials(){

  function facilityFilteredEntries(){

  function toggleFacility(fac){
