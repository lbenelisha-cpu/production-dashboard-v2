<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IML Quality Fix Updater</title>
<style>
body{font-family:Arial,sans-serif;background:#0b1220;color:#fff;max-width:760px;margin:40px auto;padding:20px}
.card{background:#111827;border:1px solid #334155;border-radius:16px;padding:24px}
h1{font-size:24px;margin-top:0}.ok{color:#34d399}.err{color:#f87171}
button,label{display:inline-block;background:#14b8a6;color:#031513;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}
input{display:none}#status{margin-top:18px;white-space:pre-wrap;line-height:1.6}
small{color:#94a3b8}
</style>
</head>
<body>
<div class="card">
<h1>עדכון תיקון טעינת איכות – IML</h1>
<p>בחר את קובץ <b>index.html</b> המעודכן של האפליקציה. הכלי יבצע את התיקון ויוריד קובץ חדש בשם <b>index.html</b>.</p>
<label for="f">בחר index.html</label>
<input id="f" type="file" accept=".html,text/html">
<div id="status"><small>התיקון מונע סינון מוקדם של שורות איכות לפני שיוך המתקן לפי נתוני הכמות.</small></div>
</div>
<script>
const f=document.getElementById('f'), status=document.getElementById('status');

function replaceOnce(text, oldText, newText, label){
  if(!text.includes(oldText)) throw new Error('לא נמצא קטע הקוד: '+label);
  return text.replace(oldText,newText);
}

f.addEventListener('change', async ()=>{
  try{
    const file=f.files[0]; if(!file) return;
    let text=await file.text();

    const oldResults = `          const facility=normalizeFacilityForQuality(get(row,'facility'));
          // V4.8.34: תוצאות איכות מחוץ למתקנים שבסרגל אינן נטענות ואינן נשמרות לענן.
          if(facility && !isDisplayedFacilityForLoad(facility)) continue;`;

    const newResults = `          const facility=normalizeFacilityForQuality(get(row,'facility'));
          // V4.8.40: לא מסננים כאן לפי מתקן. בקובצי SAP עמודת המתקן יכולה
          // להכיל ערך שאינו מספר המתקן שבסרגל (או להיות חסרה). השיוך למתקן
          // מבוצע רק לאחר הפענוח באמצעות נתוני הכמות: מק"ט+מנה / פקודה+מנה / מנה.
          // סינון מוקדם כאן היה מוחק את כל השורות לפני שהשיוך המאוחר יכול לעבוד.`;

    text=replaceOnce(text,oldResults,newResults,'סינון מוקדם בתוצאות בדיקה');

    const oldSummary = `      const facility = normalizeFacilityForQuality(getStr(cols,map.facility,''));
      // V4.8.34: החלטת שימוש נשמרת רק למתקנים שמוצגים בסרגל המתקנים.
      if(facility && !isDisplayedFacilityForLoad(facility)) return;`;

    const newSummary = `      const facility = normalizeFacilityForQuality(getStr(cols,map.facility,''));
      // V4.8.40: גם כאן לא מסננים לפני שלב השיוך המרכזי.
      // filterQualityRowsToDisplayedFacilities() ירוץ לאחר הפענוח וינסה קודם
      // לפתור את המתקן מול נתוני הכמות ורק לאחר מכן יסנן למתקנים שבסרגל.`;

    text=replaceOnce(text,oldSummary,newSummary,'סינון מוקדם בהחלטת שימוש');

    // Normalize work-order keys used to infer facility, to tolerate Excel numeric ".0" and leading zeros.
    const oldBuildWo = `      const wo=String(e.workOrder||'').trim();`;
    const newBuildWo = `      const wo=String(e.workOrder||'').trim().replace(/\\.0+$/,'').replace(/^0+(?=\\d)/,'');`;
    text=replaceOnce(text,oldBuildWo,newBuildWo,'נרמול פקודת עבודה בנתוני הכמות');

    const oldResolveWo = `    const wo=String((row&&(row.workOrder||row.operation))||'').trim();`;
    const newResolveWo = `    const wo=String((row&&(row.workOrder||row.operation))||'').trim().replace(/\\.0+$/,'').replace(/^0+(?=\\d)/,'');`;
    text=replaceOnce(text,oldResolveWo,newResolveWo,'נרמול פקודת עבודה באיכות');

    // Add a version marker comment to make verification easy.
    const marker='<!-- IML QUALITY LOAD FIX V4.8.40 -->\\n';
    if(!text.includes('IML QUALITY LOAD FIX V4.8.40')){
      text=text.replace('<!DOCTYPE html>','<!DOCTYPE html>\\n'+marker);
    }

    const blob=new Blob([text],{type:'text/html;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='index.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);
    status.innerHTML='<span class="ok"><b>התיקון הושלם.</b></span>\\nהורד קובץ index.html חדש. החלף איתו את index.html בפרויקט ופרוס מחדש.';
  }catch(err){
    console.error(err);
    status.innerHTML='<span class="err"><b>התיקון לא בוצע:</b></span> '+String(err.message||err);
  }
});
</script>
</body>
</html>
