  /* ==========================================================================
   * ייצוא "דיווח יומי פורמולציות" — לפי המתקנים הנבחרים בפילטר
   * מבנה: B=מק״ט מוצר C=מתקן(ממוזג) D=קו יצור E=חומר F=סטטוס מכונה
   *        G=תפוקה H=סה"כ תפוקה(SUM ממוזג) I=הערות(ריק) J=קמפיין
   * ========================================================================*/

  function dfrDateLabel(v){
    const m = String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[3]+'.'+m[2]+'.'+m[1].slice(2) : String(v||'');
  }
  function dfrMaterialCode(e){
    // V4.8.18: use the real product material code from the quantities file.
    // Fall back to the historical short description only for old cached rows that have no materialCode.
    const code = String(e.materialCode||'').replace(/\.0$/,'').trim();
    if(code) return code;
    const name = String(e.materialName||'').trim();
    return name ? name.split(/\s+/)[0] : '';
  }
  function dfrLine(e){
    const pack = String(e.packagingType||'').trim();
    if(pack) return pack.replace(/^קו אריזה\s*/, '').trim();
    return String(e.line||'').trim() || 'כללי';
  }
  function dfrMachineStatus(e){
    const out = numberValue(e.production) + numberValue(e.packaging);
    if(out === 0) return 'ריק';
    if(pendingPackagingQty(e) > 0) return 'מנה בהכנה';
    const sys = String(e.systemStatus||'').toUpperCase();
    if(sys.indexOf('PCNF') !== -1) return 'מנה בהכנה';
    if(sys.indexOf('CNF')  !== -1) return 'מנה מוכנה';
    return 'מנה בהכנה';
  }
  function dfrCampaign(e){
    const out = numberValue(e.production) + numberValue(e.packaging);
    const tgt = getProductionTarget(e) + getPackagingTarget(e);
    if(tgt > 0) return 'דווחו ' + Math.round(out).toLocaleString('en-US') + ' מתוך ' +
                       Math.round(tgt).toLocaleString('en-US') + ' (' + Math.round(out/tgt*100) + '%)';
    if(out > 0) return 'דווחו ' + Math.round(out).toLocaleString('en-US') + ' (ללא יעד מוגדר)';
    return '';
  }

  const DAILY_REPORT_INDEX_KEY='daily_formulation_snapshots_v1_index';
  const DAILY_REPORT_PREFIX='daily_formulation_snapshot_v1_';
  const DAILY_REPORT_FILE_PREFIX='daily_formulation_file_v1_';

  function arrayBufferToBase64(buffer){
    const bytes=new Uint8Array(buffer);
    const step=0x8000;
    let binary='';
    for(let i=0;i<bytes.length;i+=step){
      const chunk=bytes.subarray(i,Math.min(i+step,bytes.length));
      binary+=String.fromCharCode.apply(null,chunk);
    }
    return btoa(binary);
  }
  function base64ToUint8Array(base64){
    const binary=atob(base64||'');
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    return bytes;
  }
  function downloadStoredExcelFile(base64,fileName){
    const bytes=base64ToUint8Array(base64);
    const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=fileName||'daily_formulation_report.xlsx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }

  function dailyReportISODate(view){
    const candidates=(view&&view.filtered||[]).map(e=>String(e.date||'')).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)).sort();
    if(candidates.length)return candidates[candidates.length-1];
    const raw=String(view&&view.rangeLabel||'');
    const m=raw.match(/(\d{4})-(\d{2})-(\d{2})/);
    return m?m[0]:todayISO();
  }

  async function saveDailyFormulationSnapshot(view, rows, facilities, evs){
    if(!isAdmin || !adminToken) return false;
    const date=dailyReportISODate(view);
    const snapshot={
      version:1,date,savedAt:new Date().toISOString(),
      sourceFiles:{
        production:(datasetSources.production||[]).map(x=>({name:x.name,at:x.at,rows:x.rows})),
        qualitySummary:(datasetSources.qualitySummary||[]).map(x=>({name:x.name,at:x.at,rows:x.rows})),
        qualityResults:(datasetSources.qualityResults||[]).map(x=>({name:x.name,at:x.at,rows:x.rows})),
        targets:targetFileMeta.fileName?{name:targetFileMeta.fileName,at:targetFileMeta.loadedAt}:null
      },
      facilities:[...(facilities||[])],
      rows:(rows||[]).map(e=>({...e})),
      events:(evs||[]).map(e=>({...e}))
    };
    await _dashStorage.set(DAILY_REPORT_PREFIX+date,JSON.stringify(snapshot));
    let index=[];
    try{
      const res=await _dashStorage.get(DAILY_REPORT_INDEX_KEY,{fresh:true});
      index=res&&res.value?JSON.parse(res.value):[];
      if(!Array.isArray(index))index=[];
    }catch(e){}
    index=index.filter(x=>x&&x.date!==date);
    index.push({date,savedAt:snapshot.savedAt,rowCount:snapshot.rows.length,facilities:snapshot.facilities});
    index.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    await _dashStorage.set(DAILY_REPORT_INDEX_KEY,JSON.stringify(index.slice(0,730)));
    return true;
  }

  async function loadSavedDailyFormulationReport(){
    try{
      const idxRes=await _dashStorage.get(DAILY_REPORT_INDEX_KEY,{fresh:true});
      let index=idxRes&&idxRes.value?JSON.parse(idxRes.value):[];
      if(!Array.isArray(index)||!index.length){showToast('עדיין לא נשמרו דוחות יומיים בענן',true);return;}
      const recent=index.slice(0,20).map(x=>x.date).join(', ');
      const date=prompt('הזן תאריך דוח בפורמט YYYY-MM-DD\\nתאריכים אחרונים: '+recent,index[0].date);
      if(!date)return;
      const [res,fileRes]=await Promise.all([
        _dashStorage.get(DAILY_REPORT_PREFIX+date,{fresh:true}),
        _dashStorage.get(DAILY_REPORT_FILE_PREFIX+date,{fresh:true}).catch(()=>null)
      ]);
      if(fileRes&&fileRes.value){
        const stored=JSON.parse(fileRes.value);
        if(stored&&stored.base64){
          downloadStoredExcelFile(stored.base64,stored.fileName||('daily_formulation_report_'+date+'.xlsx'));
          showToast('הקובץ המעודכן המקורי הורד כפי שנשמר');
          return;
        }
      }
      if(!res||!res.value){showToast('לא נמצא דוח שמור לתאריך '+date,true);return;}
      const snapshot=JSON.parse(res.value);
      await exportDailyFormulationReport(snapshot);
    }catch(e){console.error(e);showToast('שגיאה בטעינת דוח יומי שמור: '+(e.message||e),true);}
  }


  function excelCellText(v){
    if(v==null)return '';
    if(v instanceof Date){
      const y=v.getFullYear(),m=String(v.getMonth()+1).padStart(2,'0'),d=String(v.getDate()).padStart(2,'0');
      return y+'-'+m+'-'+d;
    }
    return String(v).trim();
  }
  function parseDailyReportDateValue(v){
    if(v instanceof Date && !isNaN(v)) return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
    if(typeof v==='number' && typeof XLSX!=='undefined' && XLSX.SSF && XLSX.SSF.parse_date_code){
      const d=XLSX.SSF.parse_date_code(v);
      if(d&&d.y)return String(d.y).padStart(4,'0')+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0');
    }
    const t=excelCellText(v);
    let m=t.match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
    if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
    m=t.match(/(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/);
    if(m){let y=m[3];if(y.length===2)y='20'+y;return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}
    return '';
  }
  async function importUpdatedDailyFormulationReport(file){
    try{
      if(!requireAdmin())return false;
      if(!file)return false;
      if(typeof XLSX==='undefined')throw new Error('ספריית Excel לא נטענה');
      const originalBuffer=await file.arrayBuffer();
      const wb=XLSX.read(originalBuffer,{type:'array',cellDates:true,dense:false});
      const ws=wb.Sheets['Template']||wb.Sheets[wb.SheetNames[0]];
      if(!ws)throw new Error('לא נמצא גיליון דוח');
      const grid=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
      if(grid.length<8)throw new Error('מבנה הדוח אינו תקין');

      let reportDate='';
      for(let r=0;r<Math.min(grid.length,12);r++){
        for(let c=0;c<Math.min((grid[r]||[]).length,12);c++){
          if(excelCellText(grid[r][c]).replace(/\s/g,'')==='תאריךדיווח'){
            reportDate=parseDailyReportDateValue((grid[r]||[])[c+1]);
          }
        }
      }
      if(!reportDate){
        for(let r=0;r<Math.min(grid.length,12)&&!reportDate;r++)
          for(let c=0;c<Math.min((grid[r]||[]).length,12)&&!reportDate;c++)
            reportDate=parseDailyReportDateValue(grid[r][c]);
      }
      if(!reportDate)throw new Error('לא הצלחתי לזהות את תאריך הדוח מתוך הקובץ');

      let headerRow=-1;
      for(let r=0;r<Math.min(grid.length,25);r++){
        const vals=(grid[r]||[]).map(excelCellText);
        if(vals.some(x=>x.includes('מק״ט מוצר')||x.includes('מק"ט מוצר')) && vals.some(x=>x==='תפוקה')){
          headerRow=r;break;
        }
      }
      if(headerRow<0)throw new Error('לא נמצאה שורת הכותרות של הדוח');

      const headers=(grid[headerRow]||[]).map(excelCellText);
      const col=(...names)=>headers.findIndex(h=>names.some(n=>h===n||h.includes(n)));
      const cMat=col('מק״ט מוצר','מק"ט מוצר'), cFac=col(reportDate,'מתקן'), cLine=col('קו יצור'), cName=col('חומר'),
            cBatch=col('מספר אצווה','אצווה','מנה'), cStatus=col('סטטוס מכונה'), cQty=col('תפוקה'),
            cTotal=col('סה"כ תפוקה'), cNotes=col('הערות'), cCamp=col('קמפיין');
      // The facility column header is the report date in exported files; fallback to column C.
      const facilityCol=cFac>=0?cFac:2;
      let lastFacility='', importedRows=[];
      for(let r=headerRow+1;r<grid.length;r++){
        const row=grid[r]||[];
        const material=excelCellText(row[cMat>=0?cMat:1]);
        const line=excelCellText(row[cLine>=0?cLine:3]);
        const name=excelCellText(row[cName>=0?cName:4]);
        const batch=cBatch>=0?excelCellText(row[cBatch]):'';
        const status=excelCellText(row[cStatus>=0?cStatus:5]);
        const notes=excelCellText(row[cNotes>=0?cNotes:8]);
        const campaign=excelCellText(row[cCamp>=0?cCamp:9]);
        const facRaw=excelCellText(row[facilityCol]);
        if(facRaw)lastFacility=facRaw.replace(/,/g,'');
        if(/סה"כ כללי/.test(status)||/סה"כ כללי/.test(name)||/סה"כ כללי/.test(line))break;
        if(!material&&!name&&!line&&!status&&!notes&&!campaign)continue;
        let qty=Number(String(row[cQty>=0?cQty:6]??'').replace(/,/g,''));
        if(!Number.isFinite(qty))qty=0;
        importedRows.push({
          date:reportDate,
          facility:lastFacility,
          materialCode:material,
          materialName:name,
          batch:batch,
          packagingType:line,
          line:line,
          machineStatus:status,
          production:qty,
          packaging:0,
          notes:notes,
          campaignText:campaign,
          importedDailyReport:true
        });
      }
      if(!importedRows.length)throw new Error('לא נמצאו שורות דוח לטעינה');

      const existingRes=await _dashStorage.get(DAILY_REPORT_PREFIX+reportDate,{fresh:true});
      let original=null;
      try{original=existingRes&&existingRes.value?JSON.parse(existingRes.value):null;}catch(e){}
      const savedAt=new Date().toISOString();
      const snapshot={
        version:2,date:reportDate,savedAt,
        importedAt:savedAt,importedFileName:file.name,
        originalSavedAt:original&&original.savedAt||null,
        sourceFiles:original&&original.sourceFiles||{},
        facilities:Array.from(new Set(importedRows.map(x=>String(x.facility||'')).filter(Boolean))),
        rows:importedRows,
        events:original&&Array.isArray(original.events)?original.events:[]
      };
      await _dashStorage.set(DAILY_REPORT_PREFIX+reportDate,JSON.stringify(snapshot));
      const exactFile={
        version:1,date:reportDate,fileName:file.name,
        importedAt:savedAt,size:file.size||originalBuffer.byteLength,
        base64:arrayBufferToBase64(originalBuffer)
      };
      await _dashStorage.set(DAILY_REPORT_FILE_PREFIX+reportDate,JSON.stringify(exactFile));

      let index=[];
      try{
        const res=await _dashStorage.get(DAILY_REPORT_INDEX_KEY,{fresh:true});
        index=res&&res.value?JSON.parse(res.value):[];
        if(!Array.isArray(index))index=[];
      }catch(e){}
      const prev=index.find(x=>x&&x.date===reportDate)||null;
      index=index.filter(x=>x&&x.date!==reportDate);
      index.push({
        date:reportDate,savedAt,
        originalSavedAt:(prev&&prev.originalSavedAt)||(prev&&prev.savedAt)||snapshot.originalSavedAt||null,
        importedAt:savedAt,importedFileName:file.name,rowCount:importedRows.length,facilities:snapshot.facilities
      });
      index.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
      await _dashStorage.set(DAILY_REPORT_INDEX_KEY,JSON.stringify(index.slice(0,730)));
      showToast('הדוח המעודכן נשמר בענן לתאריך '+reportDate+' · '+importedRows.length+' שורות');
      return true;
    }catch(e){
      console.error('daily report import:',e);
      showToast('שגיאה בטעינת דוח יומי מעודכן: '+(e.message||e),true);
      return false;
    }
  }


  async function exportMonthlyFormulationArchive(){
    try{
      const idxRes=await _dashStorage.get(DAILY_REPORT_INDEX_KEY,{fresh:true});
      let index=idxRes&&idxRes.value?JSON.parse(idxRes.value):[];
      if(!Array.isArray(index)||!index.length){showToast('עדיין לא נשמרו דוחות יומיים בענן',true);return;}

      const months=Array.from(new Set(index.map(x=>String(x.date||'').slice(0,7)).filter(x=>/^\d{4}-\d{2}$/.test(x)))).sort().reverse();
      if(!months.length){showToast('לא נמצאו חודשים בארכיון הדוחות',true);return;}
      const month=prompt('הזן חודש בפורמט YYYY-MM\nחודשים זמינים: '+months.join(', '),months[0]);
      if(!month)return;
      if(!/^\d{4}-\d{2}$/.test(month)){showToast('פורמט חודש לא תקין',true);return;}

      const days=index.filter(x=>String(x.date||'').startsWith(month+'-')).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
      if(!days.length){showToast('לא נמצאו דוחות שמורים לחודש '+month,true);return;}

      showToast('מכין דוח חודשי מ-'+days.length+' דוחות יומיים...');
      const snapshots=[];
      for(const d of days){
        try{
          const res=await _dashStorage.get(DAILY_REPORT_PREFIX+d.date,{fresh:true});
          if(res&&res.value){
            const snap=JSON.parse(res.value);
            if(snap&&Array.isArray(snap.rows))snapshots.push(snap);
          }
        }catch(e){console.warn('monthly snapshot read',d.date,e);}
      }
      if(!snapshots.length){showToast('לא ניתן לקרוא את הדוחות היומיים של החודש',true);return;}

      const detail=[];
      snapshots.forEach(snap=>{
        (snap.rows||[]).forEach(e=>{
          detail.push({
            date:snap.date||e.date||'',
            facility:String(e.facility||''),
            materialCode:String(e.materialCode||''),
            materialName:String(e.materialName||''),
            batch:String(e.batch||''),
            line:String(e.packagingType||e.line||''),
            production:Math.round(numberValue(e.production)+numberValue(e.packaging)),
            machineStatus:String(e.machineStatus||''),
            notes:String(e.notes||''),
            campaign:String(e.campaignText!=null?e.campaignText:dfrCampaign(e)||''),
            savedAt:snap.importedAt||snap.savedAt||''
          });
        });
      });
      detail.sort((a,b)=>a.date.localeCompare(b.date)||a.facility.localeCompare(b.facility,'he'));

      const byFac={};
      detail.forEach(r=>{
        const f=r.facility||'ללא מתקן';
        if(!byFac[f])byFac[f]={facility:f,dates:new Set(),production:0,notes:[],statuses:[],campaigns:[]};
        const x=byFac[f];
        if(r.date)x.dates.add(r.date);
        x.production+=numberValue(r.production);
        if(r.notes)x.notes.push(r.date+' — '+r.notes);
        if(r.machineStatus)x.statuses.push(r.date+' — '+r.machineStatus);
        if(r.campaign)x.campaigns.push(r.date+' — '+r.campaign);
      });

      const wb=XLSX.utils.book_new();
      const detailsAOA=[
        ['דוח חודשי מרכז — פורמולציות',month],
        ['מספר דוחות יומיים',snapshots.length],
        [],
        ['תאריך','מתקן','מק״ט מוצר','חומר','מספר אצווה','קו ייצור','תפוקה','סטטוס מכונה','הערות','קמפיין / דיווח מול יעד','עודכן לאחרונה']
      ];
      detail.forEach(r=>detailsAOA.push([
        r.date,r.facility,r.materialCode,r.materialName,r.batch,r.line,r.production,
        r.machineStatus,r.notes,r.campaign,formatLoadStamp(r.savedAt)
      ]));
      const ws1=XLSX.utils.aoa_to_sheet(detailsAOA);
      ws1['!cols']=[{wch:13},{wch:12},{wch:18},{wch:34},{wch:18},{wch:18},{wch:14},{wch:18},{wch:50},{wch:50},{wch:20}];
      ws1['!autofilter']={ref:'A4:K'+detailsAOA.length};
      ws1['!views']=[{rightToLeft:true}];
      XLSX.utils.book_append_sheet(wb,ws1,'פירוט חודשי');

      const summaryAOA=[
        ['סיכום חודשי לפי מתקן',month],
        [],
        ['מתקן','מספר ימי דיווח','סה״כ תפוקה','סטטוסים במהלך החודש','כל ההערות','קמפיין / דיווח מול יעד']
      ];
      Object.values(byFac).sort((a,b)=>a.facility.localeCompare(b.facility,'he')).forEach(x=>{
        summaryAOA.push([
          x.facility,x.dates.size,Math.round(x.production),
          x.statuses.join('\n'),x.notes.join('\n'),x.campaigns.join('\n')
        ]);
      });
      const ws2=XLSX.utils.aoa_to_sheet(summaryAOA);
      ws2['!cols']=[{wch:15},{wch:16},{wch:18},{wch:55},{wch:70},{wch:70}];
      ws2['!views']=[{rightToLeft:true}];
      for(let r=3;r<summaryAOA.length;r++){
        ['D','E','F'].forEach(c=>{
          const cell=ws2[c+(r+1)];
          if(cell)cell.s={alignment:{wrapText:true,vertical:'top',horizontal:'right'}};
        });
      }
      XLSX.utils.book_append_sheet(wb,ws2,'סיכום לפי מתקן');

      const monthEvents=[];
      snapshots.forEach(snap=>(snap.events||[]).forEach(ev=>monthEvents.push({...ev,reportDate:snap.date||ev.date||''})));
      if(monthEvents.length){
        monthEvents.sort((a,b)=>String(a.reportDate).localeCompare(String(b.reportDate)));
        const evAOA=[
          ['אירועים חודשיים — איכות / סביבה / בטיחות',month],
          [],
          ['תאריך','סוג','מתקן','קו / אזור','פקודת עבודה','מספר אצווה','חומרה','תיאור','פעולה מתקנת / הערות']
        ];
        monthEvents.forEach(ev=>evAOA.push([
          ev.reportDate||ev.date||'',eventTypeLabel(ev.type),ev.facility||'',ev.area||'',ev.workOrder||'',ev.batch||'',
          ev.severity||'',ev.description||'',ev.action||''
        ]));
        const evWs=XLSX.utils.aoa_to_sheet(evAOA);
        evWs['!cols']=[{wch:13},{wch:16},{wch:12},{wch:22},{wch:18},{wch:18},{wch:15},{wch:55},{wch:55}];
        evWs['!views']=[{rightToLeft:true}];
        XLSX.utils.book_append_sheet(wb,evWs,'אירועים חודשיים');
      }

      writeWorkbookForMobile(wb,'monthly_formulation_report_'+month+'.xlsx');
      showToast('דוח חודשי נוצר: '+snapshots.length+' ימים · '+Object.keys(byFac).length+' מתקנים');
    }catch(e){
      console.error('monthly formulation report:',e);
      showToast('שגיאה ביצירת דוח חודשי: '+(e.message||e),true);
    }
  }

  async function exportDailyFormulationReport(snapshotOverride){
    try{
      if(typeof XLSX === 'undefined'){
        showToast('ספריית Excel לא נטענה. נסה לרענן את העמוד.', true);
        return;
      }
      const liveView = getView();
      const isSavedSnapshot=!!(snapshotOverride && typeof snapshotOverride==='object' && Array.isArray(snapshotOverride.rows));
      const view = isSavedSnapshot ? {filtered:snapshotOverride.rows||[],rangeLabel:snapshotOverride.date||'',from:snapshotOverride.date||'',to:snapshotOverride.date||''} : liveView;
      const rows = view.filtered || [];
      if(!rows.length){ showToast('אין נתונים בטווח שנבחר', true); return; }

      const evs = isSavedSnapshot ? (snapshotOverride.events||[]) : (typeof filteredEventsForView === 'function' ? filteredEventsForView(view) : []);
      const nQ = evs.filter(ev=>ev.type==='quality').length;
      const nE = evs.filter(ev=>ev.type==='environment').length;
      const nS = evs.filter(ev=>ev.type==='safety').length;

      /* המתקנים הנבחרים בפילטר — זה ה"לפי מתקנים נבחרים" */
      let facilities = isSavedSnapshot && Array.isArray(snapshotOverride.facilities)
        ? snapshotOverride.facilities.slice().sort()
        : (selectedFacilities === null ? FACILITY_OPTIONS.slice().sort() : Array.from(selectedFacilities).sort());

      const byFac = {};
      rows.forEach(e=>{
        const f = String(e.facility || 'לא מוגדר').trim();
        (byFac[f] = byFac[f] || []).push(e);
      });
      Object.keys(byFac).forEach(f=>{ if(facilities.indexOf(f) === -1) facilities.push(f); });
      Object.keys(byFac).forEach(f=>{
        byFac[f].sort((a,b)=> dfrLine(a).localeCompare(dfrLine(b),'he') ||
          String(a.materialName||'').localeCompare(String(b.materialName||''),'he'));
      });

      const BD  = {style:'thin', color:{rgb:'000000'}};
      const BOX = {top:BD, bottom:BD, left:BD, right:BD};
      const ST = {
        title : {font:{name:'Arial', sz:16, bold:true}},
        label : {font:{name:'Arial', sz:11, bold:true}},
        banner: {font:{name:'Arial', sz:11, bold:true}, fill:{fgColor:{rgb:'FFFF00'}},
                 alignment:{horizontal:'center', vertical:'center', wrapText:true}, border:BOX},
        head  : {font:{name:'Arial', sz:11, bold:true}, fill:{fgColor:{rgb:'D9D9D9'}},
                 alignment:{horizontal:'center', vertical:'center', wrapText:true}, border:BOX},
        cell  : {font:{name:'Arial', sz:11},
                 alignment:{horizontal:'center', vertical:'center', wrapText:true}, border:BOX},
        text  : {font:{name:'Arial', sz:11},
                 alignment:{horizontal:'right', vertical:'center', wrapText:true}, border:BOX},
        total : {font:{name:'Arial', sz:11, bold:true}, fill:{fgColor:{rgb:'D9D9D9'}},
                 alignment:{horizontal:'center', vertical:'center'}, border:BOX}
      };
      const C = {A:0,B:1,C:2,D:3,E:4,F:5,G:6,H:7,I:8,J:9,K:10};
      const ws = {}, merges = [];
      const at  = (r,c)=> XLSX.utils.encode_cell({r:r-1, c:c});
      const put = (r,c,v,st,z)=>{
        const ref = at(r,c), isN = typeof v === 'number';
        ws[ref] = {t: isN ? 'n' : 's', v: isN ? v : String(v==null?'':v)};
        if(st) ws[ref].s = st;
        if(z)  ws[ref].z = z;
      };
      const putF = (r,c,f,st)=>{ const ref = at(r,c); ws[ref] = {t:'n', f:f, z:'#,##0'}; if(st) ws[ref].s = st; };

      const dLabel = dfrDateLabel(view.rangeLabel);

      put(2, C.B, 'דיווח יומי — פורמולציות', ST.title);
      merges.push({s:{r:1,c:C.B}, e:{r:1,c:C.E}});
      put(3, C.B, 'תאריך דיווח', ST.label);
      put(3, C.C, dLabel);
      put(3, C.D, 'מתקנים נבחרים', ST.label);
      put(3, C.E, facilities.join(', '));
      merges.push({s:{r:2,c:C.E}, e:{r:2,c:C.J}});
      const latestStamp=items=>{const x=(items||[]).slice().sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')))[0];return x?formatLoadStamp(x.at):'—';};
      const snapSources=isSavedSnapshot&&snapshotOverride.sourceFiles;
      const loadInfo=snapSources
        ? 'טעינת כמויות: '+(snapSources.production&&snapSources.production.length?formatLoadStamp(snapSources.production.slice().sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')))[0].at):'—')+
          ' | איכות: '+(snapSources.qualitySummary&&snapSources.qualitySummary.length?formatLoadStamp(snapSources.qualitySummary.slice().sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')))[0].at):'—')
        : 'טעינת כמויות: '+latestStamp(datasetSources.production)+' | איכות: '+latestStamp([...(datasetSources.qualitySummary||[]),...(datasetSources.qualityResults||[])])+' | יעדים: '+(targetFileMeta.loadedAt?formatLoadStamp(targetFileMeta.loadedAt):'—');
      put(4,C.B,loadInfo,ST.label);
      merges.push({s:{r:3,c:C.B},e:{r:3,c:C.K}});

      const tx = n => n === 0 ? 'אין' : String(n);
      put(6, C.C, 'אירוע איכות - '+tx(nQ)+' .   סביבה - '+tx(nE)+' .   בטיחות - '+tx(nS)+' .', ST.banner);
      for(let c=C.D;c<=C.J;c++) put(6,c,'',ST.banner);
      merges.push({s:{r:5,c:C.C}, e:{r:5,c:C.J}});
      put(7, C.C, '', ST.banner);
      for(let c=C.D;c<=C.J;c++) put(7,c,'',ST.banner);
      merges.push({s:{r:6,c:C.C}, e:{r:6,c:C.J}});

      ['מק״ט מוצר', dLabel, 'קו יצור', 'חומר', 'מספר אצווה', 'סטטוס מכונה', 'תפוקה', 'סה"כ תפוקה', 'הערות', 'קמפיין / דיווח מול יעד']
        .forEach((h,i)=> put(8, C.B+i, h, ST.head));

      let r = 9;
      facilities.forEach(fac=>{
        const list = byFac[fac] || [], start = r;
        if(!list.length){
          put(r, C.B, '',     ST.cell);
          put(r, C.D, 'כללי', ST.cell);
          put(r, C.E, '',     ST.text);
          put(r, C.F, '',     ST.cell);
          put(r, C.G, '',     ST.cell);
          put(r, C.H, 0,      ST.cell, '#,##0');
          put(r, C.J, '',     ST.text);
          put(r, C.K, 'לא דווחו נתונים בתאריך זה', ST.text);
          r++;
        } else {
          list.forEach(e=>{
            put(r, C.B, dfrMaterialCode(e),                          ST.cell);
            put(r, C.D, dfrLine(e),                                  ST.cell);
            put(r, C.E, String(e.materialName||''),                  ST.text);
            put(r, C.F, String(e.batch||''),                         ST.cell);
            put(r, C.G, isSavedSnapshot ? String(e.machineStatus||'') : '', ST.cell);
            put(r, C.H, Math.round(numberValue(e.production) + numberValue(e.packaging)), ST.cell, '#,##0');
            put(r, C.J, isSavedSnapshot ? String(e.notes||'') : '', ST.text);
            put(r, C.K, isSavedSnapshot && e.campaignText!=null ? String(e.campaignText) : dfrCampaign(e), ST.text);
            r++;
          });
        }
        const end = r - 1;
        if(end < start) return;
        /* z:'0' — מספר מתקן בלי מפריד אלפים (1542 ולא 1,542) */
        put(start, C.C, /^\d+$/.test(fac) ? Number(fac) : fac, ST.cell, /^\d+$/.test(fac) ? '0' : undefined);
        putF(start, C.I, 'SUM(H'+start+':H'+end+')', ST.cell);
        for(let rr=start+1; rr<=end; rr++){ put(rr,C.C,'',ST.cell); put(rr,C.I,'',ST.cell); }
        if(end > start){
          merges.push({s:{r:start-1,c:C.C}, e:{r:end-1,c:C.C}});
          merges.push({s:{r:start-1,c:C.I}, e:{r:end-1,c:C.I}});
        }
      });

      const last = r - 1, totalRow = last + 1;
      for(let c=C.C;c<=C.J;c++) put(totalRow, c, '', ST.total);
      put(totalRow, C.G, 'סה"כ כללי', ST.total);
      putF(totalRow, C.H, 'SUM(H9:H'+last+')', ST.total);
      putF(totalRow, C.I, 'SUM(H9:H'+last+')', ST.total);

      ws['!ref']    = XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:totalRow-1, c:C.K}});
      ws['!merges'] = merges;
      ws['!cols']   = [{wch:3},{wch:16},{wch:12},{wch:13},{wch:42},{wch:18},{wch:22},{wch:11},{wch:12},{wch:46},{wch:34}];

      /* גובה שורות — כדי ששם החומר הגולש ייראה במלואו, כמו בדיווח הידני */
      const rowsH = [];
      rowsH[5] = {hpt:26};   /* באנר האירועים */
      rowsH[7] = {hpt:30};   /* שורת הכותרות */
      for(let rr=9; rr<=totalRow; rr++){
        const matCell = ws[at(rr, C.E)];
        const len = matCell && matCell.v != null ? String(matCell.v).length : 0;
        rowsH[rr-1] = {hpt: len > 56 ? 46 : (len > 28 ? 32 : 20)};
      }
      ws['!rows'] = rowsH;

      const wb = XLSX.utils.book_new();
      wb.Workbook = {Views:[{RTL:true}]};
      XLSX.utils.book_append_sheet(wb, ws, 'Template');

      const legend = XLSX.utils.aoa_to_sheet([
        ['שדה','מקור / דרך הגזירה'],
        ['מק״ט מוצר','מק״ט המוצר האמיתי מתוך עמודת Material בקובץ הכמויות. ברשומות ישנות ללא מק״ט נשמרת תאימות לאחור.'],
        ['מספר אצווה','מספר האצווה/Batch מתוך קובץ הכמויות.'],
        ['מתקן','לפי המתקנים המסומנים בסנן המתקנים. שורה אחת לכל מתקן, ממוזגת על פני שורות הקבוצה.'],
        ['קו יצור','סוג האריזה כשקיים (למשל 5 ליטר), אחרת עמודת הקו.'],
        ['סטטוס מכונה','העמודה נשארת ריקה למילוי ידני.'],
        ['תפוקה','ייצור + אריזה של אותה שורה.'],
        ['סה"כ תפוקה','נוסחת SUM על שורות התפוקה של אותו מתקן — מתעדכנת אוטומטית.'],
        ['הערות','נשארת ריקה למילוי ידני.'],
        ['קמפיין','דווחו X מתוך Y (%) לפי יעד ייצור + יעד אריזה.'],
        ['שורת האירועים','אירועי איכות / סביבה / בטיחות שהוזנו בדשבורד לטווח הנבחר.'],
        ['',''],
        ['הערה','שדות שאינם קיימים בנתוני הדשבורד נגזרים לפי הכללים שלעיל ודורשים אימות ידני.']
      ]);
      legend['!cols'] = [{wch:24},{wch:95}];
      XLSX.utils.book_append_sheet(wb, legend, 'מקרא והנחות');

      if(evs.length){
        const evAOA=[
          ['אירועי איכות / סביבה / בטיחות',view.rangeLabel||''],
          [],
          ['תאריך','סוג אירוע','מתקן','קו / אזור','פקודת עבודה','מספר אצווה','דרגת חומרה','תיאור האירוע','פעולה מתקנת / הערות']
        ];
        evs.forEach(ev=>evAOA.push([
          ev.date||'',eventTypeLabel(ev.type),ev.facility||'',ev.area||'',ev.workOrder||'',ev.batch||'',
          ev.severity||'',ev.description||'',ev.action||''
        ]));
        const evWs=XLSX.utils.aoa_to_sheet(evAOA);
        evWs['!cols']=[{wch:13},{wch:16},{wch:12},{wch:22},{wch:18},{wch:18},{wch:16},{wch:55},{wch:55}];
        evWs['!views']=[{rightToLeft:true}];
        XLSX.utils.book_append_sheet(wb,evWs,'אירועים');
      }

      const fileName = 'daily_formulation_report_' + (view.rangeLabel || todayISO()) + '.xlsx';
      if(!isSavedSnapshot && isAdmin && adminToken){
        try{
          await saveDailyFormulationSnapshot(view,rows,facilities,evs);
        }catch(e){console.warn('daily snapshot save failed',e);}
      }
      writeWorkbookForMobile(wb, fileName);
      showToast(isSavedSnapshot?'דוח יומי שמור נטען ויוצא לאקסל':'דוח יומי נוצר ונשמר בארכיון היומי');
    } catch(err){
      console.error('Daily formulation export error:', err);
      showToast('שגיאה ביצוא הדיווח היומי: '+(err.message||err), true);
    }
  }



  function buildWhatsAppSnapshotElement(view, summary){
    const shot = document.createElement('div');
    shot.className = 'wa-shot';
    const qTotal = summary.totalQualityLots || summary.qRows.length || 0;
    const targetInfo = summary.targetInfo || {workingDays:0, mode:''};
    const qGoodPct = qTotal ? Math.round((summary.goodLots || 0) / qTotal * 100) : 0;
    const maxType = Math.max(1, ...((summary.typeRows || []).map(r=>Number(r.actual)||0)));
    const statusColor = summary.pctPack >= 100 ? 'var(--green)' : (summary.pctPack >= 85 ? 'var(--yellow)' : 'var(--red)');
    const typeHtml = (summary.typeRows || []).length ?
      '<div class="wa-shot-bars">' + summary.typeRows.map(r=>{
        const actual = Number(r.actual)||0;
        const target = Number(r.target)||0;
        const pct = target>0 ? Math.round(actual/target*100) : 0;
        const w = Math.max(3, Math.round(actual/maxType*100));
        return '<div class="wa-shot-bar-row"><div>'+escapeHtml(r.label || 'ללא סוג')+'</div><div class="wa-shot-track"><div class="wa-shot-fill" style="width:'+w+'%;"></div></div><div class="mono">'+fmt(actual)+'</div></div>'+ 
          '<div style="font-size:13px;color:var(--text-muted);margin-top:-8px;padding-right:224px;">יעד '+(target?fmt(target):'—')+' | '+pct+'%</div>';
      }).join('') + '</div>' : '<div class="table-empty">אין נתוני אריזה לפי סוג</div>';

    shot.innerHTML = ''+
      '<div class="wa-shot-head">'+
        '<div class="wa-shot-logo"><div class="mark">A</div><div><h2>דוח ייצור ואריזה</h2><div class="meta">'+escapeHtml(facilitySummaryText())+' • '+escapeHtml(TAB_LABELS[tab] || '')+' • '+escapeHtml(view.rangeLabel || '')+'</div></div></div>'+ 
        '<div class="meta">הופק: '+new Date().toLocaleString('he-IL')+'</div>'+ 
      '</div>'+ 
      '<div class="wa-shot-grid">'+
        '<div class="wa-shot-card"><div class="label">סה״כ אריזה</div><div class="value">'+fmt(summary.totalPack)+'</div><div class="sub">ליטר בטווח הנבחר</div></div>'+ 
        '<div class="wa-shot-card"><div class="label">יעד אריזה</div><div class="value">'+fmt(summary.targetPack)+'</div><div class="sub">ימי דיווח: '+fmt(targetInfo.workingDays||0)+'</div></div>'+ 
        '<div class="wa-shot-card"><div class="label">עמידה ביעד</div><div class="value" style="color:'+statusColor+'">'+Math.round(summary.pctPack)+'%</div><div class="sub">'+fmt(summary.totalPack)+' / '+fmt(summary.targetPack)+'</div></div>'+ 
        '<div class="wa-shot-card"><div class="label">הזמנות פתוחות</div><div class="value">'+fmt(summary.openOrders)+'</div><div class="sub">סגורות: '+fmt(summary.closedOrders)+'</div></div>'+ 
      '</div>'+ 
      '<div class="wa-shot-grid">'+
        '<div class="wa-shot-card"><div class="label">🟢 מנות תקינות</div><div class="value">'+fmt(summary.goodLots||0)+'</div><div class="sub">'+qGoodPct+'% מסך האיכות</div></div>'+ 
        '<div class="wa-shot-card"><div class="label">🟡 ממתינות לאישור</div><div class="value">'+fmt(summary.conditionalLots||0)+'</div><div class="sub">מותנה / מוגבל</div></div>'+ 
        '<div class="wa-shot-card"><div class="label">🔴 מנות בליקוי</div><div class="value">'+fmt(summary.badLots||0)+'</div><div class="sub">מתוך '+fmt(qTotal)+' מנות</div></div>'+ 
        '<div class="wa-shot-card"><div class="label">📦 מנות איכות בטווח</div><div class="value">'+fmt(qTotal)+'</div><div class="sub">לפי תאריך/פק״ע/Batch</div></div>'+ 
      '</div>'+ 
      '<div class="wa-shot-section"><div class="wa-shot-section-title">אריזה לפי סוג קו</div>'+typeHtml+'</div>'+ 
      '<div class="wa-shot-section"><div class="wa-shot-section-title">מגמת אריזה</div><div class="chart-wrap">'+buildTrendLineSVG(view.buckets || [], 'packaging')+'</div></div>'+ 
      '<div class="wa-shot-footer">תמונה באיכות גבוהה ל‑WhatsApp • מומלץ לשלוח כקובץ תמונה כדי לצמצם דחיסה</div>';
    root.appendChild(shot);
    return shot;
  }

  async function exportDashboardImageToWhatsApp(){
    try{
      if(!loaded){ showToast('הנתונים עדיין נטענים, נסה שוב עוד רגע', true); return; }
      showToast('מכין תמונת דשבורד...');

      const view = getView();
      if(!view || !view.filtered){ showToast('לא ניתן ליצור תמונה כרגע', true); return; }
      const summary = calcAdvancedSummary(view);
      const rows = view.filtered || [];

      /* ── Build canvas summary ── */
      const W = 1080, PAD = 48;
      const canvas = document.createElement('canvas');

      // ─ helper: measure text without ctx yet ─
      const totalPack  = summary.totalPack  || 0;
      const targetPack = summary.targetPack || 0;
      const pctPack    = targetPack > 0 ? Math.round(totalPack / targetPack * 100) : 0;
      const totalProd  = rows.reduce((s,e)=>s+(Number(e.production)||0),0);

      // Build row data
      const qTotal = summary.qRows ? summary.qRows.length : 0;
      const qBad   = summary.badLots || 0;
      const qCond  = summary.conditionalLots || 0;
      const qGood  = summary.goodLots || 0;

      const shiftColors = {'בוקר':'#F59E0B','ערב':'#14B8A6','לילה':'#A78BFA'};
      const packByShift={'בוקר':0,'ערב':0,'לילה':0};
      const prodByShift={'בוקר':0,'ערב':0,'לילה':0};
      rows.forEach(e=>{
        const sh=e.shift&&SHIFTS.includes(e.shift)?e.shift:null;
        if(!sh)return;
        packByShift[sh]+=(Number(e.packaging)||0);
        prodByShift[sh]+=(Number(e.production)||0);
      });
      const hasShift = SHIFTS.some(s=>packByShift[s]>0||prodByShift[s]>0);

      // Calculate height
      let H = 200; // header
      H += 140;    // 3 KPI cards
      H += 20;     // gap
      if(hasShift){ H += 200; H += 20; } // shifts
      if(qTotal > 0){ H += 120; H += 20; } // quality
      H += 60;     // footer
      H += PAD * 2;

      canvas.width  = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      /* ── Background ── */
      ctx.fillStyle = '#0A0D12';
      ctx.fillRect(0, 0, W, H);

      /* ── Fonts & helpers ── */
      const rtlText = (text, x, y, maxW)=>{
        ctx.save();
        ctx.scale(-1,1);
        ctx.fillText(text, -x, y, maxW);
        ctx.restore();
      };
      const roundRect = (x,y,w,h,r,fill,stroke)=>{
        ctx.beginPath();
        ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
        ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
        ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
        ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
        if(fill){ctx.fillStyle=fill; ctx.fill();}
        if(stroke){ctx.strokeStyle=stroke; ctx.lineWidth=1; ctx.stroke();}
      };

      let cy = PAD;

      /* ── Header ── */
      // Logo circle
      const grad = ctx.createLinearGradient(PAD,cy+4,PAD+50,cy+54);
      grad.addColorStop(0,'#F59E0B'); grad.addColorStop(1,'#B45309');
      roundRect(PAD,cy+4,50,50,10,grad);
      ctx.fillStyle='#1a1300'; ctx.font='bold 24px Arial';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('⚙', PAD+25, cy+29);

      // Title
      ctx.textAlign='right'; ctx.fillStyle='#F1F5F9';
      ctx.font='bold 32px Arial';
      ctx.fillText('IML Production Dashboard', W-PAD, cy+20);
      ctx.font='16px Arial'; ctx.fillStyle='#64748B';
      ctx.fillText(facilitySummaryText()+' · '+escapeHtml(view.rangeLabel||''), W-PAD, cy+50);
      ctx.fillText('הופק: '+new Date().toLocaleString('he-IL'), W-PAD, cy+74);

      // Separator
      cy += 100;
      ctx.strokeStyle='rgba(255,255,255,0.1)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(PAD,cy); ctx.lineTo(W-PAD,cy); ctx.stroke();
      cy += 20;

      /* ── KPI cards row ── */
      const kpiData = [
        {label:'סה״כ אריזה (ליטר)', value:fmt(totalPack), sub: targetPack>0?fmt(targetPack)+' יעד':'', color:'#14B8A6'},
        {label:'עמידה ביעד', value:pctPack+'%', sub: fmt(totalPack)+' / '+fmt(targetPack),
          color: pctPack>=100?'#10B981':pctPack>=75?'#FBBF24':'#EF4444'},
        {label:'סה״כ ייצור', value:fmt(totalProd), sub:'', color:'#F59E0B'},
      ];
      const cardW = (W - PAD*2 - 20) / 3;
      kpiData.forEach((k,i)=>{
        const cx2 = PAD + i*(cardW+10);
        roundRect(cx2,cy,cardW,110,12,'#111827','rgba(255,255,255,0.08)');
        // top accent
        ctx.fillStyle=k.color;
        ctx.fillRect(cx2+cardW-3,cy+10,3,30);
        ctx.textAlign='right'; ctx.fillStyle='#64748B';
        ctx.font='700 11px Arial';
        ctx.fillText(k.label, cx2+cardW-14, cy+22);
        ctx.fillStyle=k.color; ctx.font='bold 34px "JetBrains Mono",Arial';
        ctx.fillText(k.value, cx2+cardW-14, cy+68);
        if(k.sub){ctx.fillStyle='#64748B'; ctx.font='12px Arial'; ctx.fillText(k.sub, cx2+cardW-14, cy+90);}
      });
      cy += 130;

      /* ── Shift breakdown ── */
      if(hasShift){
        ctx.fillStyle='#F1F5F9'; ctx.font='bold 18px Arial'; ctx.textAlign='right';
        ctx.fillText('פירוט לפי משמרת', W-PAD, cy);
        cy += 30;
        const shW = (W - PAD*2 - 20) / 3;
        SHIFTS.forEach((sh,i)=>{
          const cx2 = PAD + i*(shW+10);
          const v = packByShift[sh]||0;
          const pct = totalPack>0 ? Math.round(v/totalPack*100) : 0;
          roundRect(cx2,cy,shW,110,12,'#111827','rgba(255,255,255,0.08)');
          ctx.fillStyle=shiftColors[sh]; ctx.font='bold 12px Arial'; ctx.textAlign='right';
          ctx.fillText('■ משמרת '+sh, cx2+shW-14, cy+22);
          ctx.fillStyle='#F1F5F9'; ctx.font='bold 28px "JetBrains Mono",Arial';
          ctx.fillText(fmt(v), cx2+shW-14, cy+62);
          // bar
          roundRect(cx2+14,cy+78,shW-28,8,4,'rgba(255,255,255,0.05)');
          if(pct>0)roundRect(cx2+shW-14-Math.round((shW-28)*pct/100),cy+78,Math.round((shW-28)*pct/100),8,4,shiftColors[sh]);
          ctx.fillStyle='#64748B'; ctx.font='11px Arial';
          ctx.fillText(pct+'%', cx2+shW-14, cy+100);
        });
        cy += 130;
      }

      /* ── Quality ── */
      if(qTotal > 0){
        ctx.fillStyle='#F1F5F9'; ctx.font='bold 18px Arial'; ctx.textAlign='right';
        ctx.fillText('סיכום איכות', W-PAD, cy);
        cy += 30;
        const qItems = [
          {label:'מנות תקינות',    value:qGood, color:'#10B981'},
          {label:'ממתינות להחלטה', value:qCond, color:'#FBBF24'},
          {label:'נפסלו',          value:qBad,  color:'#EF4444'},
        ];
        const qW = (W - PAD*2 - 20) / 3;
        qItems.forEach((q,i)=>{
          const cx2 = PAD + i*(qW+10);
          roundRect(cx2,cy,qW,70,12,'#111827','rgba(255,255,255,0.08)');
          ctx.fillStyle=q.color; ctx.font='bold 11px Arial'; ctx.textAlign='right';
          ctx.fillText(q.label, cx2+qW-14, cy+22);
          ctx.fillStyle=q.color; ctx.font='bold 30px Arial';
          ctx.fillText(q.value, cx2+qW-14, cy+56);
        });
        cy += 90;
      }

      /* ── Footer ── */
      cy += 10;
      ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(PAD,cy); ctx.lineTo(W-PAD,cy); ctx.stroke();
      cy += 20;
      ctx.fillStyle='#64748B'; ctx.font='13px Arial'; ctx.textAlign='center';
      ctx.fillText('IML Production Dashboard · '+new Date().toLocaleString('he-IL'), W/2, cy+12);

      /* ── Share overlay ── */
      canvas.toBlob(async (blob)=>{
        if(!blob){ showToast('לא ניתן ליצור תמונה', true); return; }

        const fileName = 'dashboard_'+todayISO()+'.png';
        const objectUrl = URL.createObjectURL(blob);
        const file = new File([blob], fileName, {type:'image/png'});

        // Build share overlay
        const old = root.querySelector('#dashboardShareOverlay');
        if(old) old.remove();

        const overlay = document.createElement('div');
        overlay.id = 'dashboardShareOverlay';
        overlay.className = 'modal-overlay open';
        overlay.innerHTML =
          '<div class="modal" style="max-width:520px;">'+
            '<h3>📸 תמונת דשבורד מוכנה</h3>'+
            '<div style="margin-bottom:16px;">'+
              '<img src="'+objectUrl+'" style="width:100%;border-radius:10px;border:1px solid var(--border);"/>' +
            '</div>'+
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">'+
              '<button class="btn primary" id="dsh-share-native" style="font-size:13px;">📤 שתף / שלח</button>'+
              '<button class="btn secondary" id="dsh-share-wa" style="font-size:13px;border-color:#25D366;color:#25D366;">💬 WhatsApp</button>'+
              '<button class="btn secondary" id="dsh-share-email" style="font-size:13px;">📧 אימייל</button>'+
              '<a id="dsh-download" class="btn secondary" href="'+objectUrl+'" download="'+fileName+'" style="text-align:center;font-size:13px;text-decoration:none;">📥 הורד</a>'+
            '</div>'+
            '<button class="btn secondary" id="dsh-close" style="width:100%;font-size:13px;">סגור</button>'+
          '</div>';

        root.appendChild(overlay);

        // Native share (works great on iPhone)
        overlay.querySelector('#dsh-share-native').onclick = async ()=>{
          try{
            if(navigator.canShare && navigator.canShare({files:[file]})){
              await navigator.share({files:[file], title:'דוח ייצור ואריזה', text:'דוח ייצור ואריזה'});
            } else {
              // fallback: try sharing just text+url, or just download
              overlay.querySelector('#dsh-download').click();
              showToast('שיתוף קובץ לא נתמך — הקובץ הורד');
            }
          }catch(e){ if(e.name!=='AbortError') showToast('לא ניתן לשתף', true); }
        };

        overlay.querySelector('#dsh-share-wa').onclick = ()=>{
          overlay.querySelector('#dsh-download').click();
          setTimeout(()=>{ window.open('https://wa.me/', '_blank'); }, 600);
          showToast('הקובץ הורד — גרור אותו לצ׳אט ב-WhatsApp');
        };

        overlay.querySelector('#dsh-share-email').onclick = ()=>{
          overlay.querySelector('#dsh-download').click();
          const subject = encodeURIComponent('דוח ייצור ואריזה '+view.rangeLabel);
          const body    = encodeURIComponent('מצורף דוח ייצור ואריזה. הקובץ הורד אוטומטית.');
          window.open('mailto:?subject='+subject+'&body='+body, '_self');
        };

        const close = ()=>{ overlay.remove(); setTimeout(()=>URL.revokeObjectURL(objectUrl), 5000); };
        overlay.querySelector('#dsh-close').onclick = close;
        overlay.onclick = e=>{ if(e.target===overlay) close(); };

      }, 'image/png', 1.0);

    }catch(err){
      console.error('Dashboard screenshot error:', err);
      showToast('שגיאה ביצירת תמונת דשבורד: '+err.message, true);
    }
  }


  function buildWhatsAppMessage(){
    const view = (typeof getView === 'function') ? getView() : {filtered: [], rangeLabel: ''};
    const rows = Array.isArray(view.filtered) ? view.filtered : [];
    const summary = (typeof calcAdvancedSummary === 'function') ? calcAdvancedSummary(view) : null;
    const mode = (typeof facilityViewMode === 'function') ? facilityViewMode() : 'both';
    const totalProd = rows.reduce((s,e)=>s+(Number(e.production)||0),0);
    const totalPack = summary ? summary.totalPack : rows.reduce((s,e)=>s+(Number(e.packaging)||0),0);
    const targetProd = rows.reduce((s,e)=>s+((typeof getProductionTarget === 'function') ? getProductionTarget(e) : 0),0);
    const targetPack = summary ? summary.targetPack : rows.reduce((s,e)=>s+((typeof getPackagingTarget === 'function') ? getPackagingTarget(e) : 0),0);
    const pctProd = targetProd>0 ? Math.round(totalProd/targetProd*100) : 0;
    const pctPack = targetPack>0 ? Math.round(totalPack/targetPack*100) : 0;
    const facText = (typeof facilitySummaryText === 'function') ? facilitySummaryText() : 'כל המתקנים';
    const tabText = (typeof TAB_LABELS !== 'undefined' && TAB_LABELS[tab]) ? TAB_LABELS[tab] : (tab || '');
    const rangeText = view.rangeLabel || '';
    const targetInfo = (summary && summary.targetInfo) ? summary.targetInfo : ((typeof getLineTargetInfo === 'function') ? getLineTargetInfo(view) : null);
    const typeRows = summary && Array.isArray(summary.typeRows) ? summary.typeRows : [];
    const dailyRows = targetInfo && Array.isArray(targetInfo.dailyRows) ? targetInfo.dailyRows : [];
    const workingDays = targetInfo ? (targetInfo.workingDays || 0) : new Set(rows.map(e=>e.date).filter(Boolean)).size;

    const statusEmoji = pct => pct >= 100 ? '🟢' : (pct >= 85 ? '🟡' : '🔴');
    const pctText = pct => (isFinite(pct) ? Math.round(pct) : 0) + '%';
    const line = (label, value, emoji) => (emoji ? emoji + ' ' : '▪️ ') + label + ': ' + value;
    const divider = '━━━━━━━━━━━━━━━━━━━━';

    const lines = [];
    lines.push('📊 *דוח ייצור ואריזה*');
    lines.push(divider);
    if(tabText) lines.push('🗂️ *תצוגה:* ' + tabText);
    if(rangeText) lines.push('📅 *טווח:* ' + rangeText);
    lines.push('🏭 *' + facText + '*');
    lines.push('🧾 *רשומות בדוח:* ' + fmt(rows.length));
    if(workingDays) lines.push('📆 *ימי דיווח בפועל:* ' + fmt(workingDays));

    lines.push('');
    lines.push('🎯 *ביצועים מרכזיים*');
    lines.push(divider);
    if(mode !== 'packaging'){
      lines.push(line('סה״כ ייצור', fmt(totalProd) + ' יח׳', '🏗️'));
      if(targetProd > 0){
        lines.push(line('יעד ייצור', fmt(targetProd) + ' יח׳', '🎯'));
      }
    }
    if(mode !== 'production'){
      lines.push(line('סה״כ אריזה', fmt(totalPack) + ' ליטר', '📦'));
      if(targetPack > 0){
        lines.push(line('יעד אריזה מחושב', fmt(targetPack) + ' ליטר', '🎯'));
        lines.push(line('עמידה ביעד אריזה', pctText(pctPack), statusEmoji(pctPack)));
      }
    }

    if(typeRows.length){
      lines.push('');
      lines.push('🧃 *ניצולת לפי קווי אריזה*');
      lines.push(divider);
      typeRows.filter(r=>Number(r.actual||0)>0 || Number(r.target||0)>0).slice(0,6).forEach(r=>{
        const u = Number(r.utilization||0);
        const daysTxt = r.days ? ' | ימים: ' + fmt(r.days) : '';
        lines.push(statusEmoji(u) + ' ' + r.label + ' — ' + fmt(r.actual||0) + ' / ' + fmt(r.target||0) + ' ל׳ (' + pctText(u) + ')' + daysTxt);
      });
    }

    const closedOrders = summary ? summary.closedOrders : rows.filter(isOrderClosed).length;
    const openOrders = summary ? summary.openOrders : rows.filter(e=>e.systemStatus && !isOrderClosed(e)).length;
    const totalOrders = closedOrders + openOrders;
    if(totalOrders > 0){
      const closedPct = totalOrders>0 ? Math.round(closedOrders/totalOrders*100) : 0;
      lines.push('');
      lines.push('📋 *סטטוס הזמנות*');
      lines.push(divider);
      lines.push(line('הזמנות סגורות', fmt(closedOrders), '✅'));
      lines.push(line('הזמנות פתוחות', fmt(openOrders), openOrders>0 ? '🟡' : '🟢'));
      lines.push(line('שיעור סגירה', closedPct + '%', statusEmoji(closedPct)));
    }

    if(typeof qualitySummary !== 'undefined' && qualitySummary){
      let qMatched = summary && Array.isArray(summary.qRows) ? summary.qRows : [];
      if(!qMatched.length && typeof qualityMatchesPackaging === 'function'){
        const qRows = Object.values(qualitySummary || {});
        qMatched = qRows.filter(q => rows.some(e => qualityMatchesPackaging(q, e)));
      }
      if(qMatched.length > 0){
        const qGood = qMatched.filter(q=>q.worst==='ok').length;
        const qBad = qMatched.filter(q=>q.worst==='bad').length;
        const qConditional = qMatched.filter(q=>q.worst==='conditional').length;
        const qGoodPct = qMatched.length ? Math.round(qGood/qMatched.length*100) : 0;
        lines.push('');
        lines.push('🔬 *איכות*');
        lines.push(divider);
        lines.push(line('מנות איכות בטווח', fmt(qMatched.length), '📌'));
        lines.push(line('מנות תקינות', fmt(qGood) + ' (' + qGoodPct + '%)', '🟢'));
        lines.push(line('מותנה / מוגבל', fmt(qConditional), qConditional>0 ? '🟡' : '⚪'));
        lines.push(line('מנות בליקוי', fmt(qBad), qBad>0 ? '🔴' : '🟢'));
      }
    }

    const eventRows = (typeof filteredEventsForView === 'function') ? filteredEventsForView(view) : [];
    if(eventRows.length){
      const qualityEvents = eventRows.filter(e=>e.type==='quality').length;
      const envEvents = eventRows.filter(e=>e.type==='environment').length;
      lines.push('');
      lines.push('⚠️ *אירועי איכות וסביבה*');
      lines.push(divider);
      lines.push(line('סה״כ אירועים', fmt(eventRows.length), eventRows.length ? '🟡' : '🟢'));
      lines.push(line('אירועי איכות', fmt(qualityEvents), qualityEvents ? '🔴' : '🟢'));
      lines.push(line('אירועי סביבה', fmt(envEvents), envEvents ? '🌿' : '🟢'));
      eventRows.slice(0,3).forEach(ev=>{
        const ref = [ev.date, ev.facility ? 'מתקן ' + ev.facility : '', ev.title || ev.description || 'אירוע'].filter(Boolean).join(' | ');
        lines.push('• ' + ref);
      });
      if(eventRows.length > 3) lines.push('• ועוד ' + fmt(eventRows.length-3) + ' אירועים בדוח המלא');
    }

    const byFacility = {};
    rows.forEach(e=>{
      const f = e.facility || 'לא מוגדר';
      if(!byFacility[f]) byFacility[f] = {production:0, packaging:0, targetPackaging:0};
      byFacility[f].production += Number(e.production)||0;
      byFacility[f].packaging += Number(e.packaging)||0;
      byFacility[f].targetPackaging += (typeof getPackagingTarget === 'function') ? getPackagingTarget(e) : 0;
    });
    const facilities = Object.keys(byFacility).sort();
    if(facilities.length > 1){
      lines.push('');
      lines.push('🏭 *פירוט לפי מתקן*');
      lines.push(divider);
      facilities.slice(0, 8).forEach(f=>{
        const r = byFacility[f];
        lines.push('• מתקן ' + f + ' — אריזה ' + fmt(r.packaging) + ' ל׳ | ייצור ' + fmt(r.production));
      });
    }

    if(dailyRows.length){
      const lastDays = dailyRows.slice(-5);
      lines.push('');
      lines.push('📈 *ניצולת יומית — 5 ימים אחרונים בדוח*');
      lines.push(divider);
      lastDays.forEach(d=>{
        const u = Number(d.utilization||0);
        lines.push(statusEmoji(u) + ' ' + d.date + ' — ' + fmt(d.actual||0) + ' / ' + fmt(d.target||0) + ' ל׳ (' + pctText(u) + ')');
      });
    }

    const notedRows = rows.filter(e => typeof getEntryNotes === 'function' && getEntryNotes(e)).slice(0, 5);
    if(notedRows.length > 0){
      lines.push('');
      lines.push('📝 *הערות מרכזיות*');
      lines.push(divider);
      notedRows.forEach(e=>{
        const ref = [e.date, e.facility ? 'מתקן '+e.facility : '', e.workOrder ? 'פק״ע '+e.workOrder : '', e.line || ''].filter(Boolean).join(' | ');
        lines.push('• ' + ref + ': ' + getEntryNotes(e));
      });
      const totalNotes = rows.filter(e => getEntryNotes(e)).length;
      if(totalNotes > notedRows.length) lines.push('• ועוד ' + fmt(totalNotes - notedRows.length) + ' הערות בדוח המלא');
    }

    lines.push('');
    lines.push(divider);
    lines.push('🕒 הופק מתוך לוח הבקרה • ' + new Date().toLocaleString('he-IL'));
    return lines.join('\n');
  }

  function openWhatsAppWithMessage(msg){
    const text = msg || '';
    const encoded = encodeURIComponent(text);
    const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');

    // בטלפון — פתיחה ישירה של אפליקציית WhatsApp.
    // אם האפליקציה לא נפתחת, אחרי רגע עוברים לקישור wa.me.
    if(isMobile){
      const appUrl = 'whatsapp://send?text=' + encoded;
      const webFallback = 'https://wa.me/?text=' + encoded;
      let moved = false;
      const markMoved = () => { moved = true; };
      window.addEventListener('pagehide', markMoved, {once:true});
      window.addEventListener('blur', markMoved, {once:true});
      window.location.href = appUrl;
      setTimeout(function(){
        if(!moved) window.location.href = webFallback;
      }, 900);
      return;
    }

    // במחשב — פתיחת WhatsApp Web עם ההודעה.
    const url = 'https://web.whatsapp.com/send?text=' + encoded;
    const opened = window.open(url, '_blank', 'noopener,noreferrer');
    if(!opened){
      window.location.href = url;
    }
  }

function exportToWhatsApp(){
    try {
      const msg = buildWhatsAppMessage();
      if(!msg.trim()){
        showToast('אין נתונים לייצוא', true);
        return;
      }

      const overlay = root.querySelector('#whatsappOverlay');
      const preview = root.querySelector('#whatsappPreview');
      const openBtn = root.querySelector('#whatsappOpenBtn');
      const copyBtn = root.querySelector('#whatsappCopyBtn');
      const closeBtn = root.querySelector('#whatsappCloseBtn');

      if(!overlay || !preview || !openBtn){
        openWhatsAppWithMessage(msg);
        return;
      }

      preview.textContent = msg;
      overlay.classList.add('open');

      openBtn.onclick = function(){ openWhatsAppWithMessage(msg); };
      if(copyBtn){
        copyBtn.onclick = async function(){
          try{
            await navigator.clipboard.writeText(msg);
            showToast('ההודעה הועתקה');
          }catch(e){
            showToast('לא ניתן להעתיק אוטומטית — סמן והעתק ידנית', true);
          }
        };
      }
      if(closeBtn) closeBtn.onclick = function(){ overlay.classList.remove('open'); };
      overlay.onclick = function(e){ if(e.target === overlay) overlay.classList.remove('open'); };
    } catch(err) {
      console.error('WhatsApp export error:', err);
      showToast('שגיאה ביצירת הודעת WhatsApp', true);
    }
  }

  function renderShiftComparison(view){
    const container = root.querySelector('#shiftComparisonPanel');
    if(!container) return;
    const rows = (view && view.filtered) || [];
    const hasShiftData = rows.some(e=>e.shift && SHIFTS.includes(e.shift));
    if(!hasShiftData){ container.innerHTML=''; return; }

    const shiftColors = {'בוקר':'var(--amber)','ערב':'var(--teal)','לילה':'#9B7FE8'};
    const packByShift={'בוקר':0,'ערב':0,'לילה':0};
    const prodByShift={'בוקר':0,'ערב':0,'לילה':0};
    const cntByShift={'בוקר':0,'ערב':0,'לילה':0};
    rows.forEach(e=>{
      const sh=e.shift&&SHIFTS.includes(e.shift)?e.shift:null;
      if(!sh)return;
      packByShift[sh]+=(Number(e.packaging)||0);
      prodByShift[sh]+=(Number(e.production)||0);
      cntByShift[sh]++;
    });
    const totalPack=SHIFTS.reduce((s,sh)=>s+packByShift[sh],0);
    const totalProd=SHIFTS.reduce((s,sh)=>s+prodByShift[sh],0);
    const hasPackData=totalPack>0;
    const hasProdData=totalProd>0;
    if(!hasPackData&&!hasProdData){container.innerHTML='';return;}

    function shiftTable(byShift, total, unit){
      let html='<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:6px;">';
      SHIFTS.forEach(sh=>{
        const v=byShift[sh]||0;
        const pct=total>0?Math.round(v/total*100):0;
        const w=pct;
        html+=
          '<div>'+
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">'+
              '<span style="font-size:13px;font-weight:800;color:'+shiftColors[sh]+'">■ משמרת '+escapeHtml(sh)+'</span>'+
              '<span style="font-family:\'JetBrains Mono\',monospace;font-size:14px;font-weight:700;">'+fmt(v)+' '+unit+'</span>'+
              '<span style="font-size:18px;font-weight:900;color:'+shiftColors[sh]+';min-width:52px;text-align:left;">'+pct+'%</span>'+
            '</div>'+
            '<div style="height:14px;background:var(--panel-2);border-radius:999px;overflow:hidden;border:1px solid var(--border);">'+
              '<div style="height:100%;width:'+w+'%;background:'+shiftColors[sh]+';border-radius:999px;transition:width .4s;"></div>'+
            '</div>'+
            '<div class="kpi-sub" style="margin-top:3px;">'+cntByShift[sh]+' רשומות</div>'+
          '</div>';
      });
      // total row
      html+=
        '<div style="border-top:1px solid var(--border);padding-top:8px;display:flex;justify-content:space-between;align-items:center;">'+
          '<span style="font-size:12px;font-weight:700;color:var(--text-muted);">סה״כ</span>'+
          '<span style="font-family:\'JetBrains Mono\',monospace;font-size:15px;font-weight:800;">'+fmt(total)+' '+unit+'</span>'+
          '<span style="font-size:18px;font-weight:900;color:var(--text-muted);">100%</span>'+
        '</div>';
      html+='</div>';
      return html;
    }

    let html='<div class="panel" style="margin-bottom:16px;">'+
      '<div class="panel-head"><div>'+
        '<div class="panel-title">השוואת משמרות</div>'+
        '<div class="kpi-sub">חלוקת הכמות לפי משמרות · '+escapeHtml(view.rangeLabel||'')+'</div>'+
      '</div></div>';

    if(hasPackData&&hasProdData){
      // Two columns side by side
      html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">'+
        '<div><div class="panel-title" style="font-size:12px;margin-bottom:10px;">📦 אריזה (ליטר)</div>'+shiftTable(packByShift,totalPack,'ל׳')+'</div>'+
        '<div><div class="panel-title" style="font-size:12px;margin-bottom:10px;">🏗️ ייצור (יח׳)</div>'+shiftTable(prodByShift,totalProd,'יח׳')+'</div>'+
      '</div>';
    } else if(hasPackData){
      html+=shiftTable(packByShift,totalPack,'ל׳');
    } else {
      html+=shiftTable(prodByShift,totalProd,'יח׳');
    }

    html+='</div>';
    container.innerHTML=html;
  }


  /* ── סינון עמודות (כמו אקסל) ─────────────────────────
     נבנה גנרית מעל ה-DOM, אחרי כל render. כל 17 הטבלאות באפליקציה
     עטופות ב-.table-scroll, ולכן אין צורך לגעת בכל פונקציית רינדור
     בנפרד. הסינונים נשמרים לפי חתימת הכותרות, כך שהם שורדים רינדור
     מחדש של אותה טבלה.
     ─────────────────────────────────────────────────── */
  const _colFilters = new Map();   // tableKey -> Map(colIndex -> Set(values))
  let _cfPop = null;

  function tableKey(table){
    const heads = [...table.querySelectorAll('thead th')].map(th => (th.dataset.label || th.textContent || '').trim());
    const host = table.closest('[id]');
    return (host ? host.id : '') + '::' + heads.join('|');
  }
  function filtersFor(table, create){
    const key = tableKey(table);
    let m = _colFilters.get(key);
    if(!m && create){ m = new Map(); _colFilters.set(key, m); }
    return m || null;
  }
  function cellText(row, idx){
    const td = row.children[idx];
    if(!td) return '';
    return (td.innerText || td.textContent || '').replace(/\s+/g,' ').trim();
  }

  function applyColumnFilters(table){
    const m = filtersFor(table, false);
    const rows = [...table.querySelectorAll('tbody tr')];
    let shown = 0;
    rows.forEach(tr=>{
      if(tr.querySelector('td[colspan]') && tr.children.length === 1){ tr.style.display=''; return; }
      let ok = true;
      if(m) for(const [idx, allowed] of m){
        if(allowed && allowed.size && !allowed.has(cellText(tr, idx))){ ok = false; break; }
      }
      tr.style.display = ok ? '' : 'none';
      if(ok) shown++;
    });
    table.querySelectorAll('thead th').forEach((th,i)=>{
      const active = m && m.get(i) && m.get(i).size;
      th.classList.toggle('col-filtered', !!active);
    });
    renderFilterSummary(table, shown, rows.length);
    if(table.dataset.selReady === '1') updateTableToolbar(table);
  }

  function renderFilterSummary(table, shown, total){
    const wrap = table.closest('.table-scroll');
    if(!wrap || !wrap.parentNode) return;
    const m = filtersFor(table, false);
    const activeCols = m ? [...m.values()].filter(v=>v && v.size).length : 0;
    let bar = wrap.previousElementSibling;
    if(!bar || !bar.classList || !bar.classList.contains('filter-summary')){
      if(!activeCols) return;
      bar = document.createElement('div');
      bar.className = 'filter-summary';
      wrap.parentNode.insertBefore(bar, wrap);
    }
    if(!activeCols){ bar.remove(); return; }
    bar.innerHTML = 'מסונן לפי <b>'+activeCols+'</b> עמודות · מוצגות <b>'+
      shown.toLocaleString('he-IL')+'</b> מתוך '+total.toLocaleString('he-IL')+' שורות ';
    const btn = document.createElement('button');
    btn.type='button'; btn.textContent='נקה סינון';
    btn.onclick = ()=>{ const mm=filtersFor(table,false); if(mm) mm.clear(); applyColumnFilters(table); };
    bar.appendChild(btn);
  }

  function closeColumnFilter(){ if(_cfPop){ _cfPop.remove(); _cfPop=null; } }

  function openColumnFilter(table, idx, th){
    closeColumnFilter();
    const rows = [...table.querySelectorAll('tbody tr')]
      .filter(tr => !(tr.children.length === 1 && tr.querySelector('td[colspan]')));
    const values = [...new Set(rows.map(tr => cellText(tr, idx)))].sort((a,b)=>a.localeCompare(b,'he',{numeric:true}));
    const m = filtersFor(table, true);
    const current = m.get(idx);
    const selected = new Set(current && current.size ? current : values);

    const pop = document.createElement('div');
    pop.className = 'col-filter-pop';
    pop.innerHTML =
      '<div class="cf-title">סינון: '+ (th.dataset.label || th.textContent.trim()) +'</div>'+
      '<input class="cf-search" type="text" placeholder="חיפוש ערך...">'+
      '<div class="cf-list"></div>'+
      '<div class="cf-count"></div>'+
      '<div class="cf-actions"><button type="button" class="cf-apply">אישור</button>'+
      '<button type="button" class="cf-none">נקה</button></div>';
    (table.closest('#prod-dash-root') || document.body).appendChild(pop);
    _cfPop = pop;

    const list = pop.querySelector('.cf-list');
    const count = pop.querySelector('.cf-count');
    const search = pop.querySelector('.cf-search');

    function paint(term){
      const t = (term||'').trim().toLowerCase();
      const visible = values.filter(v => !t || v.toLowerCase().includes(t));
      list.innerHTML = '';
      const all = document.createElement('label');
      all.innerHTML = '<input type="checkbox"><span><b>(בחר הכל)</b></span>';
      all.querySelector('input').checked = visible.every(v=>selected.has(v));
      all.querySelector('input').onchange = e => {
        visible.forEach(v => e.target.checked ? selected.add(v) : selected.delete(v));
        paint(search.value);
      };
      list.appendChild(all);
      visible.slice(0, 1000).forEach(v=>{
        const lab = document.createElement('label');
        const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = selected.has(v);
        cb.onchange = ()=>{ cb.checked ? selected.add(v) : selected.delete(v); count.textContent = selected.size+' מתוך '+values.length+' ערכים נבחרו'; };
        const sp = document.createElement('span'); sp.textContent = v === '' ? '(ריק)' : v; sp.title = v;
        lab.appendChild(cb); lab.appendChild(sp); list.appendChild(lab);
      });
      if(visible.length > 1000){
        const note=document.createElement('div'); note.className='cf-count';
        note.textContent='מוצגים 1,000 מתוך '+visible.length.toLocaleString('he-IL')+' ערכים — צמצמו בחיפוש';
        list.appendChild(note);
      }
      count.textContent = selected.size+' מתוך '+values.length+' ערכים נבחרו';
    }
    paint('');
    search.oninput = ()=>paint(search.value);

    pop.querySelector('.cf-apply').onclick = ()=>{
      if(selected.size === values.length) m.delete(idx);
      else m.set(idx, new Set(selected));
      applyColumnFilters(table); closeColumnFilter();
    };
    pop.querySelector('.cf-none').onclick = ()=>{
      m.delete(idx); applyColumnFilters(table); closeColumnFilter();
    };

    const r = th.getBoundingClientRect();
    pop.style.top  = Math.min(r.bottom + 6, window.innerHeight - pop.offsetHeight - 10) + 'px';
    pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - pop.offsetWidth - 8)) + 'px';
    setTimeout(()=>search.focus(), 0);
  }

  document.addEventListener('mousedown', e=>{
    if(_cfPop && !_cfPop.contains(e.target) && !e.target.closest('.col-filter-btn')) closeColumnFilter();
  });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeColumnFilter(); });


  /* ── בחירת שורות והדפסה (מסונן / נבחר) ───────────────
     עמודת הבחירה נוספת כתא הראשון. אינדקסי הסינון נגזרים ממיקום התא
     בפועל, ולכן ההוספה לא מזיזה אותם — אבל היא חייבת לקרות לפני בניית
     כפתורי הסינון, אחרת הכותרות לא יתאימו לעמודות.
     ─────────────────────────────────────────────────── */
  function addSelectionColumn(table){
    if(table.dataset.selReady === '1') return;
    const headRow = table.querySelector('thead tr');
    if(!headRow) return;
    const cg = table.querySelector('colgroup');
    if(cg){ const c=document.createElement('col'); c.style.width='34px'; cg.insertBefore(c, cg.firstChild); }
    const th = document.createElement('th');
    th.className='cf-select-col';
    const master = document.createElement('input'); master.type='checkbox'; master.title='בחר הכל';
    master.onclick = e=>{
      e.stopPropagation();
      [...table.querySelectorAll('tbody tr')].forEach(tr=>{
        if(tr.style.display==='none') return;
        const cb = tr.querySelector('.cf-select-col input');
        if(cb){ cb.checked = master.checked; tr.classList.toggle('row-selected', master.checked); }
      });
      updateTableToolbar(table);
    };
    th.appendChild(master);
    headRow.insertBefore(th, headRow.firstChild);
    // שורות כותרת נוספות (אם יש) מקבלות תא ריק כדי לשמור על היישור
    [...table.querySelectorAll('thead tr')].slice(1).forEach(tr=>{
      const pad=document.createElement('th'); pad.className='cf-select-col'; tr.insertBefore(pad, tr.firstChild);
    });
    [...table.querySelectorAll('tbody tr')].forEach(tr=>{
      const td=document.createElement('td'); td.className='cf-select-col';
      if(tr.children.length===1 && tr.querySelector('td[colspan]')){
        const only=tr.children[0]; only.colSpan = (parseInt(only.colSpan,10)||1)+1; return;
      }
      const cb=document.createElement('input'); cb.type='checkbox';
      cb.onclick = e=>{ e.stopPropagation(); tr.classList.toggle('row-selected', cb.checked); updateTableToolbar(table); };
      td.appendChild(cb); tr.insertBefore(td, tr.firstChild);
    });
    table.dataset.selReady='1';
  }

  function tableRowsFor(table, mode){
    return [...table.querySelectorAll('tbody tr')].filter(tr=>{
      if(tr.children.length<=1) return false;
      if(tr.querySelector('td[colspan]') && tr.children.length===2) return false;
      if(tr.style.display==='none') return false;
      if(mode==='selected') return tr.classList.contains('row-selected');
      return true;
    });
  }

  function updateTableToolbar(table){
    const wrap = table.closest('.table-scroll');
    if(!wrap || !wrap.parentNode) return;
    let bar = wrap.previousElementSibling;
    while(bar && bar.classList && bar.classList.contains('filter-summary')) bar = bar.previousElementSibling;
    if(!bar || !bar.classList || !bar.classList.contains('table-toolbar')){
      bar = document.createElement('div'); bar.className='table-toolbar';
      wrap.parentNode.insertBefore(bar, wrap);
    }
    const shown = tableRowsFor(table,'filtered').length;
    const sel   = tableRowsFor(table,'selected').length;
    bar.innerHTML = '';
    const info=document.createElement('span');
    info.innerHTML = sel ? 'נבחרו <b>'+sel.toLocaleString('he-IL')+'</b> שורות' : 'מוצגות <b>'+shown.toLocaleString('he-IL')+'</b> שורות';
    bar.appendChild(info);
    const bF=document.createElement('button'); bF.type='button';
    bF.textContent='🖨 הדפס מסונן ('+shown.toLocaleString('he-IL')+')';
    bF.onclick=()=>printTableRows(table,'filtered');
    bar.appendChild(bF);
    const bS=document.createElement('button'); bS.type='button';
    bS.textContent='🖨 הדפס נבחרות ('+sel.toLocaleString('he-IL')+')';
    bS.disabled = !sel; bS.style.opacity = sel ? '' : '.45';
    bS.onclick=()=>printTableRows(table,'selected');
    bar.appendChild(bS);
    if(sel){
      const bC=document.createElement('button'); bC.type='button'; bC.textContent='בטל בחירה';
      bC.onclick=()=>{
        table.querySelectorAll('tbody tr.row-selected').forEach(tr=>{
          tr.classList.remove('row-selected');
          const cb=tr.querySelector('.cf-select-col input'); if(cb) cb.checked=false;
        });
        const m=table.querySelector('thead .cf-select-col input'); if(m) m.checked=false;
        updateTableToolbar(table);
      };
      bar.appendChild(bC);
    }
  }

  function printTableRows(table, mode){
    const rows = tableRowsFor(table, mode);
    if(!rows.length){ showToast(mode==='selected' ? 'לא נבחרו שורות להדפסה' : 'אין שורות להדפסה', true); return; }
    let area = document.getElementById('imlPrintArea');
    if(!area){ area=document.createElement('div'); area.id='imlPrintArea'; document.body.appendChild(area); }

    const heads = [...table.querySelectorAll('thead tr:first-child th')]
      .filter(th=>!th.classList.contains('cf-select-col'))
      .map(th=>(th.dataset.label || th.textContent).trim());

    const panel = table.closest('.panel');
    const title = (panel && panel.querySelector('h2,h3')) ? panel.querySelector('h2,h3').textContent.trim() : 'פירוט רשומות';
    const m = filtersFor(table,false);
    const activeFilters = [];
    if(m) for(const [idx, vals] of m){
      if(!vals || !vals.size) continue;
      const th = table.querySelectorAll('thead tr:first-child th')[idx];
      const label = th ? (th.dataset.label || th.textContent).trim() : 'עמודה '+idx;
      activeFilters.push(label+': '+[...vals].slice(0,6).join(', ')+(vals.size>6?' ועוד '+(vals.size-6):''));
    }

    const now = new Date();
    const stamp = String(now.getDate()).padStart(2,'0')+'/'+String(now.getMonth()+1).padStart(2,'0')+'/'+now.getFullYear()+
      ' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');

    let html = '<h1>'+escapeHtml(title)+'</h1><p class="pa-sub">'+

  /* ── מיון עמודות (כמו אקסל) ───────────────────────────
     מחזורי: עולה ← יורד ← ללא מיון (חזרה לסדר המקורי).
     שורות בת (חומרים בתוך מתקן בסיכום התוצרת) נשארות מוצמדות לשורת האב
     שלהן, ולכן המיון עובד על "בלוקים" ולא על שורות בודדות.
     ─────────────────────────────────────────────────── */
  const _colSorts = new Map();   // tableKey -> {idx, dir}

  function sortValue(text){
    const t = String(text||'').replace(/‏|‎/g,'').trim();
    if(!t) return {n:null, s:''};
    const d = t.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/);
    if(d){ let y=+d[3]; if(y<100) y+=2000; return {n: y*10000 + (+d[2])*100 + (+d[1]), s:t}; }
    const iso = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(iso) return {n: (+iso[1])*10000 + (+iso[2])*100 + (+iso[3]), s:t};
    const num = t.replace(/[,\s%]/g,'').replace(/[^\d.\-]/g,'');
    if(num && /^-?\d+(\.\d+)?$/.test(num) && /\d/.test(t)) return {n: parseFloat(num), s:t};
    return {n:null, s:t};
  }

  function tableBlocks(tbody){
    const blocks = [];
    [...tbody.rows].forEach(tr=>{
      const isChild = tr.classList.contains('os-mat');
      if(isChild && blocks.length) blocks[blocks.length-1].kids.push(tr);
      else blocks.push({ head:tr, kids:[] });
    });
    return blocks;
  }

  function applyColumnSort(table){
    const st = _colSorts.get(tableKey(table));
    const tbody = table.querySelector('tbody');
    if(!tbody) return;
    const blocks = tableBlocks(tbody);
    blocks.forEach((b,i)=>{ if(b.head.dataset.cfOrd === undefined) b.head.dataset.cfOrd = i; });

    if(!st || !st.dir){
      blocks.sort((a,b)=> (+a.head.dataset.cfOrd) - (+b.head.dataset.cfOrd));
    } else {
      const mul = st.dir === 'asc' ? 1 : -1;
      blocks.sort((a,b)=>{
        const A = sortValue(cellText(a.head, st.idx)), B = sortValue(cellText(b.head, st.idx));
        if(A.n !== null && B.n !== null){ if(A.n !== B.n) return (A.n - B.n) * mul; }
        else if(A.n !== null) return -1 * mul;
        else if(B.n !== null) return 1 * mul;
        const c = A.s.localeCompare(B.s, 'he', {numeric:true});
        if(c) return c * mul;
        return (+a.head.dataset.cfOrd) - (+b.head.dataset.cfOrd);
      });
    }
    const frag = document.createDocumentFragment();
    blocks.forEach(b=>{ frag.appendChild(b.head); b.kids.forEach(k=>frag.appendChild(k)); });
    tbody.appendChild(frag);

    table.querySelectorAll('thead tr:first-child th').forEach((th,i)=>{
      const btn = th.querySelector('.col-sort-btn');
      if(!btn) return;
      const active = st && st.dir && st.idx === i;
      btn.textContent = active ? (st.dir === 'asc' ? '▲' : '▼') : '⇅';
      th.classList.toggle('col-sorted', !!active);
    });
  }

  function cycleColumnSort(table, idx){
    const key = tableKey(table);
    const cur = _colSorts.get(key);
    let dir = 'asc';
    if(cur && cur.idx === idx) dir = cur.dir === 'asc' ? 'desc' : (cur.dir === 'desc' ? null : 'asc');
    if(dir) _colSorts.set(key, {idx, dir}); else _colSorts.delete(key);
    applyColumnSort(table);
  }

  function enhanceTablesWithFilters(){
    const scope = (typeof root!=='undefined' && root) ? root : document;
    scope.querySelectorAll('.table-scroll table').forEach(table=>{
      if(!table.querySelector('thead tr:first-child th') || !table.querySelector('tbody tr')) return;
      addSelectionColumn(table);
      const headCells = table.querySelectorAll('thead tr:first-child th');
      if(table.dataset.cfReady !== '1'){
        headCells.forEach((th,i)=>{
          if(th.classList.contains('cf-select-col')) return;
          if(th.querySelector('.col-filter-btn')) return;
          if(!th.dataset.label) th.dataset.label = th.textContent.trim();
          const sortBtn=document.createElement('button');
          sortBtn.type='button'; sortBtn.className='col-sort-btn'; sortBtn.textContent='⇅';
          sortBtn.title='מיון: עולה ← יורד ← ללא';
          sortBtn.onclick = ev=>{ ev.stopPropagation(); ev.preventDefault(); cycleColumnSort(table, i); };
          th.appendChild(sortBtn);
          const btn=document.createElement('button');
          btn.type='button'; btn.className='col-filter-btn'; btn.textContent='▼';
          btn.title='סינון עמודה';
          btn.onclick = ev=>{ ev.stopPropagation(); ev.preventDefault(); openColumnFilter(table, i, th); };
          th.appendChild(btn);
        });
        table.dataset.cfReady='1';
      }
      applyColumnSort(table);
      applyColumnFilters(table);
      updateTableToolbar(table);
    });
  }

      f.production += numberValue(e.production);
      f.packaging  += numberValue(e.packaging);
      const mk = materialLabel(e);
      let m = f.mats.get(mk);
      if(!m){ m = { name:mk, production:0, packaging:0, codes:new Set() }; f.mats.set(mk, m); }
      m.production += numberValue(e.production);
      m.packaging  += numberValue(e.packaging);
      const code = String(e.materialCode||'').replace(/\.0$/,'').trim();

      '<div class="table-scroll"><table class="os-table" style="min-width:auto"><thead><tr>'+
      '<th class="os-name-col">מתקן / חומר</th><th>ייצור בפועל</th><th>אריזה בפועל</th></tr></thead><tbody>';

    facs.forEach(f=>{

        html += '<tr class="os-mat os-of-'+escapeHtml(f.fac).replace(/[^\w-]/g,'_')+'" style="display:none">'+
          '<td class="os-mat-name os-name-col">'+escapeHtml(m.name)+
            (codes ? '<small class="os-mat-code">'+escapeHtml(codes)+'</small>' : '')+'</td>'+
          '<td>'+fmtNum(m.production)+'</td><td>'+fmtNum(m.packaging)+'</td></tr>';

    html += '</tbody></table></div></div>';

      tr.onclick = ()=>{

        host.querySelectorAll('tr.'+cls).forEach(r=> r.style.display = open ? '' : 'none');
      };

  function fmtNum(n){ return Math.round(n||0).toLocaleString('he-IL'); }

  // הדפסת הסיכום. בכוונה לא משתמשת בהדפסה הגנרית של הטבלאות: שם מודפס רק
  // מה שגלוי, ושורות החומר מוסתרות עד שפותחים מתקן — כך שהן היו נופלות מהדף.

  function openMaterialPicker(anchor, opts){
    closeColumnFilter();
    const sel = new Set(selectedMaterials && selectedMaterials.size ? selectedMaterials : opts);
    const pop = document.createElement('div');
    pop.className = 'col-filter-pop';
    pop.innerHTML = '<div class="cf-title">בחירת חומרים</div>'+
      '<input class="cf-search" type="text" placeholder="חיפוש שם חומר...">'+
      '<div class="cf-list"></div><div class="cf-count"></div>'+
      '<div class="cf-actions"><button type="button" class="cf-apply">אישור</button>'+
      '<button type="button" class="cf-none">כל החומרים</button></div>';
    root.appendChild(pop); _cfPop = pop;
    const list = pop.querySelector('.cf-list'), count = pop.querySelector('.cf-count'), search = pop.querySelector('.cf-search');
    function paint(term){
      const t=(term||'').trim().toLowerCase();
      const vis = opts.filter(v=>!t||v.toLowerCase().includes(t));
      list.innerHTML='';
      const all=document.createElement('label');
      all.innerHTML='<input type="checkbox"><span><b>(בחר הכל)</b></span>';
      all.querySelector('input').checked = vis.length>0 && vis.every(v=>sel.has(v));
      all.querySelector('input').onchange = e=>{ vis.forEach(v=> e.target.checked ? sel.add(v) : sel.delete(v)); paint(search.value); };
      list.appendChild(all);
      vis.slice(0,1000).forEach(v=>{
        const lab=document.createElement('label');
        const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=sel.has(v);
        cb.onchange=()=>{ cb.checked?sel.add(v):sel.delete(v); count.textContent=sel.size+' מתוך '+opts.length+' חומרים נבחרו'; };
        const sp=document.createElement('span'); sp.textContent=v; sp.title=v;
        lab.appendChild(cb); lab.appendChild(sp); list.appendChild(lab);
      });
      if(vis.length>1000){ const n=document.createElement('div'); n.className='cf-count';
        n.textContent='מוצגים 1,000 מתוך '+vis.length.toLocaleString('he-IL')+' — צמצמו בחיפוש'; list.appendChild(n); }
      count.textContent=sel.size+' מתוך '+opts.length+' חומרים נבחרו';
    }
    paint(''); search.oninput=()=>paint(search.value);
    pop.querySelector('.cf-apply').onclick=()=>{
      selectedMaterials = (sel.size===opts.length || sel.size===0) ? null : new Set(sel);
      closeColumnFilter(); renderAll();
    };
    pop.querySelector('.cf-none').onclick=()=>{ selectedMaterials=null; closeColumnFilter(); renderAll(); };
    const r=anchor.getBoundingClientRect();
    pop.style.top = Math.min(r.bottom+6, window.innerHeight-320)+'px';
    pop.style.left= Math.max(8, Math.min(r.left, window.innerWidth-286))+'px';
    setTimeout(()=>search.focus(),0);
  }

          '</div>'+
